<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2236"/><stop offset="1" stop-color="#0d1321"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c874"/><stop offset="1" stop-color="#b89a52"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe9d8"/><stop offset="1" stop-color="#d9d2bd"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d2bd"/><stop offset="1" stop-color="#efe9d8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- קשת עדינה סביב -->
  <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="#2e3b5e" stroke-width="4"/>

  <!-- סידור פתוח -->
  <g transform="translate(256 268)">
    <!-- צל -->
    <ellipse cx="0" cy="118" rx="168" ry="20" fill="#000" opacity=".25"/>

    <!-- דף שמאל -->
    <path d="M-6 -108 C -60 -132, -128 -134, -168 -122 L -168 88 C -128 76, -60 78, -6 100 Z"
          fill="url(#pageL)"/>
    <!-- דף ימין -->
    <path d="M6 -108 C 60 -132, 128 -134, 168 -122 L 168 88 C 128 76, 60 78, 6 100 Z"
          fill="url(#pageR)"/>
    <!-- שדרה -->
    <path d="M-6 -108 C -3 -104, 3 -104, 6 -108 L 6 100 C 3 96, -3 96, -6 100 Z" fill="#b89a52"/>
    <!-- קו מתאר -->
    <path d="M-6 -108 C -60 -132, -128 -134, -168 -122 L -168 88 C -128 76, -60 78, -6 100
             C 60 78, 128 76, 168 88 L 168 -122 C 128 -134, 60 -132, 6 -108"
          fill="none" stroke="#8a7a4e" stroke-width="5" stroke-linejoin="round"/>

    <!-- שורות טקסט -->
    <g stroke="#8a8266" stroke-width="7" stroke-linecap="round" opacity=".65">
      <line x1="-146" y1="-88" x2="-34" y2="-74"/>
      <line x1="-146" y1="-56" x2="-34" y2="-42"/>
      <line x1="-146" y1="-24" x2="-58" y2="-12"/>
      <line x1="-146" y1="8"   x2="-34" y2="20"/>
      <line x1="-146" y1="40"  x2="-70" y2="50"/>
      <line x1="34"  y1="-74" x2="146" y2="-88"/>
      <line x1="34"  y1="-42" x2="146" y2="-56"/>
      <line x1="58"  y1="-12" x2="146" y2="-24"/>
      <line x1="34"  y1="20"  x2="146" y2="8"/>
      <line x1="70"  y1="50"  x2="146" y2="40"/>
    </g>
  </g>

  <!-- פס זמן זהוב מתחת לסידור -->
  <g transform="translate(256 424)">
    <rect x="-150" y="-11" width="300" height="22" rx="11" fill="#232e4a" stroke="#2e3b5e" stroke-width="2"/>
    <rect x="-146" y="-7" width="176" height="14" rx="7" fill="url(#gold)"/>
    <circle cx="30" cy="0" r="17" fill="#0d1321" stroke="url(#gold)" stroke-width="5"/>
  </g>
</svg>
