  "וַיְדַבֵּר יְיָ אֶל משֶׁה לֵּאמֹר: דַּבֵּר אֶל אַהֲרֹן וְאֶל בָּנָיו לֵאמֹר, כֹּה תְבָרְכוּ אֶת בְּנֵי יִשְׂרָאֵל אָמוֹר לָהֶם:",
  "יְבָרֶכְךָ יְיָ וְיִשְׁמְרֶךָ: יָאֵר יְיָ פָּנָיו אֵלֶיךָ וִיחֻנֶּךָּ: יִשָּׂא יְיָ פָּנָיו אֵלֶיךָ וְיָשֵׂם לְךָ שָׁלוֹם:",
  "וְשָׂמוּ אֶת שְׁמִי עַל בְּנֵי יִשְׂרָאֵל וַאֲנִי אֲבָרֲכֵם:",
  "אֵלּוּ דְבָרִים שֶׁאֵין לָהֶם שִׁעוּר: הַפֵּאָה, וְהַבִּכּוּרִים, וְהָרְאָיוֹן, וּגְמִילוּת חֲסָדִים, וְתַלְמוּד תּוֹרָה: אֵלּוּ דְבָרִים שֶׁאָדָם אוֹכֵל פֵּרוֹתֵיהֶם בָּעוֹלָם הַזֶּה וְהַקֶּרֶן קַיֶּמֶת לָעוֹלָם הַבָּא, וְאֵלּוּ הֵן: כִּבּוּד אָב וָאֵם, וּגְמִילוּת חֲסָדִים, וְהַשְׁכָּמַת בֵּית הַמִּדְרָשׁ שַׁחֲרִית וְעַרְבִית, וְהַכְנָסַת אוֹרְחִים, וּבִקּוּר חוֹלִים, וְהַכְנָסַת כַּלָּה וְהַלְוָיַת הַמֵּת וְעִיּוּן תְּפִלָּה וַהֲבָאַת שָׁלוֹם שֶׁבֵּין אָדָם לַחֲבֵרוֹ, וּבֵין אִישׁ לְאִשְׁתּוֹ, וְתַלְמוּד תּוֹרָה כְּנֶגֶד כֻּלָּם:"
],

talit: [
  "בָּרוּךְ אַתָּה יְיָ אֱלֹהֵינוּ מֶלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָׁנוּ בְּמִצְוֹתָיו וְצִוָּנוּ עַל מִצְוַת צִיצִית:",
  "§ בשעת בדיקת הציצית יאמר זה",
  "בָּרְכִי נַפְשִׁי אֶת־יְיָ יְיָ אֱלֹהַי גָּדַלְתָּ מְּאֹד הוֹד וְהָדָר לָבָשְׁתָּ׃ עֹטֶה־אוֹר כַּשַּׂלְמָה נוֹטֶה שָׁמַיִם כַּיְרִיעָה׃",
  "§ בהתעטפו יכוין שציונו הקב״ה להתעטף בו כדי שנזכור כל מצותיו לעשותם שנאמר וראיתם אותו וזכרתם וגו׳",
  "בָּרוּךְ אַתָּה יְיָ אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָֽׁנוּ בְּמִצְוֹתָיו, וְצִוָּנוּ לְהִתְעַטֵּף בְּצִּיצִית:",
  "§ ובשעת עטיפת הטלית גדול יאמר זה",
  "מַה יָּקָר חַסְדְּךָ אֱלֹהִים וּבְנֵי אָדָם בְּצֵל כְּנָפֶֽיךָ יֶחֱסָֽיוּן: יִרְוְיֻן מִדֶּֽשֶׁן בֵּיתֶֽךָ וְנַֽחַל עֲדָנֶֽיךָ תַשְׁקֵם: כִּי־עִמְּךָ מְקוֹר חַיִּים, בְּאוֹרְךָ נִרְאֶה־אוֹר: מְשֹׁךְ חַסְדְּךָ לְיֹדְעֶֽיךָ וְצִדְקָתְךָ לְיִשְׁרֵי־לֵב:"
],

tefillin: [
  "§ ואחר הנחת התפלה של יד על הקיבורת קודם שמהדקה יברך",
  "בָּרוּךְ אַתָּה יְיָ אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָֽׁנוּ בְּמִצְוֹתָיו, וְצִוָּנוּ לְהָנִיחַ תְּפִלִּין:",
  "§ וצריך שיהיה הקשר של תפילין של ראש מאחורי הראש בגובה העורף באמצעו נראה כעין דלי״ת לצד חוץ שהיא לעין הרואה מלאחריו כעין דלי״ת בכתיבתו: ואם שח בין תפלה לתפלה יברך על של ראש",
  "בָּרוּךְ אַתָּה יְיָ אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָם, אֲשֶׁר קִדְּשָֽׁנוּ בְּמִצְוֹתָיו, וְצִוָּנוּ עַל מִצְוַת תְּפִלִּין:"
],

mahtovu: [
  "§ נכון לומר קודם התפלה",
  "הֲרֵינִי מְקַבֵּל עָלַי מִצְוַת עֲשֵׂה שֶׁל וְאָהַבְתָּ לְרֵעֲךָ כָּמוֹךָ:",
  "מַה־טֹּֽבוּ אֹהָלֶֽיךָ יַעֲקֹב, מִשְׁכְּנֹתֶֽיךָ יִשְׂרָאֵל: וַאֲנִי בְּרֹב חַסְדְּךָֽ אָבוֹא בֵיתֶֽךָ, אֶשְׁתַּחֲוֶה אֶל־הֵיכַל־קָדְשְׁךָֽ בְּיִרְאָתֶֽךָ: וַאֲנִי תְפִלָּתִי־לְךָ יְיָ, עֵת רָצוֹן, אֱלֹהִים בְּרָב־חַסְדֶּֽךָ, עֲנֵֽנִי בֶּאֱמֶת יִשְׁעֶֽךָ:",
  "אֲדוֹן עוֹלָם אֲשֶׁר מָלַךְ, בְּטֶֽרֶם כָּל־יְצוּר נִבְרָא: לְעֵת נַעֲשָׂה בְחֶפְצוֹ כֹּל, אֲזַי, מֶלֶךְ שְׁמוֹ נִקְרָא: וְאַחֲרֵי כִּכְלוֹת הַכֹּל, לְבַדּוֹ, יִמְלֹךְ נוֹרָא: וְהוּא הָיָה וְהוּא הֹוֶה, וְהוּא יִהְיֶה בְּתִפְאָרָה: וְהוּא אֶחָד וְאֵין שֵׁנִי, לְהַמְשִׁיל־לוֹ לְהַחְבִּֽירָה: בְּלִי רֵאשִׁית בְּלִי תַכְלִית, וְלוֹ הָעֹז וְהַמִּשְׂרָה: וְהוּא אֵלִי וְחַי גוֹאֲלִי, וְצוּר חֶבְלִי בְּעֵת צָרָה: וְהוּא נִסִּי וּמָנוֹס לִי, מְנָת כּוֹסִי בְּיוֹם אֶקְרָא: בְּיָדוֹ אַפְקִיד רוּחִי, בְּעֵת אִישַׁן וְאָעִירָה: וְעִם רוּחִי גְּוִיָּתִי, יְיָ לִי וְלֹא אִירָא:"
],

zochreinu: [
  "§ ביום שאין אומרים תחנון אין אומרים זה",
  "אֱלֹהֵינוּ וֵאלֹהֵי אֲבוֹתֵינוּ, זָכְרֵנוּ בְּזִכָּרוֹן טוֹב לְפָנֶיךָ, וּפָקְדֵנוּ בִּפְקֻדַּת יְשׁוּעָה וְרַחֲמִים מִשְּׁמֵי שְׁמֵי קֶדֶם, וּזְכָר־לָנוּ יְיָ אֱלֹהֵינוּ אַהֲבַת הַקַּדְמוֹנִים אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל עֲבָדֶיךָ, וְאֶת־הַבְּרִית וְאֶת־הַחֶסֶד וְאֶת־הַשְּׁבוּעָה שֶׁנִּשְׁבַּעְתָּ לְאַבְרָהָם אָבִינוּ בְּהַר הַמּוֹרִיָּה, וְאֶת־הָעֲקֵדָה שֶׁעָקַד אֶת־יִצְחָק בְּנוֹ עַל־גַּבֵּי הַמִּזְבֵּחַ, כַּכָּתוּב בְּתוֹרָתֶךָ:"
],

akeda: [
  "וַיְהִי אַחַר הַדְּבָרִים הָאֵֽלֶּה וְהָאֱלֹהִים נִסָּה אֶת־אַבְרָהָם וַיֹּֽאמֶר אֵלָיו אַבְרָהָם וַיֹּֽאמֶר הִנֵּֽנִי: וַיֹּֽאמֶר קַח־נָא אֶת־בִּנְךָ אֶת־יְחִידְךָ אֲשֶׁר־אָהַֽבְתָּ אֶת־יִצְחָק וְלֶךְ־לְךָ אֶל־אֶֽרֶץ הַמֹּרִיָּה וְהַעֲלֵֽהוּ שָׁם לְעֹלָה עַל אַחַד הֶהָרִים אֲשֶׁר אֹמַר אֵלֶֽיךָ: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּֽקֶר וַיַּחֲבשׁ אֶת־חֲמֹרוֹ וַיִּקַּח אֶת־שְׁנֵי נְעָרָיו אִתּוֹ וְאֵת יִצְחָק בְּנוֹ וַיְבַקַּע עֲצֵי עֹלָה וַיָּֽקָם וַיֵּֽלֶךְ אֶל־הַמָּקוֹם אֲשֶׁר־אָֽמַר־לוֹ הָאֱלֹהִֽים: בַּיּוֹם הַשְּׁלִישִׁי וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא אֶת־הַמָּקוֹם מֵרָחֹק: וַיֹּֽאמֶר אַבְרָהָם אֶל־נְעָרָיו שְׁבוּ־לָכֶם פֹּה עִם־הַחֲמוֹר וַאֲנִי וְהַנַּֽעַר נֵלְכָה עַד־כֹּה וְנִשְׁתַּחֲוֶה וְנָשֽׁוּבָה אֲלֵיכֶם: וַיִּקַּח אַבְרָהָם אֶת־עֲצֵי הָעֹלָה וַיָּֽשֶׂם עַל־יִצְחָק בְּנוֹ וַיִּקַּח בְּיָדוֹ אֶת־הָאֵשׁ וְאֶת־הַמַּאֲכֶֽלֶת וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו: וַיֹּֽאמֶר יִצְחָק אֶל־אַבְרָהָם אָבִיו וַיֹּֽאמֶר אָבִי וַיֹּֽאמֶר הִנֶּֽנִּי בְנִי וַיֹּֽאמֶר הִנֵּה הָאֵשׁ וְהָעֵצִים וְאַיֵּה הַשֶּׂה לְעֹלָֽה: וַיֹּֽאמֶר אַבְרָהָם אֱלֹהִים יִרְאֶה־לּוֹ הַשֶּׂה לְעֹלָה בְּנִי וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו: וַיָּבֹֽאוּ אֶל־הַמָּקוֹם אֲשֶׁר אָֽמַר־לוֹ הָאֱלֹהִים וַיִּֽבֶן שָׁם אַבְרָהָם אֶת־הַמִּזְבֵּֽחַ וַיַּעֲרֹךְ אֶת־הָעֵצִים וַיַּעֲקֹד אֶת־יִצְחָק בְּנוֹ וַיָּֽשֶׂם אֹתוֹ עַל־הַמִּזְבֵּֽחַ מִמַּֽעַל לָעֵצִים: וַיִּשְׁלַח אַבְרָהָם אֶת־יָדוֹ וַיִּקַּח אֶת־הַמַּאֲכֶֽלֶת לִשְׁחֹט אֶת־בְּנוֹ: וַיִּקְרָא אֵלָיו מַלְאַךְ יְיָ מִן־הַשָּׁמַֽיִם וַיֹּֽאמֶר אַבְרָהָם אַבְרָהָם וַיֹּֽאמֶר הִנֵּֽנִי: וַיֹּֽאמֶר אַל־תִּשְׁלַח יָֽדְךָ אֶל־הַנַּֽעַר וְאַל־תַּֽעַשׂ לוֹ מְאוּמָה כִּי עַתָּה יָדַֽעְתִּי כִּי־יְרֵא אֱלֹהִים אַֽתָּה וְלֹא חָשַֽׂכְתָּ אֶת־בִּנְךָ אֶת־יְחִידְךָ מִמֶּֽנִּי: וַיִּשָּׂא אַבְרָהָם אֶת־עֵינָיו וַיַּרְא וְהִנֵּה־אַֽיִל אַחַר נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו וַיֵּֽלֶךְ אַבְרָהָם וַיִּקַּח אֶת־הָאַֽיִל וַיַּעֲלֵֽהוּ לְעֹלָה תַּֽחַת בְּנוֹ: וַיִּקְרָא אַבְרָהָם שֵׁם־הַמָּקוֹם הַהוּא יְיָ יִרְאֶה אֲשֶׁר יֵאָמֵר הַיּוֹם בְּהַר יְיָ יֵרָאֶה: וַיִּקְרָא מַלְאַךְ יְיָ אֶל־אַבְרָהָם שֵׁנִית מִן־הַשָּׁמָֽיִם: וַיֹּאמֶר בִּי נִשְׁבַּֽעְתִּי נְאֻם־יְיָ כִּי יַֽעַן אֲשֶׁר עָשִֽׂיתָ אֶת־הַדָּבָר הַזֶּה וְלֹא חָשַֽׂכְתָּ אֶת־בִּנְךָ אֶת־יְחִידֶֽךָ: כִּי־בָרֵךְ אֲבָרֶכְךָ וְהַרְבָּה אַרְבֶּה אֶת־זַרְעֲךָ כְּכוֹכְבֵי הַשָּׁמַֽיִם וְכַחוֹל אֲשֶׁר עַל־שְׂפַת הַיָּם וְיִרַשׁ זַרְעֲךָ אֵת שַֽׁעַר אֹיְבָיו: וְהִתְבָּרְכוּ בְזַרְעֲךָ כֹּל גּוֹיֵי הָאָֽרֶץ עֵֽקֶב אֲשֶׁר שָׁמַֽעְתָּ בְּקֹלִי: וַיָּֽשָׁב אַבְרָהָם אֶל־נְעָרָיו וַיָּקֻֽמוּ וַיֵּלְכוּ יַחְדָּו אֶל־בְּאֵר שָֽׁבַע וַיֵּֽשֶׁב אַבְרָהָם בִּבְאֵר שָֽׁבַע:"
],

ribonoAkeda: [
  "§ ביום שאין אומרים תחנון אין אומרים זה",
  "רִבּוֹנוֹ שֶׁל עוֹלָם, כְּמוֹ שֶׁכָּבַשׁ אַבְרָהָם אָבִינוּ אֶת רַחֲמָיו מֵעַל בֶּן יְחִידוֹ לַעֲשׂוֹת רְצוֹנְךָ בְּלֵבָב שָׁלֵם, כֵּן יִכְבְּשׁוּ רַחֲמֶיךָ אֶת כַּעַסְךָ מֵעָלֵינוּ, וְיָגֹלּוּ רַחֲמֶיךָ עַל מִדּוֹתֶיךָ, וְתִתְנַהֵג עִמָּנוּ יְיָ אֱלֹהֵינוּ בְּמִדַּת הַחֶסֶד וּבְמִדַּת הָרַחֲמִים, וְתִכָּנֵס לָנוּ לִפְנִים מִשּׁוּרַת הַדִּין, וּבְטוּבְךָ הַגָּדוֹל יָשׁוּב חֲרוֹן אַפְּךָ מֵעַמְּךָ וּמֵעִירְךָ וּמֵאַרְצְךָ וּמִנַּחֲלָתֶךָ, וְקַיֶּם לָנוּ יְיָ אֱלֹהֵינוּ אֶת הַדָּבָר שֶׁהִבְטַחְתָּנוּ בְּתוֹרָתֶךָ, עַל יְדֵי משֶׁה עַבְדֶּךָ מִפִּי כְבוֹדֶךָ כָּאָמוּר, וְזָכַרְתִּי אֶת בְּרִיתִי יַעֲקוֹב, וְאַף אֶת בְּרִיתִי יִצְחָק, וְאַף אֶת בְּרִיתִי אַבְרָהָם אֶזְכֹּר וְהָאָרֶץ אֶזְכֹּר: וְנֶאֱמַר, וְאַף גַּם זֹאת בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם, לֹא מְאַסְתִּים וְלֹא גְעַלְתִּים לְכַלּוֹתָם, לְהָפֵר בְּרִיתִי אִתָּם כִּי אֲנִי יְיָ אֱלֹהֵיהֶם: וְנֶאֱמַר, וְזָכַרְתִּי לָהֶם בְּרִית רִאשֹׁנִים, אֲשֶׁר הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם, לְעֵינֵי הַגּוֹיִם לִהְיוֹת לָהֶם לֵאלֹהִים. אֲנִי יְיָ: וְנֶאֱמַר, וְשָׁ יְיָ אֱלֹהֶיךָ אֶת שְׁבוּתְךָ וְרִחֲמֶךָ, וְשָׁב וְקִבֶּצְךָ מִכָּל הָעַמִּים, אֲשֶׁר הֱפִיצְךָ יְיָ אֱלֹהֶיךָ שָׁמָּה: אִם יִהְיֶה נִדַּחֲךָ בִּקְצֵה הַשָּׁמָיִם, מִשָּׁם יְקַבֶּצְךָ יְיָ אֱלֹהֶיךָ וּמִשָּׁם יִקָּחֶךָ: וְנֶאֱמַר, וֶהֱבִיאֲךָ יְיָ אֱלֹהֶיךָ אֶל הָאָרֶץ אֲשֶׁר יָרְשׁוּ אֲבוֹתֶיךָ, וִירִשְׁתָּהּ, וְהֵיטִבְךָ וְהִרְבְּךָ מֵאֲבוֹתֶיךָ: וְנֶאֱמַר, יְיָ חָנֵּנוּ לְךָ קִוִּינוּ הֱיֵה זְרוֹעָם לַבְּקָרִים אַף יְשׁוּעָתֵנוּ בְּעֵת צָרָה: וְנֶאֱמַר, וְעֵת צָרָה הִיא לְיַעֲקֹב, וּמִמֶּנָּה יִוָּשֵׁעַ: וְנֶאֱמַר, בְּכָל צָרָתָם לוֹ לא כ' צָר, וּמַלְאַךְ פָּנָיו הוֹשִׁיעָם, בְּאַהֲבָתוֹ וּבְחֶמְלָתוֹ הוּא גְאָלָם, וַיְנַטְּלֵם וַיְנַשְּׂאֵם כָּל יְמֵי עוֹלָם: וְנֶאֱמַר, מִי אֵל כָּמוֹךָ נֹשֵׂא עָוֹן וְעוֹבֵר עַל פֶּשַׁע, לִשְׁאֵרִית נַחֲלָתוֹ, לֹא הֶחֱזִיק לָעַד אַפּוֹ, כִּי חָפֵץ חֶסֶד הוּא: יָשׁוּב יְרַחֲמֵנוּ, יִכְבֹּשׁ עֲוֹנוֹתֵינוּ, וְתַשְׁלִיךְ בִּמְצוּלוֹת יָם כָּל חַטֹּאתָם: תִּתֵּן אֱמֶת לְיַעֲקֹב, חֶסֶד לְאַבְרָהָם, אֲשֶׁר נִשְׁבַּעְתָּ לַאֲבוֹתֵינוּ מִימֵי קֶדֶם: וְנֶאֱמַר, וַהֲבִיאוֹתִים אֶל הַר קָדְשִׁי, וְשִׂמַּחְתִּים בְּבֵית תְּפִלָּתִי, עוֹלוֹתֵיהֶם וְזִבְחֵיהֶם לְרָצוֹן עַל מִזְבְּחִי, כִּי בֵיתִי בֵּית תְּפִלָּה, יִקָּרֵא לְכָל הָעַמִּים:"
],

leolam: [
  "לְעוֹלָֽם יְהֵא אָדָֽם יְרֵא שָׁמַֽיִם בַּסֵּֽתֶר, וּמוֹדֶֽה עַל־הָאֱמֶֽת, וְדוֹבֵֽר אֱמֶֽת בִּלְבָבֽוֹ וְיַשְׁכֵּֽם וְיֹאמַֽר:",
  "רִבּוֹן כָּל־הָעוֹלָמִים, לֹא עַל־צִדְקוֹתֵינוּ אֲנַחְנוּ מַפִּילִים תַּחֲנוּנֵינוּ לְפָנֶיךָ, כִּי עַל־רַחֲמֶיךָ הָרַבִּים. מָה אָנוּ, מֶה חַיֵּינוּ, מֶה חַסְדֵּנוּ, מַה־צִּדְקֵנוּ, מַה־כֹּחֵנוּ, מַה־גְּבוּרָתֵנוּ. מַה־נֹּאמַר לְפָנֶיךָ יְיָ אֱלֹהֵינוּ וֵאלֹהֵי אֲבוֹתֵינוּ, הֲלֹא כָּל־הַגִּבּוֹרִים כְּאַיִן לְפָנֶיךָ, וְאַנְשֵׁי הַשֵּׁם כְּלֹא הָיוּ, וַחֲכָמִים כִּבְלִי מַדָּע, וּנְבוֹנִים כִּבְלִי הַשְׂכֵּל, כִּי רוֹב מַעֲשֵׂיהֶם תֹּהוּ, וִימֵי חַיֵּיהֶם הֶבֶל לְפָנֶיךָ, וּמוֹתַר הָאָדָם מִן הַבְּהֵמָה אָיִן, כִּי הַכֹּל הָבֶל: לְבַד הַנְּשָׁמָה הַטְּהוֹרָה שֶׁהִיא עֲתִידָה לִתֵּן דִּין וְחֶשְׁבּוֹן לִפְנֵי כִסֵּא כְבוֹדֶךָ. וְכָל־הַגּוֹיִם כְּאַיִן נֶגְדֶּךָ. שֶׁנֶּאֱמַר הֵן גּוֹיִם כְּמַר מִדְּלִי וּכְשַׁחַק מֹאזְנַיִם נֶחְשָׁבוּ, הֵן אִיִּים כַּדַּק יִטֹּל:",
  "אֲבָל אֲנַחְנוּ עַמְּךָ בְּנֵי בְרִיתֶךָ, בְּנֵי אַבְרָהָם אֹהַבְךָ, שֶׁנִּשְׁבַּעְתָּ לּוֹ בְּהַר הַמּוֹרִיָּה. זֶרַע יִצְחָק יְחִידוֹ, שֶׁנֶּעֱקַד עַל־גַּבֵּי הַמִּזְבֵּחַ. עֲדַת יַעֲקֹב בִּנְךָ בְּכוֹרֶךָ, שֶׁמֵּאַהֲבָתְךָ שֶׁאָהַבְתָּ אוֹתוֹ, וּמִשִּׂמְחָתְךָ שֶׁשָּׂמַחְתָּ־בּוֹ, קָרָאתָ אֶת־שְׁמוֹ יִשְׂרָאֵל וִישֻׁרוּן:",
  "לְפִיכָךְ אֲנַחְנוּ חַיָּבִים לְהוֹדוֹת לְךָ, וּלְשַׁבֵּחֲךָ וּלְפָאֶרְךָ וּלְבָרֵךְ וּלְקַדֵּשׁ וְלִתֵּן שֶׁבַח וְהוֹדָיָה לִשְׁמֶךָ. אַשְׁרֵינוּ, מַה־טּוֹב חֶלְקֵנוּ, וּמַה־נָּעִים גּוֹרָלֵנוּ, וּמַה־יָּפָה יְרֻשָּׁתֵנוּ: אַשְׁרֵינוּ, שֶׁאָנוּ מַשְׁכִּימִים וּמַעֲרִיבִים עֶרֶב וָבֹקֶר וְאוֹמְרִים פַּעֲמַיִם בְּכָל־יוֹם:"
],

shmakatan: [
  "שְׁמַע יִשְׂרָאֵל, יְיָ אֱלֹהֵֽינוּ, יְיָ אֶחָד:",
  "בָּרוּךְ שֵׁם כְּבוֹד מַלְכוּתוֹ לְעוֹלָם וָעֶד:",
  "וְאָהַבְתָּ אֵת יְיָ אֱלֹהֶֽיךָ בְּכָל֯־לְ֯בָבְךָ וּבְכָל־נַפְשְׁךָ וּבְכָל־מְאֹדֶֽךָ: וְהָיוּ הַדְּבָרִים הָאֵֽלֶּה אֲשֶׁר֯ אָ֯נֹכִי מְצַוְּךָ הַיּוֹם עַל֯־לְ֯בָבֶֽךָ: וְשִׁנַּנְתָּם לְבָנֶֽיךָ וְדִבַּרְתָּ בָּם בְּשִׁבְתְּךָ בְּבֵיתֶֽךָ וּבְלֶכְתְּךָ בַדֶּֽרֶךְ וּבְשָׁכְבְּךָ וּבְקוּמֶֽךָ: וּקְשַׁרְתָּם לְאוֹת עַל֯־יָ֯דֶֽךָ וְהָיוּ לְטֹטָפֹת בֵּין עֵינֶֽיךָ: וּכְתַבְתָּם עַל־מְזֻזוֹת בֵּיתֶֽךָ וּבִשְׁעָרֶֽיךָ:",
  "אַתָּֽה־הֽוּא עַד שֶׁלֹּֽא נִבְרָֽא הָעוֹלָֽם, אַתָּֽה־הֽוּא מִשֶּׁנִּבְרָֽא הָעוֹלָֽם, אַתָּֽה־הֽוּא בָּעוֹלָֽם הַזֶּֽה, וְאַתָּֽה־הֽוּא לָעוֹלָֽם הַבָּֽא. קַדֵּֽשׁ אֶת־שִׁמְךָֽ בְּעוֹלָמֶֽךָ עַל־עַֽם מַקְדִּישֵֽׁי שְׁמֶֽךָ, וּבִישׁוּעָתְךָֽ מַלְכֵּֽנוּ תָּרֽוּם וְתַגְבִּֽיהַּ קַרְנֵֽנוּ, וְהוֹשִׁיעֵֽנוּ בְּקָרֽוֹב לְמַֽעַן שְׁמֶֽךָ. בָּרֽוּךְ הַמְקַדֵּֽשׁ שְׁמוֹ בָּרַבִּֽים:",
  "אַתָּה־הוּא יְיָ הָאֱלֹהִים בַּשָּׁמַֽיִם וּבָאָֽרֶץ, וּבִשְׁמֵי הַשָּׁמַֽיִם הָעֶלְיוֹנִים, אֱמֶת־אַתָּה הוּא רִאשׁוֹן, וְאַתָּה־הוּא אַחֲרוֹן, וּמִבַּלְעָדֶֽיךָ אֵין אֱלֹהִים. קַבֵּץ נְפוּצוֹת קֺוֶֽיךָ מֵאַרְבַּע כַּנְפוֹת הָאָֽרֶץ, יַכִּֽירוּ וְיֵדְעוּ כָּל־בָּאֵי עוֹלָם, כִּי אַתָּה־הוּא הָאֱלֹהִים לְבַדְּךָ לְכֹל מַמְלְכוֹת הָאָֽרֶץ. אַתָּה עָשִֽׂיתָ אֶת־הַשָּׁמַֽיִם וְאֶת־הָאָֽרֶץ, אֶת־הַיָּם וְאֶת־כָּל־אֲשֶׁר בָּם, וּמִי בְּכָל־מַעֲשֵׂה יָדֶֽיךָ בָּעֶלְיוֹנִים וּבַתַּחְתּוֹנִים, שֶׁיֹּאמַר לְךָ מַה־תַּעֲשֶׂה, ומַה־תִּפְעָל, אָבִינוּ שֶׁבַּשָּׁמַֽיִם, חַי וְקַיָם, עֲשֵׂה עִמָּֽנוּ צְדָקָה וָחֶֽסֶד בַּעֲבוּר שִׁמְךָ הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא שֶׁנִּקְרָא עָלֵֽינוּ, וְקַיֶּם־לָֽנוּ יְיָ אֶלֹהֵֽינוּ אֶת־הַדָבָר שֶׁהִבְטַחְתָּֽנוּ עַל־יְדֵי צְפַנְיָה חוֹזָךְ כָּאָמוּר: בָּעֵת הַהִיא אָבִיא אֶתְכֶם, וּבָעֵת קַבְּצִי אֶתְכֶם, כִּי־אֶתֵּן אֶתְכֶם לְשֵׁם וְלִתְהִלָּה בְּכֹל עַמֵּי הָאָֽרֶץ, בְּשׁוּבִי אֶת־שְׁבוּתֵיכֶם לְעֵינֵיכֶם, אָמַר יְיָ:"
],

leshem: [
  "לְשֵׁם יִחוּד קֻדְשָׁא בְּרִיךְ הוּא וּשְׁכִינְתֵּיהּ לְיַחֲדָא שֵׁם י״ה בו״ה בְּיִחוּדָא שְׁלִים בְּשֵׁם כָּל יִשְׂרָאֵל:"
],

deshen: [
  "§ נכון מאוד לומר בכל יום פרשת תרומת הדשן וסידור המערכה. ויכול לאמרה אפילו קודם אור היום בחורף. ובקיץ יאמרנה קודם פרשת התמיד",
  "וַיְדַבֵּר יְיָ אֶל־משֶׁה לֵּאמֹר: צַו אֶת־אַהֲרֹן וְאֶת־בָּנָיו לֵאמֹר זֹאת תּוֹרַת הָעֹלָה הִוא הָעֹלָה עַל מוֹקְדָה עַל־הַמִּזְבֵּֽחַ כָּל־הַלַּֽיְלָה עַד־הַבֹּֽקֶר וְאֵשׁ הַמִּזְבֵּֽחַ תּוּקַד בּוֹ: וְלָבַשׁ הַכֹּהֵן מִדּוֹ בַד וּמִכְנְסֵי־בַד יִלְבַּשׁ עַל־בְּשָׂרוֹ וְהֵרִים אֶת־הַדֶּֽשֶׁן אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה עַל־הַמִּזְבֵּֽחַ וְשָׂמוֹ אֵֽצֶל הַמִּזְבֵּֽחַ: וּפָשַׁט אֶת־בְּגָדָיו וְלָבַשׁ בְּגָדִים אֲחֵרִים וְהוֹצִיא אֶת־הַדֶּֽשֶׁן אֶל־מִחוּץ לַמַּחֲנֶה אֶל־מָקוֹם טָהוֹר: וְהָאֵשׁ עַל־הַמִּזְבֵּֽחַ תּֽוּקַד־בּוֹ לֹא תִכְבֶּה וּבִעֵר עָלֶֽיהָ הַכֹּהֵן עֵצִים בַּבֹּֽקֶר בַּבֹּֽקֶר וְעָרַךְ עָלֶֽיהָ הָעֹלָה וְהִקְטִיר עָלֶֽיהָ חֶלְבֵי הַשְּׁלָמִים: אֵשׁ תָּמִיד תּוּקַד עַל־הַמִּזְבֵּֽחַ לֹא תִכְבֶּה:"
],

yrTamid: [
  "§ ביום שאין אומרים תחנון אין אומרים זה",
  "יְהִי רָצוֹן מִלְּפָנֶֽיךָ יְיָ אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ, שֶׁתְּרַחֵם עָלֵֽינוּ וְתִמְחֹל לָֽנוּ עַל כָּל־חַטֹּאתֵֽינוּ, וּתְכַפֵּר לָֽנוּ עַל כָּל־עֲוֹנוֹתֵֽינוּ, וְתִמְחֹל וְתִסְלַח לָֽנוּ עַל כָּל־פְּשָׁעֵֽינוּ, וְשֶׁיִבָּנֶה בֵּית הַמִּקְדָּשׁ בִּמְהֵרָה בְיָמֵֽינוּ, וְנַקְרִיב לְפָנֶֽיךָ קָרְבַּן הַתָּמִיד שֶׁיְּכַפֵּר בַּעֲדֵֽנוּ, כְּמוֹ שֶׁכָּתַֽבְתָּ עָלֵֽינוּ בְּתוֹרָתֶֽךָ, עַל־יְדֵי משֶׁה עַבְדֶּֽךָ מִפִּי כְבוֹדֶֽךָ כָּאָמוּר:"
],

tamid: [
  "וַיְדַבֵּר יְיָ אֶל־משֶׁה לֵּאמֹר: צַו אֶת־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם, אֶת־קָרְבָּנִי לַחְמִי לְאִשַּׁי, רֵֽיחַ נִיחֹחִי תִּשְׁמְרוּ לְהַקְרִיב לִי בְּמוֹעֲדוֹ: וְאָמַרְתָּ לָהֶם, זֶה הָאִשֶּׁה אֲשֶׁר תַּקְרִֽיבוּ לַייָ, כְּבָשִׂים בְּנֵי־שָׁנָה תְמִימִם, שְׁנַֽיִם לַיּוֹם, עֹלָה תָמִיד: אֶת־הַכֶּֽבֶשׂ אֶחָד תַּעֲשֶׂה בַבֹּֽקֶר, וְאֵת הַכֶּֽבֶשׂ הַשֵּׁנִי תַּעֲשֶׂה בֵּין הָעַרְבָּֽיִם: וַֽעֲשִׂירִית הָאֵיפָה סֹֽלֶת לְמִנְחָה, בְּלוּלָה בְּשֶֽׁמֶן כָּתִית רְבִיעִת הַהִין: עֹלַת תָּמִיד, הָעֲשֻׂיָה בְּהַר סִינַי לְרֵֽיחַ נִיחֹֽחַ אִשֶּׁה לַייָ: וְנִסְכּוֹ רְבִיעִת הַהִין לַכֶּֽבֶשׂ הָאֶחָד, בַּקֹּֽדֶשׁ הַסֵּךְ נֶֽסֶךְ שֵׁכָר לַייָ: וְאֵת הַכֶּֽבֶשׂ הַשֵּׁנִי תַּעֲשֶׂה בֵּין הָעַרְבָּֽיִם, כְּמִנְחַת הַבֹּֽקֶר וּכְנִסְכּוֹ תַּעֲשֶׂה, אִשֵּׁה רֵֽיחַ נִיחֹֽחַ לַייָ:",
  "וְשָׁחַֽט אֹתֽוֹ עַל יֶֽרֶךְ הַמִּזְבֵּֽחַ צָפֹֽנָה לִפְנֵֽי יְיָ, וְזָרְקֽוּ בְּנֵי אַהֲרֹֽן הַכֹּהֲנִֽים אֶת־דָּמֽוֹ עַל־הַמִּזְבֵּֽחַ סָבִֽיב:"
],

ketoretP: [
  "אַתָּה־הוּא יְיָ אֱלֹהֵינוּ וֵאלֹהֵי אֲבוֹתֵינוּ, שֶׁהִקְטִירוּ אֲבוֹתֵינוּ לְפָנֶיךָ אֶת־קְטֹרֶת הַסַּמִּים, בִּזְמַן שֶׁבֵּית הַמִּקְדָּשׁ קַיָּם, כַּאֲשֶׁר צִוִּיתָ אוֹתָם עַל־יַד מֹשֶׁה נְבִיאֶךָ, כַּכָּתוּב בְּתוֹרָתֶךָ:",
  "וַיֹּֽאמֶר יְיָ אֶל־משֶׁה, קַח־לְךָ סַמִּים, נָטָף וּשְׁחֵֽלֶת, וְחֶלְבְּנָה, סַמִּים, וּלְבֹנָה זַכָּה, בַּד בְּבַד יִהְיֶה: וְעָשִֽׂיתָ אֹתָהּ קְטֹֽרֶת, רֹֽקַח מַעֲשֵׂה רוֹקֵֽחַ, מְמֻלָּח טָהוֹר קֹֽדֶשׁ: וְשָׁחַקְתָּ מִמֶּֽנָּה הָדֵק, וְנָתַתָּה מִמֶּֽנָּה לִפְנֵי הָעֵדֻת בְּאֹֽהֶל מוֹעֵד, אֲשֶׁר אִוָּעֵד לְךָ שָֽׁמָּה, קֹֽדֶשׁ קָדָשִׁים תִּהְיֶה לָכֶם: וְנֶאֱמַר, וְהִקְטִיר עָלָיו אַהֲרֹן קְטֹֽרֶת סַמִּים, בַּבֹּֽקֶר בַּבֹּֽקֶר בְּהֵיטִיבוֹ אֶת־הַנֵּרֹת יַקְטִירֶֽנָּה: וּבְהַעֲלֹת אַהֲרֹן אֶת־הַנֵּרֹת בֵּין הָֽעַרְבַּֽיִם יַקְטִירֶֽנָּה, קְטֹֽרֶת תָּמִיד לִפְנֵי יְיָ לְדֹרֹתֵיכֶם:"
],

ketoret: [
  "תָּנוּ רַבָּנָן, פִּטּוּם הַקְּטֹֽרֶת כֵּיצַד: שְׁלֹש מֵאוֹת וְשִׁשִּׁים וּשְׁמוֹנָה מָנִים הָיוּ בָהּ. שְׁלֹש מֵאוֹת וְשִׁשִּׁים וַחֲמִשָּׁה כְּמִנְיַן יְמוֹת הַחַמָּה, מָנֶה לְכָל־יוֹם, פְּרַס בַּשַּׁחֲרִית וּפְרַס בֵּין הָעַרְבָּֽיִם, וּשְׁלשָׁה מָנִים יְתֵרִים, שֶׁמֵּהֶם מַכְנִיס כֹּהֵן גָּדוֹל מְלֹא חָפְנָיו בְּיוֹם הַכִּפּוּרִים, וּמַחֲזִירָן לְמַכְתֶּֽשֶׁת בְּעֶֽרֶב יוֹם הַכִּפּוּרִים, וְשׁוֹחֲקָן יָפָה יָפָה כְּדֵי שֶׁתְּהֵא דַקָּה מִן הַדַּקָּה. וְאַחַד עָשָׂר סַמְּמָנִין הָֽיוּ בָהּ. וְאֵֽלּוּ־הֵן: א הַצֳּרִי ב וְהַצִּפֹּֽרֶן, ג הַחֶלְבְּנָה ד וְהַלְּבוֹנָה מִשְׁקַל שִׁבְעִים שִׁבְעִים מָנֶה, ה מוֹר ו וּקְצִיעָה, ז שִׁבֹּֽלֶת נֵרְדְּ ח וְכַרְכֹּם מִשְׁקַל שִׁשָּׁה עָשָׂר שִׁשָּׁה עָשָׂר מָנֶה, ט הַקּשְׁטְ שְׁנֵים עָשָׂר, י קִלּוּפָה שְׁלשָׁה, יא קִנָּמוֹן תִּשְׁעָה. בֹּרִית כַּרְשִׁינָה תִּשְׁעָה קַבִּין, יֵין קַפְרִיסִין סְאִין תְּלָתָא וְקַבִּין תְּלָתָא, וְאִם אֵין לוֹ יֵין קַפְרִיסִין מֵבִיא חֲמַר חִוַּרְיָן עַתִּיק. מֶֽלַח סְדוֹמִית רֹֽבַע, מַעֲלֶה עָשָׁן, כָּל־שֶׁהוּא. רַבִּי נָתָן הַבַּבְלִי אוֹמֵר: אַף כִּפַּת הַיַּרְדֵּן כָּל־שֶׁהִיא, וְאִם נָֽתַן בָּהּ דְּבַשׁ פְּסָלָהּ, וְאִם חִסַּר אֶחָד מִכָּל־סַמְּמָנֶֽיהָ חַיָּב מִיתָה:"
],

ketoretB: [
  "רַבָּן שִׁמְעוֹן בֶּן גַּמְלִיאֵל אוֹמֵר: הַצֳּרִי אֵינוֹ אֶלָּא שְׂרָף הַנּוֹטֵף מֵעֲצֵי הַקְּטָף, בֹּרִית כַּרְשִׁינָה שֶׁשָׁפִין בָּה אֶת־הַצִפֹּרֶן, כִּדֵי שֶׁתְּהֵא נָאָה. יֵין קַפְרִיסִין שֶׁשׁוֹרִין בּוֹ אֶת־הַצִפֹּרֶן, כְּדֵי שֶׁתְּהֵא עַזָּה. וַהֲלֹא מֵי רַגְלַֽיִם יָפִין לָהּ, אֶלָּא שֶׁאֵין מַכְנִיסִין מֵי רַגְלַֽיִם בַּמִּקְדָּשׁ מִפְּנֵי הַכָּבוֹד:",
  "תַּנְיָא רַבִּי נָתָן אוֹמֵר: כְּשֶׁהוּא שׁוֹחֵק אוֹמֵר: הָדֵק הֵיטֵב, הֵיטֵב הָדֵק, מִפְּנֵי שֶׁהַקּוֹל יָפֶה לַבְּשָׂמִים. פִּטְּמָהּ לַחֲצָאִין כְּשֵׁרָה, לִשְׁלִישׁ וְלִרְבִֽיעַ, לֹא שָׁמַֽעְנוּ: אָמַר רַבִּי יְהוּדָה זֶה הַכְּלָל, אִם כְּמִדָּתָהּ כְּשֵׁרָה לַחֲצָאִין. וְאִם חִסַּר אֶחָד מִכָּל־סַמְּמָנֶֽיהָ חַיָּב מִיתָה:",
  "תַּנְיָא בַּר קַפָּרָא אוֹמֵר: אַחַת לְשִׁשִּׁים אוֹ לְשִׁבְעִים שָׁנָה הָיְתָה בָאָה שֶׁל שִׁירַֽיִם לַחֲצָאִין: וְעוֹד תָּנֵי בַּר קַפָּרָא, אִלּוּ הָיָה נוֹתֵן בָּהּ קוֹרְטוֹב שֶׁל דְּבַשׁ, אֵין אָדָם יָכוֹל לַעֲמֹד מִפְּנֵי רֵיחָהּ, וְלָֽמָּה אֵין מְעָרְבִין בָּהּ דְּבַשׁ, מִפְּנֵי שֶׁהַתּוֹרָה אָמְרָה, כִּי כָל־שְׂאֹר וְכָל־דְּבַשׁ לֹא־תַקְטִֽירוּ מִמֶּֽנּוּ אִשֶּׁה לַייָ:"
],

tzvaot: [
  "§ שלושת הפסוקים הראשונים — כל אחד שלוש פעמים",
  "יְיָ צְבָאוֹת עִמָּנוּ, מִשְׂגָּב־לָנוּ אֱלֹהֵי יַעֲקֹב סֶלָה: יְיָ צְבָאוֹת, אַשְׁרֵי אָדָם בֹּטֵחַ בָּךְ: יְיָ הוֹשִׁיעָה, הַמֶּלֶךְ יַעֲנֵנוּ בְיוֹם־קָרְאֵנוּ:",
  "וְעָרְבָה לַיָי מִנְחַת יְהוּדָה וִירוּשָׁלָיִם, כִּימֵי עוֹלָם וּכְשָׁנִים קַדְמֹנִיּוֹת:"
],

abaye: [
  "אַבַּיֵּֽי הֲוָה מְסַדֵּֽר סֵֽדֶר הַמַּעֲרָכָה מִשְּׁמָא דִגְמָרָא, וְאַלִּבָּא דְאַבָּא שָׁאוּל, מַעֲרָכָה גְדוֹלָה קוֹדֶֽמֶת לְמַעֲרָכָה שְׁנִיָּה שֶׁל קְטֹֽרֶת, וּמַעֲרָכָה שְׁנִיָּה שֶׁל קְטֹֽרֶת קוֹדֶֽמֶת לְסִדּוּר שְׁנֵי גִזְרֵי עֵצִים, וְסִדּוּר שְׁנֵי גִזְרֵי עֵצִים קֽוֹדֶם לְדִשּׁוּן מִזְבֵּֽחַ הַפְּנִימִי, וְדִשּׁוּן מִזְבֵּֽחַ הַפְּנִימִי קֽוֹדֶם לְהַטָּבַת חָמֵשׁ נֵרוֹת, וְהַטָּבַת חָמֵשׁ נֵרוֹת קוֹדֶֽמֶת לְדַם הַתָּמִיד, וְדַם הַתָּמִיד קֽוֹדֶם לְהַטָּבַת שְׁתֵּי נֵרוֹת, וְהַטָּבַת שְׁתֵּי נֵרוֹת קוֹדֶֽמֶת לִקְטֹֽרֶת, וּקְטֹֽרֶת קוֹדֶֽמֶת לְאֵבָרִים, וְאֵבָרִים לְמִנְחָה, וּמִנְחָה לַחֲבִתִּין, וַחֲבִתִּין לִנְסָכִין, וּנְסָכִין לְמוּסָפִין, וּמוּסָפִין לְבָזִיכִין, וּבָזִיכִין קוֹדְמִין לְתָמִיד שֶׁל בֵּין הָעַרְבָּֽיִם, שֶׁנֶּאֱמַר, וְעָרַךְ עָלֶֽיהָ הָעֹלָה וְהִקְטִיר עָלֶֽיהָ חֶלְבֵי הַשְּׁלָמִים, עָלֶֽיהָ הַשְׁלֵם כָּל־הַקָּרְבָּנוֹת כֻּלָּם:",
  "אָֽנָּא, בְּכֹֽחַ גְּדֻלַּת יְמִינְךָ, תַּתִּיר צְרוּרָה. אב״ג ית״ץ",
  "קַבֵּל רִנַּת עַמְּךָ, שַׂגְּבֵֽנוּ, טַהֲרֵֽנוּ נוֹרָא. קר״ע שט״ן",
  "נָא גִבּוֹר, דּוֹרְשֵׁי יִחוּדְךָ כְּבָבַת שָׁמְרֵם. נג״ד יכ״ש",
  "בָּרְכֵם טַהֲרֵם, רַחֲמֵי צִדְקָתְךָ תָּמִיד גָּמְלֵם. בט״ר צת״ג",
  "חֲסִין קָדוֹשׁ, בְּרוֹב טוּבְךָ נַהֵל עֲדָתֶֽךָ. חק״ב טנ״ע",
  "יָחִיד גֵּאֶה לְעַמְּךָ פְּנֵה, זוֹכְרֵי קְדֻשָּׁתֶֽךָ. יג״ל פז״ק",
  "שַׁוְעָתֵֽנוּ קַבֵּל וּשְׁמַע צַעֲקָתֵֽנוּ, יוֹדֵֽעַ תַּעֲלוּמוֹת. שק״ו צי״ת",
  "בָּרוּךְ שֵׁם כְּבוֹד מַלְכוּתוֹ לְעוֹלָם וָעֶד:"
],

ribonAbaye: [
  "§ ביום שאין אומרים תחנון אין אומרים זה",
  "רִבּֽוֹן הָעוֹלָמִֽים, אַתָּֽה צִוִּיתָֽנוּ, לְהַקְרִֽיב קָרְבַּֽן הַתָּמִֽיד בְּמוֹעֲדֽוֹ, וּלְהַקְטִֽיר הַקְּטֹֽרֶת בְּזְמַנָּֽהּ, וְלִהְיוֹת הַכֹּהֲנִים בַּעֲבוֹדָתָם, וּלְוִיִּים בְּדוּכָנָם, וְיִשְׂרָאֵל בְּמַעֲמָדָם, וְעַתָּה בַּעֲוֹנוֹתֵינוּ, חָרַב בֵּית הַמִּקְדָּֽשׁ וּבֻטַּֽל הַתָּמִֽיד וְהַקְּטֹֽרֶת, וְאֵין לָנוּ לֹא כֹהֵן בַּעֲבוֹדָתוֹ, וְלֹא לֵוִי בְּדוּכָנוֹ, וְלא יִשְֹרָאֵל בְּמַעֲמָדוֹ: לָכֵן יְהִי רָצוֹן מִלְּפָנֶיךָ יְיָ אֱלֹהֵינוּ וֵאלֹהֵי אֲבוֹתֵינוּ, שֶׁיְּהֵא שִֹיחַ שִׂפְתוֹתֵינוּ חָשׁוּב וּמְקֻבָּל לְפָנֶיךָ, כְּאִלּוּ הִקְרַבְנוּ קָרְבַּן הַתָּמִיד בְּמוֹעֲדוֹ וְעָמַדְנוּ עַל מַעֲמָדוֹ, וְהִקְּטַרְנוּ הַקְּטֹרֶת בִּזְמַנָּהּ, כְּמָה שֶׁנֶּאֱמַר, וּנְשַׁלְּמָה פָרִים שְׂפָתֵינוּ: וְנֶּאֱמַר, זֹאת הַתּוֹרָה לָעֹלָה, לַמִּנְחָה וְלַחַטָּאת וְלָאָשָׁם וְלַמִּלּוּאִים וּלְזֶבַח הַשְּׁלָמִים:"
],

eizehu: [
  "א אֵיזֶהוּ מְקוֹמָן שֶׁל זְבָחִים, קָדְשֵׁי קָדָשִׁים שְׁחִיטָתָן בַּצָּפוֹן. פָּר וְשָׂעִיר שֶׁל יוֹם הַכִּפּוּרִים שְׁחִיטָתָן בַּצָּפוֹן, וְקִבּוּל דָּמָן בִּכְלִי שָׁרֵת בַּצָּפוֹן, וְדָמָן טָעוּן הַזָּיָה עַל בֵּין הַבַּדִּים, וְעַל הַפָּרֹכֶת, וְעַל מִזְבַּח הַזָּהָב. מַתָּנָה אַחַת מֵהֶן מְעַכָּבֶת. שְׁיָרֵי הַדָּם הָיָה שׁוֹפֵךְ עַל יְסוֹד מַעֲרָבִי שֶׁל מִזְבֵּחַ הַחִיצוֹן, אִם לֹא נָתַן לֹא עִכֵּב:",
  "ב פָּרִים הַנִּשְֹרָפִים וּשְֹעִירִים הַנִּשְֹרָפִים שְׁחִיטָתָן בַּצָּפוֹן, וְקִבּוּל דָּמָן בִּכְלִי שָׁרֵת בַּצָּפוֹן, וְדָמָן טָעוּן הַזָּיָה עַל הַפָּרֹכֶת, וְעַל מִזְבַּח הַזָּהָב. מַתָּנָה אַחַת מֵהֶן מְעַכָּבֶת, שְׁיָרֵי הַדָּם, הָיָה שׁוֹפֵךְ עַל יְסוֹד מַעֲרָבִי שֶׁל מִזְבֵּחַ הַחִיצוֹן, אִם לֹא נָתַן לֹא עִכֵּב, אֵלּוּ וָאֵלּוּ נִשְֹרָפִין בְּבֵית הַדָּשֶׁן:",
  "ג חַטָּאוֹת הַצִּבּוּר וְהַיָּחִיד, אֵלּוּ הֵן חַטּאוֹת הַצִּבּוּר: שְֹעִירֵי רָאשֵׁי חֳדָשִׁים וְשֶׁל מוֹעֲדוֹת, שְׁחִיטָתָן בַּצָּפוֹן, וְקִבּוּל דָּמָן בִּכְלִי שָׁרֵת בַּצָּפוֹן, וְדָמָן טָעוּן אַרְבַּע מַתָּנוֹת עַל אַרְבַּע קְרָנוֹת, כֵּיצַד: עָלָה בַכֶּבֶשׁ וּפָנָה לַסּוֹבֵב, וּבָא לוֹ לְקֶרֶן דְּרוֹמִית מִזְרָחִית, מִזְרָחִית צְפוֹנִית, צְפוֹנִית מַעֲרָבִית, מַעֲרָבִית דְּרומִית. שְׁיָרֵי הַדָּם הָיָה שׁוֹפֵךְ עַל יְסוֹד דְּרומִי, וְנֶאֱכָלִין לִפְנִים מִן הַקְּלָעִים לְזִכְרֵי כְהֻנָּה בְּכָל מַאֲכָל, לְיוֹם וָלַיְלָה עַד חֲצוֹת:",
  "ד הָעוֹלָה, קדֶשׁ קָדָשִׁים, שְׁחִיטָתָהּ בַּצָּפוֹן, וְקִבּוּל דָּמָהּ בִּכְלִי שָׁרֵת בַּצָּפוֹן, וְדָמָהּ טָעוּן שְׁתֵּי מַתָּנוֹת שֶׁהֵן אַרְבַּע, וּטְעוּנָה הֶפְשֵׁט וְנִתּוּחַ, וְכָלִיל לָאִשִּׁים:",
  "ה זִבְחֵי שַׁלְמֵי צִבּוּר וַאֲשָׁמוֹת, אֵלּוּ הֵן אֲשָׁמות: אֲשַׁם גְּזֵלוֹת, אֲשַׁם מְעִילוֹת, אֲשַׁם שִׁפְחָה חֲרוּפָה, אֲשַׁם נָזִיר, אֲשַׁם מְצוֹרָע, אָשָׁם תָּלוּי. שְׁחִיטָתָן בַּצָּפוֹן, וְקִבּוּל דָּמָן בִּכְלִי שָׁרֵת בַּצָּפוֹן, וְדָמָן טָעוּן שְׁתֵּי מַתָּנוֹת שֶׁהֵן אַרְבַּע, וְנֶאֱכָלִין לִפְנִים מִן הַקְּלָעִים לְזִכְרֵי כְהֻנָּה, בְּכָל מַאֲכָל, לְיוֹם וָלַיְלָה עַד חֲצוֹת:",
  "ו הַתּוֹדָה וְאֵיל נָזִיר, קָדָשִׁים קַלִּים, שְׁחִיטָתָן בְּכָל מָקוֹם בָּעֲזָרָה, וְדָמָן טָעוּן שְׁתֵּי מַתָּנוֹת שֶׁהֵן אַרְבַּע, וְנֶאֱכָלִין בְּכָל הָעִיר, לְכָל אָדָם, בְּכָל מַאֲכָל, לְיוֹם וָלַיְלָה עַד חֲצוֹת: הַמּוּרָם מֵהֶם כַּיּוֹצֵא בָהֶם, אֶלָּא שֶׁהַמּוּרָם נֶאֱכָל לַכּהֲנִים לִנְשֵׁיהֶם וְלִבְנֵיהֶם וּלְעַבְדֵיהֶם:",
  "ז שְׁלָמִים, קָדָשִׁים קַלִּים, שְׁחיטָתָן בְּכָל מָקוֹם בָּעֲזָרָה, וְדָמָן טָעוּן שְׁתֵּי מַתָּנוֹת שֶׁהֵן אַרְבַּע, וְנֶאֱכָלִין בְּכָל הָעִיר, לְכָל אָדָם, בְּכָל מַאֲכָל, לִשְׁנֵי יָמִים וְלַיְלָה אֶחָד. הַמּוּרָם מֵהֶם, כַּיּוֹצֵא בָהֶם, אֶלָּא, שֶׁהַמּוּרָם נֶאֱכָל לַכּהֲנִים לִנְשֵׁיהֶם וְלִבְנֵיהֶם וּלְעַבְדֵיהֶם:",
  "ח הַבְּכוֹר וְהַמַּעֲשֵֹר וְהַפֶּסַח, קָדָשִׁים קַלִּים שְׁחִיטָתָן בְּכָל מָקוֹם בָּעֲזָרָה, וְדָמָן טָעוּן מַתָּנָה אֶחָת, וּבִלְבָד שֶׁיִּתֵּן כְּנֶגֶד הַיְסוֹד. שִׁנָּה בַאֲכִילָתָן, הַבְּכוֹר נֶאֱכָל לַכֹּהֲנִים, וְהַמַּעֲשֵֹר לְכָל אָדָם, וְנֶאֱכָלִין בְּכָל הָעִיר, בְּכָל מַאֲכָל, לִשְׁנֵי יָמִים וְלַיְלָה אֶחָד. הַפֶּסַח אֵינוֹ נֶאֱכָל אֶלָּא בַלַּיְלָה, וְאֵינוֹ נֶאֱכָל אֶלָּא עַד חֲצוֹת, וְאֵינוֹ נֶאֱכָל אֶלָּא לִמְנוּיָו, וְאֵינוֹ נֶאֱכָל אֶלָּא צָלִי:"
],

ryishmael: [
  "רַבִּֽי יִשְׁמָעֵֽאל אוֹמֵֽר, בִּשְׁלֽשׁ עֶשְׂרֵֽה מִדּֽוֹת הַתּוֹרָֽה נִדְרֶֽשֶׁת: א מִקַּֽל וָחֹֽמֶר. ב וּמִגְּזֵרָֽה שָׁוָֽה. ג מִבִּנְיַֽן אָב מִכָּתֽוּב אֶחָֽד, וּמִבִּנְיַֽן אָב מִשְּׁנֵֽי כְתוּבִֽים. ד מִכְּלָֽל וּפְרָֽט. ה וּמִפְּרָֽט וּכְלָֽל. ו כְּלָֽל וּפְרָֽט וּכְלָֽל, אִי אַתָּֽה דָן אֶֽלָּא כְּעֵֽין הַפְּרָֽט. ז מִכְּלָֽל שֶׁהֽוּא צָרִֽיךְ לִפְרָֽט, וּמִפְּרָֽט שֶׁהֽוּא צָרִֽיךְ לִכְלָֽל. ח כָּל־דָּבָֽר שֶׁהָיָֽה בִּכְלָֽל וְיָצָֽא מִן הַכְּלָֽל לְלַמֵּֽד, לֹא לְלַמֵּֽד עַל עַצְמֽוֹ יָצָֽא, אֶֽלָּא לְלַמֵּֽד עַל־הַכְּלָֽל כֻּלּֽוֹ יָצָֽא. ט כָּל־דָּבָֽר שֶׁהָיָֽה בִּכְלָֽל, וְיָצָֽא לִטְעֽוֹן טַֽעַן אֶחָֽד שֶׁהֽוּא כְעִנְיָנֽוֹ, יָצָֽא לְהָקֵֽל וְלֹא לְהַחֲמִֽיר. י כָּל־דָּבָֽר שֶׁהָיָֽה בִּכְלָֽל וְיָצָֽא לִטְעֽוֹן טַֽעַן אַחֵֽר שֶׁלֹּֽא כְעִנְיָנֽוֹ, יָצָֽא לְהָקֵֽל וּלְהַחֲמִֽיר. יא כָּל־דָּבָֽר שֶׁהָיָֽה בִּכְלָֽל וְיָצָֽא לִדּֽוֹן בְּדָּבָֽר חָדָֽשׁ, אִי אַתָּֽה יָכֽוֹל לְהַחֲזִירֽוֹ לִכְלָלֽוֹ, עַד שֶׁיַּחֲזִירֶֽנּוּ הַכָּתֽוּב לִכְלָלֽוֹ בְּפֵרֽוּשׁ. יב דָּבָֽר הַלָּמֵֽד מֵעִנְיָנֽוֹ, וְדָבָֽר הַלָּמֵֽד מִסּוֹפֽוֹ. יג וְכֵן (נ״א וכאן) שְׁנֵי כְתוּבִֽים הַמַּכְחִישִֽׁים זֶה אֶת־זֶה, עַד שֶׁיָּבֹֽא הַכָּתֽוּב הַשְּׁלִישִֽׁי וְיַכְרִֽיעַ בֵּינֵיהֶֽם:",
  "יְהִי רָצוֹן מִלְּפָנֶֽיךָ, יְיָ אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ, שֶׁיִּבָּנֶה בֵּית הַמִּקְדָּשׁ בִּמְהֵרָה בְיָמֵֽינוּ, וְתֵן חֶלְקֵֽנוּ בְּתוֹרָתֶֽךָ:"
],

kdRabanan1: [
  "יִתְגַּדַּֽל וְיִתְקַדַּֽשׁ שְׁמֵהּ רַבָּֽא. אמן בְּעָלְמָֽא דִּי בְרָֽא כִרְעוּתֵהּ וְיַמְלִֽיךְ מַלְכוּתֵֽהּ, וְיַצְמַח פּוּרְקָנֵהּ וִיקָרֵב מְשִׁיחֵהּ. אמן בְּחַיֵּיכוֹן וּבְיוֹמֵיכוֹן וּבְחַיֵּֽי דְכָל־בֵּֽית יִשְׂרָאֵֽל, בַּעֲגָלָא וּבִזְמַֽן קָרִיב וְאִמְרֽוּ אָמֵֽן: יְהֵא שְׁמֵהּ רַבָּֽא מְבָרַֽךְ לְעָלַֽם וּלְעָלְמֵֽי עָלְמַיָּֽא. יִתְבָּרֵֽךְ, וְיִשְׁתַּבַּֽח, וְיִתְפָּאֵֽר, וְיִתְרוֹמָֽם, וְיִתְנַשֵּֽׂא, וְיִתְהַדָּֽר, וְיִתְעַלֶּֽה, וְיִתְהַלָּֽל, שְׁמֵהּ דְקוּדְשָׁא בְּרִיךְ הוּא. אמן לְעֵֽלָּא מִן כָּל־בִּרְכָתָא וְשִׁירָתָא, תֻּשְׁבְּחָתָא וְנֶחֱמָתָא, דַּאֲמִירָן בְּעָלְמָֽא, וְאִמְרוּ אָמֵן:",
  "עַל יִשְׂרָאֵֽל וְעַל רַבָּנָֽן. וְעַל תַּלְמִידֵיהוֹן וְעַל כָּל־תַּלְמִידֵֽי תַלְמִידֵיהוֹן. וְעַל כָּל־מָאן דְּעָסְקִין בְּאוֹרַיְתָא. דִּי־בְאַתְרָא הָדֵין וְדִי בְכָל־אֲתַר וַאֲתַר יְהֵא לְהוֹן וּלְכוֹן שְׁלָמָא רַבָּֽא חִנָּא וְחִסְדָּא וְרַחֲמִין וְחַיִּין־אֲרִיכִין וּמְזוֹנָא־רְוִיחָא וּפֻרְקָנָא מִן קֳדָם אֲבוּהוֹן דְבִשְׁמַיָּֽא וְאִמְרוּ אָמֵן: יְהֵא שְׁלָמָא רַבָּֽא מִן־שְׁמַיָּֽא וְחַיִּֽים טוֹבִֽים עָלֵֽינוּ וְעַל כָּל־יִשְׂרָאֵֽל וְאִמְרֽוּ אָמֵֽן: עֹשֶֽׂה שָׁלֽוֹם (בעשי״ת הַשָּׁלֽוֹם) בִּמְרוֹמָֽיו הוּא יַעֲשֶֽׂה שָׁלֽוֹם עָלֵֽינוּ וְעַל כָּל־יִשְׂרָאֵֽל וְאִמְרֽוּ אָמֵֽן:"
],

hodu: [
  "הוֹדוּ לַייָ קִרְאוּ בִשְׁמוֹ הוֹדִֽיעוּ בָעַמִּים עֲלִילֹתָיו: שִֽׁירוּ לוֹ זַמְּרוּ־לוֹ שִֽׂיחוּ בְּכָל־נִפְלְאוֹתָיו: הִתְהַלְּלוּ בְּשֵׁם קָדְשׁוֹ יִשְׂמַח לֵב מְבַקְשֵׁי יְיָ: דִּרְשׁוּ יְיָ וְעֻזּוֹ בַּקְּשׁוּ פָנָיו תָּמִיד: זִכְרוּ נִפְלְאֹתָיו אֲשֶׁר עָשָׂה מֹפְתָיו וּמִשְׁפְּטֵי־פִֽיהוּ: זֶֽרַע יִשְׂרָאֵל עַבְדּוֹ בְּנֵי יַעֲקֹב בְּחִירָיו: הוּא יְיָ אֱלֹהֵֽינוּ בְּכָל־הָאָֽרֶץ מִשְׁפָּטָיו: זִכְרוּ לְעוֹלָם בְּרִיתוֹ דָּבָר צִוָּה לְאֶֽלֶף דּוֹר: אֲשֶׁר כָּרַת אֶת־אַבְרָהָם וּשְׁבוּעָתוֹ לְיִצְחָק: וַיַּעֲמִידֶֽהָ לְיַעֲקֹב לְחֹק לְיִשְׂרָאֵל בְּרִית עוֹלָם: לֵאמֹר לְךָ אֶתֵּן אֶֽרֶץ־כְּנָעַן חֶֽבֶל נַחֲלַתְכֶם: בִּהְיוֹתְכֶם מְתֵי מִסְפָּר כִּמְעַט וְגָרִים בָּהּ: וַיִּתְהַלְּכוּ מִגּוֹי אֶל־גּוֹי וּמִמַּמְלָכָה אֶל־עַם אַחֵר: לֹא־הִנִּֽיחַ לְאִישׁ לְעָשְׁקָם וַיּֽוֹכַח עֲלֵיהֶם מְלָכִים: אַל־תִּגְּעוּ בִּמְשִׁיחָי וּבִנְבִיאַי אַל־תָּרֵֽעוּ: שִֽׁירוּ לַייָ כָּל־הָאָֽרֶץ בַּשְּׂרוּ מִיּוֹם־אֶל־יוֹם יְשׁוּעָתוֹ: סַפְּרוּ בַגּוֹיִם אֶת־כְּבוֹדוֹ בְּכָל־הָעַמִּים נִפְלְאֹתָיו: כִּי גָדוֹל יְיָ וּמְהֻלָּל מְאֹד וְנוֹרָא הוּא עַל־כָּל־אֱלֹהִים: כִּי כָּל־אֱלֹהֵי הָעַמִּים אֱלִילִים וַייָ שָׁמַֽיִם עָשָׂה:",
  "הוֹד וְהָדָר לְפָנָיו עֹז וְחֶדְוָה בִּמְקֹמוֹ: הָבוּ לַייָ מִשְׁפְּחוֹת עַמִּים הָבוּ לַייָ כָּבוֹד וָעֹז: הָבוּ לַייָ כְּבוֹד שְׁמוֹ שְׂאוּ מִנְחָה וּבֹֽאוּ לְפָנָיו הִשְׁתַּחֲווּ לַייָ בְּהַדְרַת־קֹֽדֶשׁ: חִֽילוּ מִלְּפָנָיו כָּל־הָאָֽרֶץ אַף־תִּכּוֹן תֵּבֵל בַּל־תִּמּוֹט: יִשְׂמְחוּ הַשָּׁמַֽיִם וְתָגֵל הָאָֽרֶץ וְיֹאמְרוּ בַגּוֹיִם יְיָ מָלָךְ: יִרְעַם הַיָּם וּמְלוֹאוֹ יַעֲלֹץ הַשָּׂדֶה וְכָל־אֲשֶׁר־בּוֹ: אָז יְרַנְּנוּ עֲצֵי הַיָּעַר מִלִּפְנֵי יְיָ כִּי־בָא לִשְׁפּוֹט אֶת־הָאָֽרֶץ: הוֹדוּ לַייָ כִּי טוֹב כִּי לְעוֹלָם חַסְדּוֹ: וְאִמְרוּ הוֹשִׁיעֵֽנוּ אֱלֹהֵי יִשְׁעֵֽנוּ וְקַבְּצֵֽנוּ וְהַצִּילֵֽנוּ מִן־הַגּוֹיִם לְהוֹדוֹת לְשֵׁם קָדְשֶֽׁךָ לְהִשְׁתַּבֵּֽחַ בִּתְהִלָּתֶֽךָ: בָּרוּךְ יְיָ אֱלֹהֵי יִשְׂרָאֵל מִן־הָעוֹלָם וְעַד הָעֹלָם וַיֹּאמְרוּ כָל־הָעָם אָמֵן וְהַלֵּל לַייָ: רוֹמְמוּ יְיָ אֱלֹהֵֽינוּ וְהִשְׁתַּחֲווּ לַהֲדֹם רַגְלָיו קָדוֹשׁ הוּא: רוֹמְמוּ יְיָ אֱלֹהֵֽינוּ וְהִשְׁתַּחֲווּ לְהַר קָדְשׁוֹ כִּי קָדוֹשׁ יְיָ אֱלֹהֵֽינוּ:",
  "וְהוּא רַחוּם יְכַפֵּר עָוֹן וְלֹא־יַשְׁחִית וְהִרְבָּה לְהָשִׁיב אַפּוֹ וְלֹא־יָעִיר כָּל־חֲמָתוֹ: אַתָּה יְיָ לֹא־תִכְלָא רַחֲמֶֽיךָ מִמֶּֽנִּי חַסְדְּךָ וַאֲמִתְּךָ תָּמִיד יִצְּרֽוּנִי: זְכֹר רַחֲמֶֽיךָ יְיָ וַחֲסָדֶֽיךָ כִּי מֵעוֹלָם הֵֽמָּה: תְּנוּ עֹז לֵאלֹהִים עַל־יִשְׂרָאֵל גַּאֲוָתוֹ וְעֻזּוֹ בַּשְּׁחָקִים: נוֹרָא אֱלֹהִים מִמִּקְדָּשֶֽׁיךָ אֵל יִשְׂרָאֵל הוּא נֹתֵן עֹז וְתַעֲצֻמוֹת לָעָם בָּרוּךְ אֱלֹהִים: אֵל־נְקָמוֹת יְיָ אֵל נְקָמוֹת הוֹפִֽיעַ: הִנָּשֵׂא שֹׁפֵט הָאָֽרֶץ הָשֵׁב גְּמוּל עַל־גֵּאִים: לַייָ הַיְשׁוּעָה עַל־עַמְּךָ בִרְכָתֶֽךָ סֶּֽלָה: יְיָ צְבָאוֹת עִמָּנוּ מִשְׂגָּב לָֽנוּ אֱלֹהֵי יַעֲקֹב סֶֽלָה: יְיָ צְבָאוֹת אַשְׁרֵי אָדָם בֹּטֵֽחַ בָּךְ: יְיָ הוֹשִֽׁיעָה הַמֶּֽלֶךְ יַעֲנֵֽנוּ בְיוֹם־קָרְאֵֽנוּ:",
  "הוֹשִֽׁיעָה אֶת־עַמֶּֽךָ וּבָרֵךְ אֶת־נַחֲלָתֶֽךָ וּרְעֵם וְנַשְּׂאֵם עַד־הָעוֹלָם: נַפְשֵֽׁנוּ חִכְּתָה לַייָ עֶזְרֵֽנוּ וּמָגִנֵּֽנוּ הוּא: כִּי־בוֹ יִשְׂמַח לִבֵּֽנוּ כִּי בְשֵׁם קָדְשׁוֹ בָטָֽחְנוּ: יְהִי־חַסְדְּךָ יְיָ עָלֵֽינוּ כַּאֲשֶׁר יִחַֽלְנוּ לָךְ: הַרְאֵֽנוּ יְיָ חַסְדֶּֽךָ וְיֶשְׁעֲךָ תִּֽתֶּן־לָֽנוּ: קֽוּמָה עֶזְרָֽתָה לָּנוּ וּפְדֵֽנוּ לְמַֽעַן חַסְדֶּֽךָ: אָנֹכִי יְיָ אֱלֹהֶֽיךָ הַמַּעַלְךָ מֵאֶֽרֶץ מִצְרָֽיִם הַרְחֶב־פִּֽיךָ וַאֲמַלְאֵֽהוּ: אַשְׁרֵי הָעָם שֶׁכָּֽכָה לּוֹ אַשְׁרֵי הָעָם שֶׁיְיָ אֱלֹהָיו: וַאֲנִי בְּחַסְדְּךָ בָטַֽחְתִּי יָגֵל לִבִּי בִּישׁוּעָתֶֽךָ אָשִֽׁירָה לַייָ כִּי גָמַל עָלָי:"
],

mizmorshir: [
  "מִזְמוֹר שִׁיר־חֲנֻכַּת הַבַּֽיִת לְדָוִד: אֲרוֹמִמְךָ יְיָ כִּי דִלִּיתָֽנִי וְלֹא־שִׂמַּֽחְתָּ אֹיְבַי לִי: יְיָ אֱלֹהָי שִׁוַּעְתִּי אֵלֶֽיךָ וַתִּרְפָּאֵֽנִי: יְיָ הֶעֱלִֽיתָ מִן־שְׁאוֹל נַפְשִׁי חִיִּיתָֽנִי מִיָּרְדִי־בוֹר: זַמְּרוּ לַייָ חֲסִידָיו וְהוֹדוּ לְזֵֽכֶר קָדְשׁוֹ: כִּי רֶֽגַע בְּאַפּוֹ חַיִּים בִּרְצוֹנוֹ בָּעֶֽרֶב יָלִין בֶּֽכִי וְלַבֹּֽקֶר רִנָּה: וַאֲנִי אָמַֽרְתִּי בְשַׁלְוִי בַּל־אֶמּוֹט לְעוֹלָם: יְיָ בִּרְצוֹנְךָ הֶעֱמַֽדְתָּה לְהַרְרִי עֹז הִסְתַּֽרְתָּ פָנֶֽיךָ הָיִֽיתִי נִבְהָל: אֵלֶֽיךָ יְיָ אֶקְרָא וְאֶל־אֲדֹנָי אֶתְחַנָּן: מַה־בֶּֽצַע בְּדָמִי בְּרִדְתִּי אֶל שַֽׁחַת הֲיוֹדְךָ עָפָר הֲיַגִּיד אֲמִתֶּֽךָ: שְׁמַע יְיָ וְחָנֵּֽנִי יְיָ הֱיֵה־עֹזֵר לִי: הָפַֽכְתָּ מִסְפְּדִי לְמָחוֹל לִי פִּתַּחְתָּ שַׂקִּי וַתְּאַזְּרֵֽנִי שִׂמְחָה: לְמַֽעַן יְזַמֶּרְךָ כָבוֹד וְלֹא יִדֹּם יְיָ אֱלֹהַי לְעוֹלָם אוֹדֶֽךָּ:"
],

adonmelech: [
  "יְיָ מֶֽלֶךְ, יְיָ מָלָֽךְ, יְיָ יִמְלֹךְ לְעֹלָם וָעֶד: יְיָ מֶֽלֶךְ, יְיָ מָלָֽךְ, יְיָ יִמְלֹךְ לְעֹלָם וָעֶד: וְהָיָה יְיָ לְמֶֽלֶךְ עַל־כָּל־הָאָֽרֶץ, בַּיּוֹם הַהוּא יִהְיֶה יְיָ אֶחָד וּשְׁמוֹ אֶחָד:",
  "הֽוֹשִׁיעֵֽנוּ יְיָ אֱלֹהֵֽינוּ, וְקַבְּצֵֽנוּ מִן־הַגּוֹיִם לְהוֹדוֹת לְשֵׁם קָדְשֶֽׁךָ, לְהִשְׁתַּבֵּֽחַ בִּתְהִלָּתֶֽךָ: בָּרוּךְ יְיָ אֱלֹהֵי יִשְׂרָאֵל, מִן־הָֽעוֹלָם וְעַד הָֽעוֹלָם, וְאָמַר כָּל־הָעָם אָמֵן, הַֽלְלוּיָהּ: כֹּל הַנְּשָׁמָה תְּהַלֵּל יָהּ, הַֽלְלוּיָהּ:"
],

lamnatzeachB: [
  "לַמְנַצֵּֽחַ בִּנְגִינֹת מִזְמוֹר שִׁיר: אֱלֹהִים יְחָנֵּֽנוּ וִיבָרְכֵֽנוּ יָאֵר פָּנָיו אִתָּֽנוּ סֶֽלָה: לָדַֽעַת בָּאָֽרֶץ דַּרְכֶּֽךָ בְּכָל־גּוֹיִם יְשׁוּעָתֶֽךָ: יוֹדֽוּךָ עַמִּים אֱלֹהִים יוֹדֽוּךָ עַמִּים כֻּלָּם: יִשְׂמְחוּ וִירַנְּנוּ לְאֻמִּים כִּי־תִשְׁפֹּט עַמִּים מִישֹׁר וּלְאֻמִּים בָּאָֽרֶץ תַּנְחֵם סֶֽלָה: יוֹדֽוּךָ עַמִּים אֱלֹהִים יוֹדוּךָ עַמִּים כֻּלָּם: אֶֽרֶץ נָתְנָה יְבוּלָהּ יְבָרְכֵֽנוּ אֱלֹהִים אֱלֹהֵֽינוּ: יְבָֽרְכֵֽנוּ אֱלֹהִים וְיִירְאוּ אוֹתוֹ כָּל־אַפְסֵי־אָֽרֶץ:"
],

baruchsheamar: [
  "בָּרוּךְ שֶׁאָמַר וְהָיָה הָעוֹלָם, בָּרוּךְ הוּא, בָּרוּךְ אוֹמֵר וְעֹשֶׂה, בָּרוּךְ גּוֹזֵר וּמְקַיֵּם, בָּרוּךְ עֹשֶׂה בְרֵאשִׁית, בָּרוּךְ מְרַחֵם עַל הָאָרֶץ, בָּרוּךְ מְרַחֵם עַל הַבְּרִיּוֹת, בָּרוּךְ מְשַׁלֵּם שָׂכָר טוֹב לִירֵאָיו, בָּרוּךְ חַי לָעַד וְקַיָּם לָנֶצַח, בָּרוּךְ פּוֹדֶה וּמַצִּיל בָּרוּךְ שְׁמוֹ. בָּרוּךְ אַתָּה יְיָ אֱלֹהֵינוּ מֶלֶךְ הָעוֹלָם, הָאֵל, אָב הָרַחֲמָן, הַמְּהֻלָּל בְּפֶה עַמּוֹ, מְשֻׁבָּח וּמְפֹאָר בִּלְשׁוֹן חֲסִידָיו וַעֲבָדָיו, וּבְשִׁירֵי דָוִד עַבְדֶּךָ. נְהַלֶּלְךָ יְיָ אֱלֹהֵינוּ, בִּשְׁבָחוֹת וּבִזְמִירוֹת. נְגַדֶּלְךָ וּנְשַׁבֵּחֲךָ וּנְפָאֶרְךָ, וְנַמְלִיכְךָ וְנַזְכִּיר שִׁמְךָ מַלְכֵּנוּ אֱלֹהֵינוּ, יָחִיד, חֵי הָעוֹלָמִים מֶלֶךְ. מְשֻׁבָּח וּמְפֹאָר עֲדֵי עַד שְׁמוֹ הַגָּדוֹל. בָּרוּךְ אַתָּה יְיָ, מֶלֶךְ מְהֻלָּל בַּתִּשְׁבָּחוֹת:"
],

letoda: [
  "מִזְמוֹר לְתוֹדָה הָרִֽיעוּ לַייָ כָּל־הָאָֽרֶץ: עִבְדוּ אֶת יְיָ בְּשִׂמְחָה בֹּֽאוּ לְפָנָיו בִּרְנָנָה: דְּעוּ כִּי־יְיָ הוּא אֱלֹהִים, הוּא עָשָֽׂנוּ, וְלוֹ אֲנַֽחְנוּ, עַמּוֹ, וְצֹאן מַרְעִיתוֹ: בֹּֽאוּ שְׁעָרָיו בְּתוֹדָה, חֲצֵרֹתָיו בִּתְהִלָּה, הֽוֹדוּ לוֹ בָּרְכוּ שְׁמוֹ: כִּי־טוֹ יְיָ, לְעוֹלָם חַסְדּוֹ, וְעַד־דֹּר וָדֹר אֱמוּנָתוֹ:"
],

yehichvod: [
  "יְהִי כְבוֹד יְיָ לְעוֹלָם יִשְׂמַח יְיָ בְּמַעֲשָׂיו: יְהִי שֵׁם יְיָ מְבֹרָךְ מֵעַתָּה וְעַד־עוֹלָם: מִמִּזְרַח־שֶֽׁמֶשׁ עַד־מְבוֹאוֹ מְהֻלָּל שֵׁם יְיָ: רָם עַל־כָּל־גּוֹיִם יְיָ עַל הַשָּׁמַֽיִם כְּבוֹדוֹ: יְיָ שִׁמְךָ לְעוֹלָם יְיָ זִכְרְךָ לְדֹר־וָדֹר: יְיָ בַּשָּׁמַֽיִם הֵכִין כִּסְאוֹ וּמַלְכוּתוֹ בַּכֹּל מָשָֽׁלָה: יִשְׂמְחוּ הַשָּׁמַֽיִם וְתָגֵל הָאָֽרֶץ וְיֹאמְרוּ בַגּוֹיִם יְיָ מָלָךְ: יְיָ מֶֽלֶךְ יְיָ מָלָךְ יְיָ יִמְלֹךְ לְעֹלָם וָעֶד: יְיָ מֶֽלֶךְ עוֹלָם וָעֶד אָבְדוּ גוֹיִם מֵאַרְצוֹ: יְיָ הֵפִיר עֲצַת־גּוֹיִם הֵנִיא מַחְשְׁבוֹת עַמִּים: רַבּוֹת מַחֲשָׁבוֹת בְּלֶב־אִישׁ וַעֲצַת יְיָ הִיא תָקוּם: עֲצַת יְיָ לְעוֹלָם תַּעֲמֹד מַחְשְׁבוֹת לִבּוֹ לְדֹר וָדֹר: כִּי הוּא אָמַר וַיֶּֽהִי הוּא־צִוָּה וַיַּעֲמֹד: כִּי בָחַר יְיָ בְּצִיּוֹן אִוָּהּ לְמוֹשָׁב לוֹ: כִּי־יַעֲקֹב בָּחַר לוֹ יָהּ יִשְׂרָאֵל לִסְגֻלָּתוֹ: כִּי לֹא יִטּשׁ יְיָ עַמּוֹ וְנַחֲלָתוֹ לֹא יַעֲזֹב: וְהוּא רַחוּם יְכַפֵּר עָוֹן וְלֹא־יַשְׁחִית וְהִרְבָּה לְהָשִׁיב אַפּוֹ וְלֹא־יָעִיר כָּל־חֲמָתוֹ: יְיָ הוֹשִׁיעָה הַמֶּֽלֶךְ יַעֲנֵֽנוּ בְיוֹם־קָרְאֵֽנוּ:"
],

ashrei: [
  "אַשְׁרֵי יוֹשְׁבֵי בֵיתֶֽךָ עוֹד יְהַלְלֽוּךָ סֶּֽלָה: אַשְׁרֵי הָעָם שֶׁכָּֽכָה לּוֹ אַשְׁרֵי הָעָם שֶׁיְיָ אֱלֹהָיו: תְּהִלָּה לְדָוִד אֲרוֹמִמְךָ אֱלוֹהַי הַמֶּֽלֶךְ וַאֲבָרְכָה שִׁמְךָ לְעוֹלָם וָעֶד: בְּכָל־יוֹם אֲבָרְכֶֽךָּ וַאֲהַלְלָה שִׁמְךָ לְעוֹלָם וָעֶד: גָּדוֹל יְיָ וּמְהֻלָּל מְאֹד וְלִגְדֻלָּתוֹ אֵין חֵֽקֶר: דּוֹר לְדוֹר יְשַׁבַּח מַעֲשֶׂיךָ וּגְבוּרֹתֶֽיךָ יַגִּֽידוּ: הֲדַר כְּבוֹד הוֹדֶֽךָ וְדִבְרֵי נִפְלְאֹתֶֽיךָ אָשִֽׂיחָה: וֶעֱזוּז נוֹרְאֹתֶֽיךָ יֹאמֵרוּ וּגְדֻלָּתְךָ אֲסַפְּרֶֽנָּה: זֶֽכֶר רַב־טוּבְךָ יַבִּֽיעוּ וְצִדְקָתְךָ יְרַנֵּֽנוּ: חַנּוּן וְרַחוּם יְיָ אֶֽרֶךְ אַפַּֽיִם וּגְדָל־חָֽסֶד: טוֹב־יְיָ לַכֹּל וְרַחֲמָיו עַל־כָּל־מַעֲשָׂיו: יוֹדֽוּךָ יְיָ כָּל־מַעֲשֶֽׂיךָ וַחֲסִידֶֽיךָ יְבָרְכֽוּכָה: כְּבוֹד מַלְכוּתְךָ יֹאמֵרוּ וּגְבוּרָתְךָ יְדַבֵּֽרוּ: לְהוֹדִֽיעַ לִבְנֵי הָאָדָם גְּבוּרֹתָיו וּכְבוֹד הֲדַר מַלְכוּתוֹ: מַלְכוּתְךָ מַלְכוּת כָּל־עֹלָמִים וּמֶמְשַׁלְתְּךָ בְּכָל־דּוֹר וָדֹר: סוֹמֵךְ יְיָ לְכָל־הַנֹּפְלִים וְזוֹקֵף לְכָל־הַכְּפוּפִים: עֵינֵי־כֹל אֵלֶֽיךָ יְשַׂבֵּֽרוּ וְאַתָּה נוֹתֵן־לָהֶם אֶת־אָכְלָם בְּעִתּוֹ: פּוֹתֵֽחַ אֶת־יָדֶֽךָ וּמַשְׂבִּֽיעַ לְכָל־חַי רָצוֹן: צַדִּיק יְיָ בְּכָל־דְּרָכָיו וְחָסִיד בְּכָל־מַעֲשָׂיו: קָרוֹ יְיָ לְכָל־קֹרְאָיו לְכֹל אֲשֶׁר יִקְרָאֻֽהוּ בֶאֱמֶת: רְצוֹן־יְרֵאָיו יַעֲשֶׂה וְאֶת־שַׁוְעָתָם יִשְׁמַע וְיוֹשִׁיעֵם: שׁוֹמֵר יְיָ אֶת־כָּל־אֹהֲבָיו וְאֵת כָּל־הָרְשָׁעִים יַשְׁמִיד: תְּהִלַּת יְיָ יְדַבֶּר פִּי וִיבָרֵךְ כָּל־בָּשָׂר שֵׁם קָדְשׁוֹ לְעוֹלָם וָעֶד: וַאֲנַֽחְנוּ נְבָרֵךְ יָהּ מֵעַתָּה וְעַד־עוֹלָם הַלְלוּיָהּ:"
],

halleluyot: [
  "הַלְלוּיָהּ הַלְלִי נַפְשִׁי אֶת־יְיָ: אֲהַלְלָה יְיָ בְּחַיָּי אֲזַמְּרָה לֵאלֹהַי בְּעוֹדִי: אַל־תִּבְטְחוּ בִנְדִיבִים בְּבֶן־אָדָם שֶׁאֵין לוֹ תְשׁוּעָה: תֵּצֵא רוּחוֹ יָשֻׁב לְאַדְמָתוֹ בַּיּוֹם הַהוּא אָבְדוּ עֶשְׁתֹּנֹתָיו: אַשְׁרֵי שֶׁאֵל יַעֲקֹב בְּעֶזְרוֹ, שִׂבְרוֹ עַל־יְיָ אֱלֹהָיו: עֹשֶׂה שָׁמַֽיִם וָאָֽרֶץ אֶת־הַיָּם וְאֶת־כָּל־אֲשֶׁר־בָּם, הַשֹּׁמֵר אֱמֶת לְעוֹלָם: עֹשֶׂה מִשְׁפָּט לַעֲשׁוּקִים נֹתֵן לֶֽחֶם לָרְעֵבִים יְיָ מַתִּיר אֲסוּרִים: יְיָ פֹּקֵֽחַ עִוְרִים יְיָ זֹקֵף כְּפוּפִים יְיָ אֹהֵב צַדִּיקִים: יְיָ שֹׁמֵר אֶת־גֵּרִים יָתוֹם וְאַלְמָנָה יְעוֹדֵד וְדֶֽרֶךְ רְשָׁעִים יְעַוֵּת: יִמְלֹךְ יְיָ לְעוֹלָם אֱלֹהַֽיִךְ צִיּוֹן לְדֹר וָדֹר הַלְלוּיָהּ:",
  "הַלְלוּיָהּ כִּי־טוֹב זַמְּרָה אֱלֹהֵֽינוּ, כִּי־נָעִים נָאוָה תְהִלָּה: בּוֹנֵה יְרוּשָׁלַֽםִ יְיָ נִדְחֵי יִשְׂרָאֵל יְכַנֵּס: הָרוֹפֵא לִשְׁבֽוּרֵי לֵב וּמְחַבֵּשׁ לְעַצְּבוֹתָם: מוֹנֶה מִסְפָּר לַכּוֹכָבִים לְכֻלָּם שֵׁמוֹת יִקְרָא: גָּדוֹל אֲדוֹנֵֽינוּ וְרַב־כֹּֽחַ לִתְבוּנָתוֹ אֵין מִסְפָּר: מְעוֹדֵד עֲנָוִים יְיָ מַשְׁפִּיל רְשָׁעִים עֲדֵי־אָֽרֶץ: עֱנוּ לַייָ בְּתוֹדָה זַמְּרוּ לֵאלֹהֵֽינוּ בְכִנּוֹר: הַמְכַסֶּה שָׁמַֽיִם בְּעָבִים הַמֵּכִין לָאָֽרֶץ מָטָר הַמַּצְמִֽיחַ הָרִים חָצִיר: נוֹתֵן לִבְהֵמָה לַחְמָהּ לִבְנֵי עֹרֵב אֲשֶׁר יִקְרָֽאוּ: לֹא בִגְבוּרַת הַסּוּס יֶחְפָּץ לֹא בְשׁוֹקֵי הָאִישׁ יִרְצֶה: רוֹצֶה יְיָ אֶת־יְרֵאָיו אֶת־הַמְיַחֲלִים לְחַסְדּוֹ: שַׁבְּחִי יְרוּשָׁלַֽםִ אֶת יְיָ הַלְלִי אֱלֹהַֽיִךְ צִיּוֹן: כִּי־חִזַּק בְּרִיחֵי שְׁעָרָֽיִךְ בֵּרַךְ בָּנַֽיִךְ בְּקִרְבֵּךְ: הַשָּׂם־גְּבוּלֵךְ שָׁלוֹם חֵֽלֶב חִטִּים יַשְׂבִּיעֵךְ: הַשֹּׁלֵֽחַ אִמְרָתוֹ אָֽרֶץ עַד־מְהֵרָה יָרוּץ דְּבָרוֹ: הַנֹּתֵן שֶֽׁלֶג כַּצָּֽמֶר כְּפוֹר כָּאֵֽפֶר יְפַזֵּר: מַשְׁלִיךְ קַרְחוֹ כְפִתִּים לִפְנֵי קָרָתוֹ מִי יַעֲמֹד: יִשְׁלַח דְּבָרוֹ וְיַמְסֵם יַשֵּׁב רוּחוֹ יִזְּלוּ־מָֽיִם: מַגִּיד דְּבָרָיו לְיַעֲקֹב חֻקָּיו וּמִשְׁפָּטָיו לְיִשְׂרָאֵל: לֹא עָֽשָׂה כֵן לְכָל־גּוֹי וּמִשְׁפָּטִים בַּל־יְדָעוּם הַלְלוּיָהּ:",
  "הַלְלוּיָהּ הַלְלוּ אֶת־יְיָ מִן הַשָּׁמַֽיִם הַלְלֽוּהוּ בַּמְּרוֹמִים: הַלְלֽוּהוּ כָּל־מַלְאָכָיו הַלְלֽוּהוּ כָּל־צְבָאָיו: הַלְלֽוּהוּ שֶֽׁמֶשׁ וְיָרֵֽחַ הַלְלֽוּהוּ כָּל־כּֽוֹכְבֵי אוֹר: הַלְלֽוּהוּ שְׁמֵי הַשָּׁמָֽיִם וְהַמַּֽיִם אֲשֶׁר מֵעַל הַשָּׁמָֽיִם: יְהַלְלוּ אֶת־שֵׁם יְיָ כִּי הוּא צִוָּה וְנִבְרָֽאוּ: וַיַּעֲמִידֵם לָעַד לְעוֹלָם חָק־נָתַן וְלֹא יַעֲבוֹר: הַלְלוּ אֶת־יְיָ מִן־הָאָֽרֶץ תַּנִּינִים וְכָל־תְּהֹמוֹת: אֵשׁ וּבָרָד שֶֽׁלֶג וְקִיטוֹר רֽוּחַ סְעָרָה עֹשָׂה דְבָרוֹ: הֶהָרִים וְכָל־גְּבָעוֹת עֵץ פְּרִי וְכָל־אֲרָזִים: הַחַיָּה וְכָל־בְּהֵמָה רֶֽמֶשׂ וְצִפּוֹר כָּנָף: מַלְכֵי־אֶֽרֶץ וְכָל־לְאֻמִּים שָׂרִים וְכָל־שֹׁפְטֵי אָֽרֶץ: בַּחוּרִים וְגַם־בְּתוּלוֹת זְקֵנִים עִם־נְעָרִים: יְהַלְלוּ אֶת־שֵׁם יְיָ כִּי־נִשְׂגָּב שְׁמוֹ לְבַדּוֹ הוֹדוֹ עַל־אֶֽרֶץ וְשָׁמָֽיִם: וַיָּֽרֶם קֶֽרֶן לְעַמּוֹ תְּהִלָּה לְכָל־חֲסִידָיו לִבְנֵי יִשְׂרָאֵל עַם קְרֹבוֹ הַלְלוּיָהּ:",
  "הַלְלוּיָהּ שִֽׁירוּ לַייָ שִׁיר חָדָשׁ תְּהִלָּתוֹ בִּקְהַל חֲסִידִים: יִשְׂמַח יִשְׂרָאֵל בְּעֹשָׂיו בְּנֵי־צִיּוֹן יָגִֽילוּ בְמַלְכָּם: יְהַלְלוּ שְׁמוֹ בְמָחוֹל בְּתֹף וְכִנּוֹר יְזַמְּרוּ־לוֹ: כִּי־רוֹצֶה יְיָ בְּעַמּוֹ יְפָאֵר עֲנָוִים בִּישׁוּעָה: יַעְלְזוּ חֲסִידִים בְּכָבוֹד יְרַנְּנוּ עַל־מִשְׁכְּבוֹתָם: רוֹמְמוֹת אֵל בִּגְרוֹנָם וְחֶֽרֶב פִּיפִיּוֹת בְּיָדָם: לַעֲשׂוֹת נְקָמָה בַגּוֹיִם תּוֹכֵחוֹת בַּלְאֻמִּים: לֶאְסֹר מַלְכֵיהֶם בְּזִקִּים וְנִכְבְּדֵיהֶם בְּכַבְלֵי בַרְזֶל: לַעֲשׂוֹת בָּהֶם מִשְׁפָּט כָּתוּב הָדָר הוּא לְכָל־חֲסִידָיו הַלְלוּיָהּ:",
  "הַלְלוּיָהּ הַֽלְלוּ־אֵל בְּקָדְשׁוֹ הַלְלֽוּהוּ בִּרְקִֽיעַ עֻזּוֹ: הַלְלֽוּהוּ בִּגְבוּרֹתָיו הַלְלֽוּהוּ כְּרֹב גֻּדְלוֹ: הַלְלֽוּהוּ בְּתֵֽקַע שׁוֹפָר הַלְלֽוּהוּ בְּנֵֽבֶל וְכִנּוֹר: הַלְלֽוּהוּ בְּתֹף וּמָחוֹל הַלְלֽוּהוּ בְּמִנִּים וְעֻגָב: הַלְלֽוּהוּ בְצִלְצְלֵי־שָֽׁמַע הַלְלֽוּהוּ בְּצִלְצְלֵי תְרוּעָה: כֹּל הַנְּשָׁמָה תְּהַלֵּל יָהּ הַלְלוּיָהּ: כֹּל הַנְּשָׁמָה תְּהַלֵּל יָהּ הַלְלוּיָהּ:",
  "בָּרוּךְ יְיָ לְעוֹלָם אָמֵן | וְאָמֵן: בָּרוּךְ יְיָ | מִצִּיּוֹן שֹׁכֵן יְרוּשָׁלָֽםִ הַלְלוּיָהּ: בָּרוּךְ | יְיָ אֱלֹהִים אֱלֹהֵי יִשְׂרָאֵל, עֹשֵׂה נִפְלָאוֹת לְבַדּוֹ: וּבָרוּךְ | שֵׁם כְּבוֹדוֹ לְעוֹלָם, וְיִמָּלֵא כְבוֹדוֹ אֶת־כָּל־הָאָֽרֶץ אָמֵן | וְאָמֵן:"
],

vayevarech: [
  "וַיְבָֽרֶךְ דָּוִיד אֶת־יְיָ לְעֵינֵי כָּל־הַקָּהָל, וַיֹּֽאמֶר דָּוִיד, בָּרוּךְ אַתָּה יְיָ אֱלֹהֵי יִשְׂרָאֵל אָבִֽינוּ, מֵעוֹלָם וְעַד־עוֹלָם: לְךָ יְיָ הַגְּדֻלָּה וְהַגְּבוּרָה וְהַתִּפְאֶֽרֶת וְהַנֵּֽצַח וְהַהוֹד, כִּי־כֹֽל בַּשָּׁמַֽיִם וּבָאָֽרֶץ, לְךָ יְיָ הַמַּמְלָכָה, וְהַמִּתְנַשֵּׂא לְכֹל לְרֹאשׁ: וְהָעֽשֶׁר וְהַכָּבוֹד מִלְּפָנֶֽיךָ, וְאַתָּה מוֹשֵׁל בַּכֹּל, וּבְיָדְךָ כֹּֽחַ וּגְבוּרָה, וּבְיָדְךָ לְגַדֵּל וּלְחַזֵּק לַכֹּל: וְעַתָּה אֱלֹהֵֽינוּ, מוֹדִים אֲנַֽחְנוּ לָךְ וּמְהַלְלִים לְשֵׁם תִּפְאַרְתֶּֽךָ: וִיבָרְכוּ שֵׁם כְּבוֹדֶךָ וּמְרוֹמַם עַל־כָּל־בְּרָכָה וּתְהִלָּה: אַתָּה־הוּא יְיָ לְבַדֶּֽךָ, אַתָּה עָשִֽׂיתָ אֶת־הַשָּׁמַֽיִם, שְׁמֵי הַשָּׁמַֽיִם וְכָל־צְבָאָם, הָאָֽרֶץ וְכָל־אֲשֶׁר עָלֶֽיהָ, הַיַּמִּים וְכָל־אֲשֶׁר בָּהֶם, וְאַתָּה מְחַיֶּה אֶת־כֻּלָּם, וּצְבָא הַשָּׁמַֽיִם לְךָ מִשְׁתַּחֲוִים: אַתָּה־הוּא יְיָ הָאֱלֹהִים אֲשֶׁר בָּחַֽרְתָּ בְּאַבְרָם וְהוֹצֵאתוֹ מֵאוּר כַּשְׂדִּים, וְשַֽׂמְתָּ שְׁמוֹ אַבְרָהָם: וּמָצָֽאתָ אֶת־לְבָבוֹ נֶאֱמָן לְפָנֶֽיךָ",
  "וְכָרֽוֹת עִמּֽוֹ הַבְּרִֽית לָתֵת אֶת־אֶֽרֶץ הַכְּנַעֲנִי הַחִתִּי הָאֱמֹרִי וְהַפְּרִזִּי וְהַיְבוּסִי וְהַגִּרְגָּשִׁי לָתֵת לְזַרְעוֹ, וַתָּֽקֶם אֶת־דְּבָרֶֽיךָ כִּי צַדִּיק אָֽתָּה: וַתֵּֽרֶא אֶת־עֳנִי אֲבֹתֵֽינוּ בְּמִצְרָֽיִם, וְאֶת־זַעֲקָתָם שָׁמַֽעְתָּ עַל־יַם־סוּף: וַתִּתֵּן אֹתֹת וּמֹפְתִים בְּפַרְעֹה וּבְכָל־עֲבָדָיו וּבְכָל־עַם אַרְצוֹ, כִּי יָדַֽעְתָּ כִּי הֵזִֽידוּ עֲלֵיהֶם, וַתַּֽעַשׂ־לְךָ שֵׁם כְּהַיּוֹם הַזֶּה: וְהַיָּם בָּקַֽעְתָּ לִפְנֵיהֶם וַיַּעַבְרוּ בְתוֹךְ־הַיָּם בַּיַּבָּשָׁה, וְאֶת־רֹדְפֵיהֶם הִשְׁלַֽכְתָּ בִמְצוֹלֹת כְּמוֹ־אֶֽבֶן בְּמַֽיִם עַזִּים:"
],

azyashir: [
  "וַיּֽוֹשַׁע יְיָ בַּיּוֹם הַהוּא אֶת־יִשְׂרָאֵל מִיַּד מִצְרָֽיִם, וַיַּרְא יִשְׂרָאֵל אֶת־מִצְרַֽיִם מֵת עַל־שְׂפַת הַיָּם: וַיַּרְא יִשְׂרָאֵל אֶת־הַיָּד הַגְּדֹלָה אֲשֶׁר עָשָׂה יְיָ בְּמִצְרַֽיִם וַיִּירְאוּ הָעָם אֶת יְיָ, וַיַּאֲמִֽינוּ בַּייָ וּבְמשֶׁה עַבְדּוֹ:",
  "אָז יָשִׁיר־משֶׁה וּבְנֵי יִשְׂרָאֵל אֶת־הַשִּׁירָה הַזֹּאת לַייָ וַיֹּאמְרוּ לֵאמֹר אָשִֽׁירָה לַייָ כִּי־גָאֹה גָּאָה סוּס וְרֹכְבוֹ רָמָה בַיָּם: עָזִּי וְזִמְרָת יָהּ וַיְהִי־לִי לִישׁוּעָה זֶה אֵלִי וְאַנְוֵֽהוּ אֱלֹהֵי אָבִי וַאֲרֹמְמֶֽנְהוּ: יְיָ אִישׁ מִלְחָמָה יְיָ שְׁמוֹ: מַרְכְּבֹת פַּרְעֹה וְחֵילוֹ יָרָה בַיָּם וּמִבְחַר שָׁלִשָׁיו טֻבְּעוּ בְיַם־סוּף: תְּהֹמֹת יְכַסְיֻֽמוּ יָרְדוּ בִמְצוֹלֹת כְּמוֹ־אָֽבֶן: יְמִינְךָ יְיָ נֶאְדָּרִי בַּכֹּֽחַ יְמִֽינְךָ יְיָ תִּרְעַץ אוֹיֵב: וּבְרֹב גְּאוֹנְךָ תַּהֲרֹס קָמֶֽיךָ תְּשַׁלַּח חֲרֹנְךָ יֹֽאכְלֵמוֹ כַּקַּשׁ: וּבְרֽוּחַ אַפֶּֽיךָ נֶֽעֶרְמוּ מַֽיִם נִצְּבוּ כְמוֹ־נֵד נֹזְלִים קָפְאוּ תְהֹמֹת בְּלֶב־יָם: אָמַר אוֹיֵב אֶרְדֹּף אַשִּׂיג אֲחַלֵּק שָׁלָל תִּמְלָאֵֽמוֹ נַפְשִׁי אָרִיק חַרְבִּי תּוֹרִישֵֽׁמוֹ יָדִי: נָשַֽׁפְתָּ בְרוּחֲךָ כִּסָּֽמוֹ יָם צָלֲלוּ כַּעוֹפֶֽרֶת בְּמַֽיִם אַדִּירִים: מִי־כָמֹֽכָה בָּאֵלִם יְיָ מִי כָּמֹֽכָה נֶאְדָּר בַּקֹּֽדֶשׁ נוֹרָא תְהִלֹּת עֹֽשֵׂה־פֶֽלֶא: נָטִֽיתָ יְמִינְךָ תִּבְלָעֵֽמוֹ אָֽרֶץ: נָחִֽיתָ בְחַסְדְּךָ עַם־זוּ גָּאָֽלְתָּ נֵהַֽלְתָּ בְעָזְּךָ אֶל־נְוֵה קָדְשֶֽׁךָ: שָֽׁמְעוּ עַמִּים יִרְגָּזוּן חִיל אָחַז ישְׁבֵי פְּלָֽשֶׁת: אָז נִבְהֲלוּ אַלּוּפֵי אֱדוֹם אֵילֵי מוֹאָב יֹֽאחֲזֵֽמוֹ רָֽעַד נָמֹֽגוּ כֹּל ישְׁבֵי כְנָֽעַן: תִּפֹּל עֲלֵיהֶם אֵימָֽתָה וָפַֽחַד בִּגְדֹל זְרוֹעֲךָ יִדְּמוּ כָּאָֽבֶן עַד־יַֽעֲבֹר עַמְּךָ יְיָ עַד־יַֽעֲבֹר עַם־זוּ קָנִֽיתָ: תְּבִאֵֽמוֹ וְתִטָּעֵֽמוֹ בְּהַר נַחֲלָתְךָ מָכוֹן לְשִׁבְתְּךָ פָּעַֽלְתָּ יְיָ מִקְּדָשׁ אֲדֹנָי כּוֹנְנוּ יָדֶֽיךָ: יְיָ יִמְלֹךְ לְעֹלָם וָעֶד: יְיָ יִמְלֹךְ לְעֹלָם וָעֶד: יְיָ מַלְכוּתֵהּ קָאֵים לְעָלַם וּלְעָלְמֵי עָלְמַיָּא: כִּי בָא סוּס פַּרְעֹה בְּרִכְבּוֹ וּבְפָרָשָׁיו בַּיָּם וַיָּֽשֶׁ יְיָ עֲלֵהֶם אֶת־מֵי הַיָּם וּבְנֵי יִשְׂרָאֵל הָלְכוּ בַיַּבָּשָׁה בְּתוֹךְ הַיָּֽם: כִּי לַייָ הַמְּלוּכָה וּמשֵׁל בַּגּוֹיִם: וְעָלוּ מוֹשִׁעִים בְּהַר צִיּוֹן לִשְׁפֹּט אֶת־הַר עֵשָׂו, וְהָיְתָה לַייָ הַמְּלוּכָה: וְהָיָה יְיָ לְמֶֽלֶךְ עַל־כָּל הָאָֽרֶץ בַּיּוֹם הַהוּא יִהְיֶה יְיָ אֶחָד וּשְׁמוֹ אֶחָד:"
],

yishtabach: [
  "יִשְׁתַּבַּֽח שִׁמְךָֽ לָעַֽד מַלְכֵּֽנוּ, הָאֵל הַמֶּֽלֶךְ הַגָּדוֹל וְהַקָּדוֹשׁ בַּשָּׁמַֽיִם וּבָאָֽרֶץ. כִּי לְךָ נָאֶה יְיָ אֱלֹהֵֽינוּ וֵאלֹהֵֽי אֲבוֹתֵֽינוּ לְעוֹלָֽם וָעֶד: שִׁיר וּשְׁבָחָֽה, הַלֵּֽל וְזִמְרָֽה, עֹז וּמֶמְשָׁלָֽה, נֶֽצַח, גְּדֻלָּֽה וּגְבוּרָֽה, תְּהִלָּֽה וְתִפְאֶֽרֶת, קְדֻשָּֽׁה וּמַלְכֽוּת: בְּרָכֽוֹת וְהוֹדָאֽוֹת, לְשִׁמְךָֽ הַגָּדֽוֹל וְהַקָּדֽוֹשׁ, וּמֵעוֹלָֽם עַד־עוֹלָֽם אַתָּֽה אֵל: בָּרֽוּךְ אַתָּֽה יְיָ, אֵל מֶֽלֶךְ גָּדֽוֹל וּמְהֻלָּֽל בַּתִּשְׁבָּחֽוֹת, אֵל־הַהוֹדָאֽוֹת, אֲדוֹן הַנִּפְלָאֽוֹת, בּוֹרֵֽא כָּל־הַנְּשָׁמֽוֹת, רִבּֽוֹן כָּל־הַמַּעֲשִֽׂים, הַבּוֹחֵֽר בְּשִׁירֵֽי זִמְרָֽה, מֶֽלֶךְ יָחִֽיד, חֵי הָעוֹלָמִֽים:"
],

shirMimaamakim: [
  "§ בעשי״ת מיום א׳ דר״ה עד לאחר יו״כ קודם חצי קדיש אומרים זה",
  "שִׁיר הַמַּעֲלוֹת מִמַּעֲמַקִּים קְרָאתִֽיךָ יְיָ: אֲדֹנָי שִׁמְעָה בְקוֹלִי תִּהְיֶֽינָה אָזְנֶֽיךָ קַשֻּׁבוֹת לְקוֹל תַּחֲנוּנָי: אִם־עֲוֹנוֹת תִּשְׁמָר־יָהּ אֲדֹנָי מִי יַעֲמֹד: כִּי־עִמְּךָ הַסְּלִיחָה לְמַֽעַן תִּוָּרֵא: קִוִּיתִי יְיָ קִוְּתָה נַפְשִׁי וְלִדְבָרוֹ הוֹחָֽלְתִּי: נַפְשִׁי לַאדֹנָי מִשֹּׁמְרִים לַבֹּֽקֶר שֹׁמְרִים לַבֹּֽקֶר: יַחֵל יִשְׂרָאֵל אֶל־יְיָ כִּי־עִם־יְיָ הַחֶֽסֶד וְהַרְבֵּה עִמּוֹ פְדוּת: וְהוּא יִפְדֶּה אֶת־יִשְׂרָאֵל מִכֹּל עֲוֹנוֹתָיו:שִׁיר הַמַּעֲלוֹת"
],

kdHalf1: [
  "יִתְגַּדַּֽל וְיִתְקַדַּֽשׁ שְׁמֵהּ רַבָּֽא. בְּעָלְמָֽא דִּי בְרָֽא כִרְעוּתֵהּ וְיַמְלִֽיךְ מַלְכוּתֵֽהּ, וְיַצְמַח פּוּרְקָנֵהּ וִיקָרֵב מְשִׁיחֵהּ. בְּחַיֵּיכוֹן וּבְיוֹמֵיכוֹן וּבְחַיֵּֽי דְכָל־בֵּֽית יִשְׂרָאֵֽל, בַּעֲגָלָא וּבִזְמַֽן קָרִיב וְאִמְרֽוּ אָמֵֽן: יְהֵא שְׁמֵהּ רַבָּֽא מְבָרַֽךְ לְעָלַֽם וּלְעָלְמֵֽי עָלְמַיָּֽא. יִתְבָּרֵֽךְ, וְיִשְׁתַּבַּֽח, וְיִתְפָּאֵֽר, וְיִתְרוֹמָֽם, וְיִתְנַשֵּֽׂא, וְיִתְהַדָּֽר, וְיִתְעַלֶּֽה, וְיִתְהַלָּֽל, שְׁמֵהּ דְקוּדְשָׁא בְּרִיךְ הוּא. לְעֵֽלָּא מִן כָּל־בִּרְכָתָא וְשִׁירָתָא, תֻּשְׁבְּחָתָא וְנֶחֱמָתָא, דַּאֲמִירָן בְּעָלְמָֽא, וְאִמְרוּ אָמֵן:",
  "חזןבָּרְכֽוּ אֶת־יְיָ הַמְבֹרָֽךְ:",
  "בָּרֽוּךְ יְיָ הַמְבֹרָֽךְ לְעוֹלָֽם וָעֶֽד:"
],

yotzer: [
  "בָּרֽוּךְ אַתָּֽה יְיָ אֱלֹהֵֽינוּ מֶֽלֶךְ הָעוֹלָֽם, יוֹצֵֽר אוֹר וּבוֹרֵֽא חֽשֶׁךְ, עֹשֶֹֽה שָׁלֽוֹם וּבוֹרֵֽא אֶת־הַכֹּֽל:",
  "הַמֵּאִיר לָאָרֶץ וְלַדָּרִים עָלֶיהָ בְּרַחֲמִים, וּבְטוּבוֹ מְחַדֵּשׁ בְּכָל־יוֹם תָּמִיד מַעֲשֵֹה־בְרֵאשִׁית: מָה־רַבּוּ מַעֲשֶֹיךָ יְיָ, כֻּלָּם בְּחָכְמָה עָשִֹיתָ, מָלְאָה הָאָרֶץ קִנְיָנֶךָ: הַמֶּלֶךְ הַמְרוֹמָם לְבַדּוֹ מֵאָז, הַמְשֻׁבָּח וְהַמְפֹאָר וְהַמִּתְנַשֵּׂא מִימוֹת עוֹלָם: אֱלֹהֵי עוֹלָם, בְּרַחֲמֶיךָ הָרַבִּים רַחֵם עָלֵינוּ, אֲדוֹן עֻזֵּנוּ צוּר מִשְֹגַּבֵּנוּ, מָגֵן יִשְׁעֵנוּ מִשְֹגָּב בַּעֲדֵנוּ: אֵל בָּרוּךְ גְּדוֹל דֵּעָה, הֵכִין וּפָעַל זָהֳרֵי חַמָּה, טוֹב, יָצַר כָּבוֹד לִשְׁמוֹ, מְאוֹרוֹת נָתַן סְבִיבוֹת עֻזּוֹ. פִּנּוֹת צְבָאָיו קְדוֹשִׁים, רוֹמְמֵי שַׁדַּי, תָּמִיד מְסַפְּרִים כְּבוֹד־אֵל וּקְדֻשָּׁתוֹ: תִּתְבָּרֵךְ יְיָ אֱלֹהֵינוּ בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת, עַל כָּל־שֶׁבַח מַעֲשֵֹה יָדֶיךָ. וְעַל־מְאוֹרֵי־אוֹר שֶׁיָּצַרְתָּ, יְפָאֲרוּךָ סֶּלָה:"
],

kedushaYotzer: [
  "תִּתְבָּרֵךְ לָנֶצַח צוּרֵנוּ מַלְכֵּנוּ וְגוֹאֲלֵנוּ בּוֹרֵא קְדוֹשִׁים, יִשְׁתַּבַּח שִׁמְךָ לָעַד מַלְכֵּנוּ יוֹצֵר מְשָׁרְתִים, וַאֲשֶׁר מְשָׁרְתָיו, כֻּלָּם עוֹמְדִים בְּרוּם עוֹלָם, וּמַשְׁמִיעִים בְּיִרְאָה יַחַד בְּקוֹל, דִּבְרֵי אֱלֹהִים חַיִּים וּמֶלֶךְ עוֹלָם: כֻּלָּם אֲהוּבִים, כֻּלָּם בְּרוּרִים, כֻּלָּם גִּבּוֹרִים, כֻּלָּם קְדוֹשִׁים, וְכֻלָּם עוֹשִֹים בְּאֵימָה וּבְיִרְאָה רְצוֹן קוֹנָם: וְכֻלָּם פּוֹתְחִים אֶת־פִּיהֶם בִּקְדֻשָּׁה וּבְטָהֳרָה, בְּשִׁירָה וּבְזִמְרָה, וּמְבָרְכִים וּמְשַׁבְּחִים, וּמְפָאֲרִים וּמַעֲרִיצִים, וּמַקְדִּישִׁים וּמַמְלִיכִים:",
  "אֶת־שֵׁם הָאֵל, הַמֶּלֶךְ הַגָּדוֹל, הַגִּבּוֹר וְהַנּוֹרָא קָדוֹשׁ הוּא: וְכֻלָּם מְקַבְּלִים עֲלֵיהֶם עֹל מַלְכוּת שָׁמַיִם זֶה מִזֶּה, וְנוֹתְנִים בְּאַהֲבָה רְשׁוּת זֶה לָזֶה, לְהַקְדִּישׁ לְיוֹצְרָם בְּנַחַת רוּחַ, בְּשָֹפָה בְרוּרָה וּבִנְעִימָה קְדוֹשָׁה. כֻּלָּם כְּאֶחָד עוֹנִים בְּאֵימָה וְאוֹמְרִים בְּיִרְאָה:",
  "קָדוֹשׁ | קָדוֹשׁ קָדוֹשׁ יְיָ צְבָאוֹת, מְלֹא כָל־הָאָרֶץ כְּבוֹדוֹ:",
  "וְהָאוֹפַנִּים וְחַיּוֹת הַקּדֶשׁ בְּרַעַשׁ גָּדוֹל מִתְנַשְֹּאִים לְעֻמַּת הַשְֹרָפִים, לְעֻמָּתָם מְשַׁבְּחִים וְאוֹמְרִים:",
  "בָּרוּךְ כְּבוֹד־יְיָ מִמְּקוֹמוֹ:",
  "לָאֵל בָּרוּךְ נְעִימוֹת יִתֵּנוּ, לָמֶּלֶךְ אֵל חַי וְקַיָּם, זְמִירוֹת יאֹמֵרוּ וְתִשְׁבָּחוֹת יַשְׁמִיעוּ, כִּי הוּא לְבַדּוֹ מָרוֹם וְקָדוֹשׁ, פּוֹעֵל גְּבוּרוֹת, עוֹשֶֹה חֲדָשׁוֹת, בַּעַל מִלְחָמוֹת, זוֹרֵעַ צְדָקוֹת, מַצְמִיחַ יְשׁוּעוֹת, בּוֹרֵא רְפוּאוֹת, נוֹרָא תְהִלּוֹת, אֲדוֹן הַנִּפְלָאוֹת, הַמְחַדֵּשׁ בְּטוּבוֹ בְּכָל־יוֹם תָּמִיד מַעֲשֵֹה בְרֵאשִׁית. כָּאָמוּר, לְעֹשֵֹה אוֹרִים גְּדֹלִים, כִּי לְעוֹלָם חַסְדּוֹ: בָּרוּךְ אַתָּה יְיָ, יוֹצֵר הַמְּאוֹרוֹת:"
],

ahavat: [
  "אַהֲבַת עוֹלָם אֲהַבְתָּֽנוּ יְיָ אֱלֹהֵֽינוּ, חֶמְלָה גְּדוֹלָה וִיתֵרָה חָמַֽלְתָּ עָלֵֽינוּ. אָבִֽינוּ מַלְכֵּֽנוּ בַּעֲבוּר שִׁמְךָ הַגָּדוֹל וּבַעֲבוּר אֲבוֹתֵֽינוּ שֶׁבָּטְחוּ בְךָ, וַתְּלַמְּדֵם חֻקֵּי חַיִּים, לַעֲשֹוֹת רְצוֹנְךָ בְּלֵבָב שָׁלֵם, כֵּן תְּחָנֵּֽנוּ וּתְלַמְּדֵֽנוּ. אָבִֽינוּ אָב הָרַחֲמָן, הַמְרַחֵם, רַחֶם־נָא עָלֵֽינוּ, וְתֵן בְּלִבֵּֽנוּ בִּינָה לְהָבִין וּלְהַשְֹכִּיל, לִשְׁמֹֽעַ לִלְמֹד וּלְלַמֵּד, לִשְׁמֹר וְלַעֲשֹוֹת, וּלְקַיֵּם אֶת־כָּל־דִּבְרֵי תַלְמוּד תּוֹרָתֶֽךָ בְּאַהֲבָה. וְהָאֵר עֵינֵֽינוּ בְּתוֹרָתֶֽךָ, וְדַבֵּק לִבֵּֽנוּ בְּמִצְוֹתֶֽיךָ, וְיַחֵד לְבָבֵֽנוּ לְאַהֲבָה וּלְיִרְאָה אֶת־שְׁמֶֽךָ, ולֹא־נֵבוֹשׁ, וְלֹא־נִכָּלֵם, וְלֹא־נִכָּשֵׁל, לְעוֹלָם וָעֶד. כִּי בְשֵׁם קָדְשְׁךָ הַגָּדוֹל וְהַנּוֹרָא בָּטָֽחְנוּ, נָגִֽילָה וְנִשְֹמְחָה בִּישׁוּעָתֶֽךָ. וְרַחֲמֶֽיךָ יְיָ אֱלֹהֵֽינוּ וַחֲסָדֶֽיךָ הָרַבִּים אַל יַעַזְבֽוּנוּ נֶֽצַח סֶֽלָה וָעֶד. מַהֵר וְהָבֵא עָלֵֽינוּ בְּרָכָה וְשָׁלוֹם מְהֵרָה, וַהֲבִיאֵֽנוּ לְשָלוֹם מֵאַרְבַּע כַּנְפוֹת הָאָֽרֶץ, וּשְׁבוֹר עֹל הַגּוֹיִם מֵעַל צַוָּארֵֽינוּ, וְתוֹלִיכֵֽנוּ מְהֵרָה קוֹמְמִיּוּת לְאַרְצֵֽנוּ, כִּי אֵל פּוֹעֵל יְשׁוּעוֹת אָֽתָּה, וּבָֽנוּ בָחַֽרְתָּ מִכָּל־עַם וְלָשׁוֹן, וְקֵרַבְתָּֽנוּ מַלְכֵּֽנוּ לְשִׁמְךָ הַגָּדוֹל בְּאַהֲבָה לְהוֹדוֹת לְךָ וּלְיַחֶדְךָ וּלְאַהֲבָה אֶת־שְׁמֶֽךָ. בָּרוּךְ אַתָּה יְיָ, הַבּוֹחֵר בְּעַמּוֹ יִשְֹרָאֵל בְּאַהֲבָה:"
],

shma1: [
  "שְׁמַע יִשְׂרָאֵל יְיָ אֱלֹהֵינוּ יְיָ | אֶחָד:",
  "בָּרוּךְ שֵׁם כְּבוֹד מַלְכוּתוֹ לְעוֹלָם וָעֶד:",
  "וְאָהַבְתָּ אֵת יְיָ אֱלֹהֶֽיךָ בְּכָל֯־לְ֯בָבְךָ וּבְכָל־נַפְשְׁךָ וּבְכָל־מְאֹדֶֽךָ: וְהָיוּ הַדְּבָרִים הָאֵֽלֶּה אֲשֶׁר֯ אָ֯נֹכִי מְצַוְּךָ הַיּוֹם עַל֯־לְ֯בָבֶֽךָ: וְשִׁנַּנְתָּם לְבָנֶֽיךָ וְדִבַּרְתָּ בָּם בְּשִׁבְתְּךָ בְּבֵיתֶֽךָ וּבְלֶכְתְּךָ בַדֶּֽרֶךְ וּבְשָׁכְבְּךָ וּבְקוּמֶֽךָ: וּקְשַׁרְתָּם לְאוֹת עַל֯־יָ֯דֶֽךָ וְהָיוּ לְטֹטָפֹת בֵּין עֵינֶֽיךָ: וּכְתַבְתָּם עַל־מְזֻזוֹת בֵּיתֶֽךָ וּבִשְׁעָרֶֽיךָ:"
],

shma2: [
  "וְהָיָה אִם־שָׁמֹֽעַ תִּשְׁמְעוּ אֶל־מִצְוֹתַי אֲשֶׁר֯ אָ֯נֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם לְאַהֲבָה אֶת־יְיָ אֱלֹהֵיכֶם וּלְעָבְדוֹ בְּכָל֯־לְ֯בַבְכֶם וּבְכָל־נַפְשְׁכֶם: וְנָתַתִּי מְטַר֯־אַ֯רְצְכֶם בְּעִתּוֹ֯ י֯וֹרֶה וּמַלְקוֹשׁ וְאָסַפְתָּ דְגָנֶֽךָ וְתִירשְׁךָ וְיִצְהָרֶֽךָ: וְנָתַתִּי עֵֽשֶׂב֯ בְּ֯שָׂדְךָ לִבְהֶמְתֶּֽךָ וְאָכַלְתָּ וְשָׂבָֽעְתָּ: הִשָּׁמְרוּ לָכֶם פֶּן֯־יִ֯פְתֶּה לְבַבְכֶם וְסַרְתֶּם וַעֲבַדְתֶּם אֱלֹהִים֯ אֲ֯חֵרִים וְהִשְׁתַּחֲוִיתֶם לָהֶם: וְחָרָה אַף־יְיָ בָּכֶם וְעָצַר֯ אֶ֯ת־הַשָּׁמַֽיִם וְלֹּא֯־יִ֯הְיֶה מָטָר וְהָאֲדָמָה לֹא תִתֵּן אֶת֯־יְ֯בוּלָהּ וַאֲבַדְתֶּם֯ מְ֯הֵרָה מֵעַל הָאָֽרֶץ הַטֹּבָה אֲשֶׁר֯ יְ֯יָ נֹתֵן לָכֶם: וְשַׂמְתֶּם֯ אֶ֯ת־דְּבָרַי֯ אֵֽ֯לֶּה עַל֯־לְ֯בַבְכֶם וְעַל־נַפְשְׁכֶם וּקְשַׁרְתֶּם֯ אֹ֯תָם לְאוֹת עַל֯־יֶ֯דְכֶם וְהָיוּ לְטוֹטָפֹת בֵּין עֵינֵיכֶם: וְלִמַּדְתֶּם֯ אֹ֯תָם אֶת־בְּנֵיכֶם לְדַבֵּר בָּם בְּשִׁבְתְּךָ בְּבֵיתֶֽךָ וּבְלֶכְתְּךָ בַדֶּֽרֶךְ וּבְשָׁכְבְּךָ וּבְקוּמֶֽךָ: וּכְתַבְתָּם עַל־מְזוּזוֹת בֵּיתֶֽךָ וּבִשְׁעָרֶֽיךָ: לְמַֽעַן֯ יִ֯רְבּוּ יְמֵיכֶם וִימֵי בְנֵיכֶם עַל הָאֲדָמָה אֲשֶׁר נִשְׁבַּע יְיָ לַאֲבֹתֵיכֶם לָתֵת לָהֶם כִּימֵי הַשָּׁמַֽיִם עַל־הָאָֽרֶץ:"
],

shma3: [
  "וַֽיֹּאמֶר֯ יְ֯יָ אֶ֯ל־משֶׁה לֵּאמֹר: דַּבֵּר֯ אֶ֯ל־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם וְעָשׂוּ לָהֶם צִיצִת עַל־כַּנְפֵי בִגְדֵיהֶם לְדֹרֹתָם וְנָתְנוּ עַל־צִיצִת הַכָּנָף֯ פְּ֯תִיל תְּכֵֽלֶת: וְהָיָה לָכֶם לְצִיצִת וּרְאִיתֶם֯ אֹ֯תוֹ וּזְכַרְתֶּם֯ אֶ֯ת־כָּל־מִצְוֹת֯ יְ֯יָ וַעֲשִׂיתֶם֯ אֹ֯תָם וְלֹא תָתֽוּרוּ אַחֲרֵי לְבַבְכֶם וְאַחֲרֵי עֵינֵיכֶם אֲשֶׁר֯־אַ֯תֶּם זֹנִים֯ אַ֯חֲרֵיהֶם: לְמַֽעַן תִּזְכְּרוּ וַעֲשִׂיתֶם֯ אֶ֯ת־כָּל־מִצְוֹתָי וִהְיִיתֶם קְדשִׁים לֵאלֹהֵיכֶם: אֲנִי יְיָ אֱלֹהֵיכֶם֯ אֲ֯שֶׁר הוֹצֵֽאתִי אֶתְכֶם֯ מֵ֯אֶֽרֶץ מִצְרַֽיִם לִהְיוֹת לָכֶם לֵאלֹהִים֯ אֲ֯נִי יְיָ אֱלֹהֵיכֶם֯:"
],

emetv: [
  "אֱמֶת, וְיַצִּיב, וְנָכוֹן, וְקַיָּם, וְיָשָׁר, וְנֶאֱמָן, וְאָהוּב, וְחָבִיב, וְנֶחְמָד, וְנָעִים, וְנוֹרָא, וְאַדִּיר, וּמְתֻקָּן, וּמְקֻבָּל, וְטוֹב, וְיָפֶה, הַדָּבָר הַזֶּה עָלֵֽינוּ לְעוֹלָם וָעֶד: אֱמֶת, אֱלֹהֵי עוֹלָם מַלְכֵּֽנוּ צוּר יַעֲקֹב מָגֵן יִשְׁעֵֽנוּ, לְדֹר וָדֹר הוּא קַיָּם, וּשְׁמוֹ קַיָּם, וְכִסְאוֹ נָכוֹן, וּמַלְכוּתוֹ וֶאֱמוּנָתוֹ לָעַד קַיֶּֽמֶת: וּדְבָרָיו חָיִים וְקַיָּמִים, נֶאֱמָנִים וְנֶחֱמָדִים לָעַד וּלְעוֹלְמֵי עוֹלָמִים: עַל אֲבוֹתֵֽינוּ וְעָלֵֽינוּ, עַל־בָּנֵֽינוּ וְעַל־דּוֹרוֹתֵֽינוּ, וְעַל כָּל־דּוֹרוֹת זֶֽרַע יִשְֹרָאֵל עֲבָדֶֽיךָ עַל־הָרִאשׁוֹנִים וְעַל־הָאַחֲרוֹנִים דָּבָר טוֹב וְקַיָּם בֶּאֱמֶת וֶּבֶאֱמוּנָה חוֹק וְלֹא יַעֲבוֹר: אֱמֶת, שָׁאַתָּה הוּא יְיָ אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ, מַלְכֵּֽנוּ מֶֽלֶךְ אֲבוֹתֵֽינוּ, גּוֹאֲלֵֽנוּ גּוֹאֵל אֲבוֹתֵֽינוּ, צוּרֵֽנוּ, צוּר יְשׁוּעָתֵֽנוּ, פּוֹדֵֽנוּ וּמַצִּילֵֽנוּ מֵעוֹלָם הוּא שְׁמֶֽךָ, וְאֵין לָֽנוּ עוֹד אֱלֹהִים זוּלָתְךָ, סֶֽלָה:",
  "עֶזְרַת אֲבוֹתֵינוּ אַתָּה־הוּא מֵעוֹלָם, מָגֵן וּמוֹשִׁיעַ לָהֶם וְלִבְנֵיהֶם אַחֲרֵיהֶם בְּכָל־דּוֹר וָדוֹר: בְּרוּם עוֹלָם מוֹשָׁבֶךָ, וּמִשְׁפָּטֶיךָ וְצִדְקָתְךָ עַד אַפְסֵי־אָרֶץ: אֱמֶת, אַשְׁרֵי אִישׁ שֶׁיִּשְׁמַע לְמִצְוֹתֶיךָ, וְתוֹרָתְךָ וּדְבָרְךָ יָשִים עַל לִבּוֹ: אֱמֶת, אַתָּה־הוּא אָדוֹן לְעַמֶּךָ, וּמֶלֶךְ גִּבּוֹר לָרִיב רִיבָם, לְאָבוֹת וּבָנִים: אֱמֶת, אַתָּה־הוּא רִאשׁוֹן, וְאַתָּה־הוּא אַחֲרוֹן, וּמִבַּלְעָדֶיךָ אֵין לָנוּ מֶלֶךְ גּוֹאֵל וּמוֹשִׁיעַ: אֱמֶת, מִמִּצְרַיִם גְּאַלְתָּנוּ יְיָ אֱלֹהֵינוּ, וּמִבֵּית עֲבָדִים פְּדִיתָנוּ: כָּל־בְּכוֹרֵיהֶם הָרַגְתָּ, וּבְכוֹרְךָ יִשָֹרָאֵל גָּאַלְתָּ, וְיַם־סוּף לָהֶם בָּקַעְתָּ, וְזֵדִים טִבַּעְתָּ, וִידִידִים הֶעֱבַרְתָּ: וַיְכַסּוּ־מַיִם צָרֵיהֶם, אֶחָד מֵהֶם לֹא נוֹתָר: עַל־זֹאת שִׁבְּחוּ אֲהוּבִים, וְרוֹמְמוּ לָאֵל, וְנָתְנוּ יְדִידִים זְמִירוֹת שִׁירוֹת וְתִשְׁבָּחוֹת, בְּרָכוֹת וְהוֹדָאוֹת לָמֶּלֶךְ אֵל חַי וְקַיָּם: רָם וְנִשָּׂא גָּדוֹל וְנוֹרָא, מַשְׁפִּיל גֵּאִים עֲדֵי־אָרֶץ, וּמַגְבִּיהַּ שְׁפָלִים עֲד־מָרוֹם, מוֹצִיא אֲסִירִים, פּוֹדֶה עֲנָוִים, עוֹזֵר דַּלִּים, הָעוֹנֶה לְעַמּוֹ יִשְֹרָאֵל בְּעֵת שַׁוְעָם אֵלָיו: תְּהִלּוֹת לְאֵל עֶלְיוֹן גֹּאֲלָם, בָּרוּךְ הוּא וּמְבֹרָךְ, משֶׁה וּבְנֵי יִשְֹרָאֵל לְךָ עָנוּ שִׁירָה בְּשִֹמְחָה רַבָּה, וְאָמְרוּ כֻלָּם:"
],

michamocha: [
  "מִי־כָמֹכָה בָּאֵלִים יְיָ, מִי כָּמׂכָה נֶאְדָּר בַּקֹּדֶשׁ, נוֹרָא תְהִלֹּת, עֹשֵֹה־פֶלֶא:",
  "שִׁירָה חֲדָשָׁה שִׁבְּחוּ גְאוּלִים לְשִׁמְךָ הַגָּדוֹל עַל־שְֹפַת הַיָּם, יַחַד כֻּלָּם הוֹדוּ וְהִמְלִיכוּ וְאָמְרוּ: יְיָ יִמְלֹךְ לְעוֹלָם וָעֶד: וְנֶאֱמַר גֹּאֲלֵנוּ, יְיָ צְבָאוֹת שְׁמוֹ, קְדוֹשׁ יִשְֹרָאֵל: בָּרוּךְ אַתָּה יְיָ, גָּאַֽל יִשְֹרָאֵל:"
],

amida1: [
  "אֲדֹנָי, שְׂפָתַי תִּפְתָּח, וּפִי יַגִּיד תְּהִלָּתֶךָ:",
  "בָּרֽוּךְ אַתָּֽה יְיָ אֱלֹהֵֽינוּ וֵאלֹהֵֽי אֲבוֹתֵֽינוּ, אֱלֹהֵֽי אַבְרָהָֽם, אֱלֹהֵֽי יִצְחָֽק, וֵאלֹהֵֽי יַעֲקֹֽב, הָאֵֽל הַגָּדֽוֹל הַגִּבּֽוֹר וְהַנּוֹרָֽא, אֵל עֶלְיֽוֹן, גּוֹמֵֽל חֲסָדִֽים טוֹבִֽים, קוֹנֵֽה הַכֹּֽל, וְזוֹכֵֽר חַסְדֵּֽי אָבֽוֹת, וּמֵבִֽיא גּוֹאֵֽל לִבְנֵֽי בְנֵיהֶֽם לְמַֽעַן שְׁמוֹ בְּאַהֲבָֽה:",
  "§@ayt בעשרת ימי תשובה",
  "זָכְרֵֽנוּ לְחַיִּֽים, מֶֽלֶךְ חָפֵֽץ בַּחַיִּֽים, וְכָתְבֵֽנוּ בְּסֵֽפֶר הַחַיִּֽים, לְמַעַנְךָֽ אֱלֹהִֽים חַיִּֽים:",
  "מֶֽלֶךְ עוֹזֵֽר וּמוֹשִֽׁיעַ וּמָגֵֽן: בָּרֽוּךְ אַתָּֽה יְיָ, מָגֵֽן אַבְרָהָֽם:",
  "אַתָּֽה גִּבּֽוֹר לְעוֹלָֽם אֲדֹנָֽי, מְחַיֶּֽה מֵתִֽים אַתָּֽה, רַב לְהוֹשִֽׁיעַ:",
  "§ בקיץ אומרים מוֹרִיד הַטָּל · בחורף מַשִּׁיב הָרוּחַ",
  "מוֹרִֽיד הַטָּל: מַשִּֽׁיב הָרֽוּחַ וּמוֹרִֽיד הַגֶּֽשֶׁם:",
  "מְכַלְכֵּֽל חַיִּֽים בְּחֶֽסֶד, מְחַיֶּֽה מֵתִֽים בְּרַחֲמִֽים רַבִּֽים, סוֹמֵֽךְ נוֹפְלִֽים, וְרוֹפֵֽא חוֹלִֽים, וּמַתִּֽיר אֲסוּרִֽים, וּמְקַיֵּֽם אֱמוּנָתֽוֹ לִישֵׁנֵֽי עָפָֽר. מִי־כָמֽוֹךָ בַּֽעַל גְּבוּרֽוֹת וּמִֽי דּֽוֹמֶה לָּךְ, מֶֽלֶךְ מֵמִֽית וּמְחַיֶּֽה וּמַצְמִֽיחַ יְשׁוּעָֽה:",
  "§@ayt בעשרת ימי תשובה",
  "מִי־כָמֽוֹךָ אָב הָרַחֲמָֽן זוֹכֵֽר יְצוּרָֽיו לְחַיִּֽים בְּרַחֲמִים:",
  "וְנֶאֱמָֽן אַתָּֽה לְהַחֲיוֹֽת מֵתִֽים. בָּרֽוּךְ אַתָּֽה יְיָ, מְחַיֶּֽה הַמֵּתִֽים:",
  "§ בעשרת ימי תשובה אומרים הַמֶּלֶךְ הַקָּדוֹשׁ",
  "אַתָּֽה קָדוֹשׁ וְשִׁמְךָֽ קָדֽוֹשׁ, וּקְדוֹשִֽׁים בְּכָל־יוֹֽם יְהַלְלֽוּךָ סֶּֽלָה. בָּרֽוּךְ אַתָּֽה יְיָ, הָאֵֽל ( הַמֶּֽלֶךְ) הַקָּדֽוֹשׁ:"
],

amida2: [
  "אַתָּֽה חוֹנֵֽן לְאָדָֽם דַּֽעַת, וּמְלַמֵּֽד לֶאֱנֽוֹשׁ בִּינָֽה. חָנֵּֽנוּ מֵאִתְּךָֽ חָכְמָֽה בִּינָֽה וָדָֽעַת. בָּרֽוּךְ אַתָּֽה יְיָ, חוֹנֵֽן הַדָּֽעַת:",
  "הֲשִׁיבֵנוּ אָבִינוּ לְתוֹרָתֶךָ, וְקָרְבֵנוּ מַלְכֵּנוּ לַעֲבוֹדָתֶךָ, וְהַחֲזִירֵנוּ בִּתְשׁוּבָה שְׁלֵמָה לְפָנֶיךָ. בָּרוּךְ אַתָּה יְיָ, הָרוֹצֶה בִּתְשׁוּבָה:",
  "סְלַח־לָנוּ אָבִינוּ, כִּי חָטָאנוּ, מְחוֹל לָנוּ מַלְכֵּנוּ, כִּי פָשָׁעְנוּ, כִּי אֵל טוֹב וְסַלָּח אָֽתָּה. בָּרוּךְ אַתָּה יְיָ, חַנּוּן, הַמַּרְבֶּה לִסְלוֹחַ:",
  "רְאֵה נָא בְעָנְיֵנוּ וְרִיבָה רִיבֵנוּ, וּגְאָלֵנוּ מְהֵרָה לְמַעַן שְׁמֶךָ, כִּי אֵל גּוֹאֵל חָזָק אָֽתָּה. בָּרוּךְ אַתָּה יְיָ, גּוֹאֵל יִשְׂרָאֵל:",
  "§@fast בתענית צבור אומר הש״ץ כאן עננו",
  "עֲנֵֽנוּ יְיָ עֲנֵֽנוּ בְּיוֹם צוֹם תַּעֲנִיתֵֽנוּ, כִּי בְצָרָה גְדוֹלָה אֲנָֽחְנוּ אַל־תֵּֽפֶן אֶל־רִשְׁעֵֽנוּ, וְאַל־תַּסְתֵּר פָּנֶֽיךָ מִמֶּֽנּוּ, וְאַל־תִּתְעַלַּם מִתְּחִנָּתֵֽנוּ, הֱיֵה נָא קָרוֹב לְשַׁוְעָתֵֽנוּ, יְהִי נָא חַסְדְּךָ לְנַחֲמֵֽנוּ, טֶֽרֶם נִקְרָא אֵלֶֽיךָ עֲנֵֽנוּ, כַּדָּבָר שֶׁנֶּאֱמַר: וְהָיָה טֶֽרֶם יִקְרָֽאוּ וַאֲנִי אֶעֱנֶה, עוֹד הֵם מְדַבְּרִים וַאֲנִי אֶשְׁמָע: כִּי אַתָּה יְיָ הָעוֹנֶה בְּעֵת צָרָה, פּוֹדֶה וּמַצִּיל בְּכָל־עֵת צָרָה וְצוּקָה: בָּרוּךְ אַתָּה יְיָ, הָעוֹנֶה לְעַמּוֹ יִשְֹרָאֵל בְּעֵת צָרָה:",
  "רְפָאֵנוּ יְיָ וְנֵרָפֵא, הוֹשִׁיעֵנוּ וְנִוָּשֵׁעָה, כִּי תְהִלָּתֵנוּ אָֽתָּה, וְהַעֲלֵה אֲרוּכָה וּרְפוּאָה שְׁלֵמָה לְכָל־מַכּוֹתֵינוּ. כִּי אֵל מֶלֶךְ רוֹפֵא נֶאֱמָן וְרַחֲמָן אָֽתָּה. בָּרוּךְ אַתָּה יְיָ, רוֹפֵא חוֹלֵי עַמוֹ יִשְׂרָאֵל:",
  "§ בקיץ אומרים מוֹרִיד הַטָּל · בחורף מַשִּׁיב הָרוּחַ",
  "בָּרֵךְ עָלֵינוּ יְיָ אֱלֹהֵינוּ אֶת־הַשָּׁנָה הַזֹּאת וְאֵת כָּל־מִינֵי תְבוּאָתָהּ לְטוֹבָה וְתֵן בְּרָכָה ( טַל וּמָטָר לִבְרָכָה) עַל פְּנֵי הָאֲדָמָה, וְשַׂבְּעֵנוּ מִטוּבֶךָ, וּבָרֵךְ שְׁנָתֵנוּ כַּשָּׁנִים הַטּוֹבוֹת לִבְרָכָה, כִּי אֵל טוֹב וּמֵטִיב אַתָּה וּמְבָרֵךְ הַשָּׁנִים. בָּרוּךְ אַתָּה יְיָ, מְבָרֵךְ הַשָּׁנִים:",
  "תְּקַע בְּשׁוֹפָר גָּדוֹל לְחֵרוּתֵנוּ, וְשָׂא נֵס לְקַבֵּץ גָּלֻיּוֹתֵינוּ, וְקַבְּצֵנוּ יַחַד מֵאַרְבַּע כַּנְפוֹת הָאָרֶץ לְאַרְצֵנוּ. בָּרוּךְ אַתָּה יְיָ, מְקַבֵּץ נִדְחֵי עַמוֹ יִשְׂרָאֵל:",
  "§ בעשרת ימי תשובה",
  "הָשִׁיבָה שׁוֹפְטֵינוּ כְּבָרִאשֹׁנָה וְיוֹעֲצֵינוּ כְּבַתְּחִלָּה, וְהָסֵר מִמֶּנוּ יָגוֹן וַאֲנָחָה, וּמְלוֹךְ עָלֵינוּ אַתָּה יְיָ לְבַדְּךָ בְּחֶסֶד וּבְרַחֲמִים, בְּצֶדֶק וּבְמִּשְׁפָּט. בָּרוּךְ אַתָּה יְיָ, מֶלֶךְ אוֹהֵב צְדָקָה וּמִשְׁפָּט: ( הַמֶּלֶךְ הַמִשְׁפָּט:)",
  "וְלַמַּלְשִׁינִים אַל תְּהִי תִקְוָה, וְכָל־הַמִּינִים וְכָל־הַזֵּדִים כְּרֶגַע יֹאבֵדוּ, וְכָל אֹיְבֵי עַמְּךָ מְהֵרָה יִכָּרֵתוּ, וּמַּלְכוּת הָרִשְׁעָה מְהֵרָה תְעַקֵּר וּתְשַׁבֵּר וּתְמַגֵּר, וְתַכְנִיעַ בִּמְהֵרָה בְיָמֵינוּ. בָּרוּךְ אַתָּה יְיָ, שֹׁבֵר אֹיְבִים וּמַכְנִיעַ זֵדִים:",
  "עַל־הַצַּדִּיקִים וְעַל־הַחֲסִידִים, וְעַל־זִקְנֵי עַמְּךָ בֵּית יִשְׂרָאֵל, וְעַל פְּלֵיטַת בֵּית סוֹפְרֵיהֶם, וְעַל־גֵּרֵי הַצֶּדֶק וְעָלֵינוּ, יֶהֱמוּ נָא רַחֲמֶיךָ יְיָ אֱלֹהֵינוּ, וְתֵן שָׂכָר טוֹב לְכָל־הַבּוֹטְחִים בְּשִׁמְךָ בֶּאֱמֶת, וְשִׂים חֶלְקֵנוּ עִמָּהֶם, וּלְעוֹלָם לֹא נֵבוֹשׁ כִּי בְךָ בָּטָחְנוּ. בָּרוּךְ אַתָּה יְיָ, מִשְׁעָן וּמִבְטָח לַצַּדִּיקִים:",
  "וְלִירוּשָׁלַ͏ִם עִירְךָֽ בְּרַחֲמִֽים תָּשֽׁוּב, וְתִשְׁכּֽוֹן בְּתוֹכָֽהּ כַּאֲשֶֽׁר דִּבַּֽרְתָּ, וְכִסֵּֽא דָוִֽד עַבְדְּךָֽ מְהֵרָֽה בְּתוֹכָֽהּ תָּכִֽין, וּבְנֵֽה אוֹתָֽהּ בְּקָרֽוֹב בְּיָמֵֽינוּ בִּנְיַֽן עוֹלָֽם. בָּרוּךְ אַתָּה יְיָ, בּוֹנֵֽה יְרוּשָׁלָ͏ִם:",
  "אֶת־צֶֽמַח דָּוִֽד עַבְדְּךָֽ מְהֵרָֽה תַצְמִֽיחַ, וְקַרְנֽוֹ תָּרֽוּם בִּישׁוּעָתֶֽךָ, כִּי לִישׁוּעָתְךָֽ קִּוִּֽינוּ כָּל־הַיּוֹֽם. בָּרוּךְ אַתָּה יְיָ, מַצְמִֽיחַ קֶֽרֶן יְשׁוּעָֽה:",
  "שְׁמַע קוֹלֵֽנוּ יְיָ אֱלֹהֵינוּ, אָב הָרַחֲמָֽן רַחֵֽם עָלֵינוּ, וְקַבֵּֽל בְּרַחֲמִֽים וּבְרָצֽוֹן אֶת־תְּפִלָּתֵֽנוּ, כִּי אֵל שׁוֹמֵֽע תְּפִלּֽוֹת וְתַחֲנוּנִֽים אָֽתָּה, וּמִלְּפָנֶֽיךָ מַלְכֵּנוּ רֵיקָֽם אַל־תְּשִׁיבֵֽנוּ. כִּי אַתָּֽה שׁוֹמֵֽעַ תְּפִלַּֽת כָּל־פֶּֽה. בָּרוּךְ אַתָּֽה יְיָ, שׁוֹמֵֽעַ תְּפִלָּֽה:"
],

amida3: [
  "רְצֵה יְיָ אֱלֹהֵינוּ בְּעַמְּךָֽ יִשְׂרָאֵל וְלִתְפִלָּתָֽם שְׁעֵה, וְהָשֵֽׁב הָעֲבוֹדָֽה לִדְבִֽיר בֵּיתֶךָ, וְאִשֵּֽׁי יִשְׂרָאֵל וּתְפִלָּתָֽם בְּאַהֲבָֽה תְקַבֵּֽל בְּרָצֽוֹן, וּתְהִֽי לְרָצֽוֹן תָּמִֽיד עֲבוֹדַֽת יִשְׂרָאֵל עַמֶּֽךָ:",
  "§@rc בראש חודש ובחול המועד — יעלה ויבוא",
  "אֱלֹהֵינוּ וֵאלֹהֵי אֲבוֹתֵינוּ, יַעֲלֶה וְיָבֹא, וְיַגִּיעַ וְיֵרָאֶה וְיֵרָצֶה, וְיִשָּׁמַע וְיִפָּקֵד וְיִזָּכֵר, זִכְרוֹנֵנוּ וּפִקְדוֹנֵנוּ, וְזִכְרוֹן אֲבוֹתֵינוּ, וְזִכְרוֹן מָשִׁיחַ בֶּן־דָּוִד עַבְדֶּךָ, וְזִכְרוֹן יְרוּשָׁלַיִם עִיר קָדְשֶׁךָ, וְזִכְרוֹן כָּל־עַמְּךָ בֵּית יִשְֹרָאֵל לְפָנֶיךָ לִפְלֵיטָה לְטוֹבָה, לְחֵן וּלְחֶסֶד וּלְרַחֲמִים וּלְחַיִּים טוֹבִים וּלְשָׁלוֹם, בְּיוֹם רֹאשׁ הַחֹדֶשׁ הַזֶּה. חַג הַמַּצּוֹת הַזֶּה. חַג הַסֻּכּוֹת הַזֶּה. זָכְרֵנוּ יְיָ אֱלֹהֵינוּ בּוֹ לְטוֹבָה. וּפָקְדֵנוּ בוֹ לִבְרָכָה. וְהוֹשִׁיעֵנוּ בוֹ לְחַיִּים טוֹבִים. וּבִדְבַר יְשׁוּעָה וְרַחֲמִים חוּס וְחָנֵּנוּ וְרַחֵם עָלֵינו וְהוֹשִׁיעֵנוּ כִּי אֵלֶיךָ עֵינֵינוּ, כִּי אֵל מֶלֶךְ חַנּוּן וְרַחוּם אָתָּה:",
  "וְתֶחֱזֶינָה עֵינֵינוּ בְּשׁוּבְךָ לְצִיּוֹן בְּרַחֲמִים. בָּרוּךְ אַתָּה יְיָ, הַמַּחֲזִיר שְׁכִינָתוֹ לְצִיּוֹן:",
  "מוֹדִֽים אֲנַֽחְנוּ לָךְ, שָׁאַתָּה הוּא יְיָ אֱלֹהֵינוּ וֵאלֹהֵֽי אֲבוֹתֵינוּ לְעוֹלָם וָעֶד, צוּר חַיֵּינוּ, מָגֵן יִשְׁעֵנוּ, אַתָּה־הוּא לְדוֹר וָדוֹר, נוֹדֶה לְּךָ וּנְסַפֵּר תְּהִלָּתֶךָ, עַל חַיֵּינוּ הַמְּסוּרִים בְּיָדֶךָ, וְעַל נִשְׁמוֹתֵינוּ הַפְּקוּדוֹת לָךְ, וְעַל נִסֶּיךָ שֶׁבְּכָל־יוֹם עִמָּנוּ, וְעַל נִפְלְאוֹתֶיךָ וְטוֹבוֹתֶיךָ שֶׁבְּכָל־עֵת, עֶרֶב וָבֹקֶר וְצָהֱרָיִם. הַטּוֹב, כִּי לֹּא־כָלֽוּ רַחֲמֶיךָ, הַמְרַחֵֽם, כִּי לֹא־תַֽמּוּ חֲסָדֶֽיךָ, כִּי מֵעוֹלָֽם קִוִּֽינוּ לָךְ:",
  "§@nisim בחנוכה ובפורים — ועל הנסים",
  "וְעַל הַנִּסִּים וְעַל הַפֻּרְקָן וְעַל הַגְּבוּרוֹת וְעַל הַתְּשׁוּעוֹת וְעַל הַנִּפְלָאוֹת שֶׁעָשִׂיתָ לַאֲבוֹתֵינוּ בַּיָּמִים הָהֵם בִּזְּמַן הַזֶּה:",
  "§@chanukah לחנוכה",
  "בִּימֵי מַתִּתְיָהו בֶּן יוֹחָנָן כֹּהֵן גָּדוֹל, חַשְׁמוֹנָאִי וּבָנָיו, כְּשֶׁעָמְדָה מַלְכוּת יָוָן הָרְשָׁעָה עַל עַמְּךָ יִשְׂרָאֵל, לְהַשְׁכִּיחָם תּוֹרָתֶךָ וּלְהַעֲבִירָם מֵחֻקֵּי רְצוֹנֶךָ, וְאַתָּה בְּרַחֲמֶיךָ הָרַבִּים, עָמַדְתָּ לָהֶם בְּעֵת צָרָתָם. רַבְתָּ אֶת־רִיבָם, דַּנְתָּ אֶת־דִּינָם, נָקַמְתָּ אֶת־נִקְמָתָם, מָסַרְתָּ גִבּוֹרִים בְּיַד חַלָּשִׁים, וְרַבִּים בְּיַד מְעַטִּים, וּטְמֵאִים בְּיַד טְהוֹרִים, וּרְשָׁעִים בְּיַד צַדִּיקִים, וְזֵדִים בְּיַד עוֹסְקֵי תוֹרָתֶךָ. וּלְךָ עָשִׂיתָ שֵׁם גָּדוֹל וְקָדוֹשׁ בְּעוֹלָמֶךָ, וּלְעַמְּךָ יִשְׂרָאֵל עָשִׂיתָ תְּשׁוּעָה גְדוֹלָה וּפֻרְקָן כְּהַיּוֹם הַזֶּה. וְאַחַר כָּךְ בָּאוּ בָנֶיךָ לִדְבִיר בֵּיתֶךָ, וּפִנּוּ אֶת הֵיכָלֶךָ, וְטִהֲרוּ אֶת־מִקְדָּשֶׁךָ, וְהִדְלִיקוּ נֵרוֹת בְּחַצְרוֹת קָדְשֶׁךָ, וְקָבְעוּ שְׁמוֹנַת יְמֵי חֲנֻכָּה אֵלּוּ, לְהוֹדוֹת וּלְהַלֵּל לְשִׁמְךָ הַגָּדוֹל:",
  "§@purim לפורים",
  "בִּימֵי מָרְדְּכַי וְאֶסְתֵּר בְּשׁוּשַׁן הַבִּירָה, כְּשֶׁעָמַד עֲלֵיהֶם הָמָן הָרָשָׁע, בִּקֵּשׁ לְהַשְׁמִיד לַהֲרוֹג וּלְאַבֵּד אֶת־כָּל־הַיְּהוּדִים, מִנַּעַר וְעַד זָקֵן טַף וְנָשִׁים, בְּיוֹם אֶחָד, בִּשְׁלֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים עָשָׂר, הוּא חֹדֶשׁ אֲדָר, וּשְׁלָלָם לָבוֹז. וְאַתָּה בְּרַחֲמֶיךָ הָרַבִּים הֵפַרְתָּ אֶת עֲצָתוֹ, וְקִלְקַלְתָּ אֶת מַחֲשַׁבְתּוֹ, וַהֲשֵׁבוֹתָ לוֹ גְמוּלוֹ בְּרֹאשׁוֹ, וְתָלוּ אוֹתוֹ וְאֶת־בָּנָיו עַל הָעֵץ:",
  "וְעַל־כֻּלָּם יִתְבָּרֵךְ וְיִתְרוֹמָם וְיִתְנַשֵּׂא שִׁמְךָ מַלְכֵּנוּ תָּמִיד לְעוֹלָם וָעֶד:",
  "§@ayt בעשרת ימי תשובה",
  "וּכְתֽוֹב לְחַיִּֽים טוֹבִֽים כָּל־בְּנֵֽי בְרִיתֶֽךָ:",
  "וְכָל־הַחַיִּים יוֹדוּךָ סֶּלָה, וִיהַלְלוּ שִׁמְךָ הַגָּדוֹל לְעוֹלָם כִּי טוֹב, הָאֵל יְשׁוּעָתֵנוּ וְעֶזְרָתֵנוּ סֶלָה, הָאֵל הַטּוֹב. בָּרוּךְ אַתָּה יְיָ, הַטּוֹב שִׁמְךָ וּלְךָ נָאֶה לְהוֹדוֹת:",
  "שִׂים שָׁלוֹם, טוֹבָה וּבְרָכָה, חַיִּים חֵן וָחֶסֶד וְרַחֲמִים, עָלֵינוּ וְעַל כָּל־יִשְׂרָאֵל עַמֶּךָ. בָּרְכֵנוּ אָבִינוּ כֻּלָּנוּ כְּאֶחָד בְּאוֹר פָּנֶיךָ, כִּי בְאוֹר פָּנֶיךָ נָתַתָּ לָּנוּ יְיָ אֱלֹהֵינוּ תּוֹרַת חַיִּים וְאַהֲבַת חֶסֶד, וּצְדָקָה וּבְרָכָה וְרַחֲמִים וְחַיִּים וְשָׁלוֹם, וְטוֹב בְּעֵינֶיךָ לְבָרֵךְ אֶת־עַמְּךָ יִשְׂרָאֵל בְּכָל־עֵת וּבְכָל־שָׁעָה בִּשְׁלוֹמֶךָ:",
  "§@ayt בעשרת ימי תשובה",
  "וּבְסֵֽפֶר חַיִּים בְּרָכָה וְשָׁלוֹם וּפַרְנָסָה טוֹבָה יְשׁוּעָה וְנֶחָמָה וּגְזֵרוֹת טוֹבוֹת נִזָּכֵר וְנִכָּתֵב לְפָנֶֽיךָ, אֲנַֽחְנוּ וְכָל־עַמְּךָ בֵּית יִשְׂרָאֵל, לְחַיִּים טוֹבִים וּלְשָׁלוֹם:",
  "בָּרוּךְ אַתָּה יְיָ, הַמְבָרֵךְ אֶת־עַמּוֹ יִשְׂרָאֵל בַּשָּׁלוֹם:"
],

netzor: [
  "יִהְיוּ לְרָצוֹן אִמְרֵי פִי וְהֶגְיוֹן לִבִּי לְפָנֶיךָ, יְיָ צוּרִי וְגוֹאֲלִי:",
  "אֱלֹהַי, נְצוֹר לְשׁוֹנִי מֵרָע, וּשְׂפָתַי מִדַּבֵּר מִרְמָה, וְלִמְקַלְלַי נַפְשִׁי תִדּוֹם, וְנַפְשִׁי כֶּעָפָר לַכֹּל תִּהְיֶה. פְּתַח לִבִּי בְּתוֹרָתֶךָ וּבְמִצְוֹתֶיךָ תִּרְדּוֹף נַפְשִׁי, וְכָל־הַחוֹשְׁבִים עָלַי רָעָה, מְהֵרָה הָפֵר עֲצָתָם וְקַלְקֵל מַחֲשַׁבְתָּם: יִהְיוּ כְּמֹץ לִפְנֵי רוּחַ וּמַלְאַךְ יְיָ דּוֹחֶה. לְמַעַן יֵחָלְצוּן יְדִידֶיךָ, הוֹשִׁיעָה יְמִינְךָ וַעֲנֵנִי: עֲשֵׂה לְמַעַן שְׁמֶךָ, עֲשֵׂה לְמַעַן יְמִינֶךָ, עֲשֵׂה לְמַעַן תּוֹרָתֶךָ, עֲשֵׂה לְמַעַן קְדֻשָּׁתֶךָ. יִהְיוּ לְרָצוֹן אִמְרֵי פִי וְהֶגְיוֹן לִבִּי לְפָנֶיךָ, יְיָ צוּרִי וְגוֹאֲלִי:",
  "§ בעשרת ימי תשובה",
  "עֹשֶׂה שָׁלוֹם ( הַשָּׁלוֹם) בִּמְרוֹמָיו הוּא יַעֲשֶׂה שָׁלוֹם עָלֵינוּ וְעַל כָּל־יִשְׂרָאֵל, וְאִמְרוּ אָמֵן:",
  "יְהִי רָצוֹן מִלְפָנֶיךָ, יְיָ אֱלֹהֵינוּ וֵאלֹהֵי אֲבוֹתֵינוּ, שֶׁיִבָּנֶה בֵּית הַמִּקְדָּשׁ בִּמְהֵרָה בְיָמֵינוּ, וְתֵן חֶלְקֵנוּ בְּתוֹרָתֶךָ:"
],

chazara: [
  "אֲדֹנָי, שְׂפָתַי תִּפְתָּח, וּפִי יַגִּיד תְּהִלָּתֶךָ:",
  "בָּרֽוּךְ אַתָּֽה יְיָ אֱלֹהֵֽינוּ וֵאלֹהֵֽי אֲבוֹתֵֽינוּ, אֱלֹהֵֽי אַבְרָהָֽם, אֱלֹהֵֽי יִצְחָֽק, וֵאלֹהֵֽי יַעֲקֹֽב, הָאֵֽל הַגָּדֽוֹל הַגִּבּֽוֹר וְהַנּוֹרָֽא, אֵל עֶלְיֽוֹן, גּוֹמֵֽל חֲסָדִֽים טוֹבִֽים, קוֹנֵֽה הַכֹּֽל, וְזוֹכֵֽר חַסְדֵּֽי אָבֽוֹת, וּמֵבִֽיא גּוֹאֵֽל לִבְנֵֽי בְנֵיהֶֽם לְמַֽעַן שְׁמוֹ בְּאַהֲבָֽה:",
  "מֶֽלֶךְ עוֹזֵֽר וּמוֹשִֽׁיעַ וּמָגֵֽן: בָּרֽוּךְ אַתָּֽה יְיָ, מָגֵֽן אַבְרָהָֽם:",
  "אַתָּֽה גִּבּֽוֹר לְעוֹלָֽם אֲדֹנָֽי, מְחַיֶּֽה מֵתִֽים אַתָּֽה, רַב לְהוֹשִֽׁיעַ:",
  "מוֹרִֽיד הַטָּל: מַשִּֽׁיב הָרֽוּחַ וּמוֹרִֽיד הַגֶּֽשֶׁם:",
  "מְכַלְכֵּֽל חַיִּֽים בְּחֶֽסֶד, מְחַיֶּֽה מֵתִֽים בְּרַחֲמִֽים רַבִּֽים, סוֹמֵֽךְ נוֹפְלִֽים, וְרוֹפֵֽא חוֹלִֽים, וּמַתִּֽיר אֲסוּרִֽים, וּמְקַיֵּֽם אֱמוּנָתֽוֹ לִישֵׁנֵֽי עָפָֽר. מִי־כָמֽוֹךָ בַּֽעַל גְּבוּרֽוֹת וּמִֽי דּֽוֹמֶה לָּךְ, מֶֽלֶךְ מֵמִֽית וּמְחַיֶּֽה וּמַצְמִֽיחַ יְשׁוּעָֽה:",
  "וְנֶאֱמָֽן אַתָּֽה לְהַחֲיוֹֽת מֵתִֽים. בָּרֽוּךְ אַתָּֽה יְיָ, מְחַיֶּֽה הַמֵּתִֽים:",
  "§ כשהש״ץ חוזר הש״ע אומרים זה",
  "נַקְדִּישָֽׁךְ וְנַעֲרִיצָֽךְ כְּנֹֽעַם שִֹֽיחַ סוֹד שַֹרְפֵֽי קֹֽדֶשׁ הַמְשַׁלְּשִֽׁים לְךָ קְדֻשָּֽׁה, כַּכָּתֽוּב עַל־יַד נְבִיאֶֽךָ, וְקָרָֽא זֶה אֶל־זֶֽה וְאָמַֽר: קָדֽוֹשׁ ׀ קָדֽוֹשׁ, קָדֽוֹשׁ יְיָ צְבָאֽוֹת, מְלֹא כָל־הָאָֽרֶץ כְּבוֹדֽוֹ: לְעֻמָּתָֽם מְשַׁבְּחִֽים וְאוֹמְרִֽים: בָּרֽוּךְ כְּבוֹד־יְיָ מִמְּקוֹמֽוֹ: וּבְדִבְרֵֽי קָדְשְׁךָֽ כָּתוּֽב לֵאמֹֽר: יִמְלֹֽךְ יְיָ לְעוֹלָֽם, אֱלֹהַֽיִךְ צִיּוֹֽן לְדֹר וָדֹֽר, הַלְלוּיָֽהּ:",
  "אַתָּֽה קָדוֹשׁ וְשִׁמְךָֽ קָדֽוֹשׁ, וּקְדוֹשִֽׁים בְּכָל־יוֹֽם יְהַלְלֽוּךָ סֶּֽלָה. בָּרֽוּךְ אַתָּֽה יְיָ, הָאֵֽל ( הַמֶּֽלֶךְ) הַקָּדֽוֹשׁ:",
  "אַתָּֽה חוֹנֵֽן לְאָדָֽם דַּֽעַת, וּמְלַמֵּֽד לֶאֱנֽוֹשׁ בִּינָֽה. חָנֵּֽנוּ מֵאִתְּךָֽ חָכְמָֽה בִּינָֽה וָדָֽעַת. בָּרֽוּךְ אַתָּֽה יְיָ, חוֹנֵֽן הַדָּֽעַת:",
  "הֲשִׁיבֵנוּ אָבִינוּ לְתוֹרָתֶךָ, וְקָרְבֵנוּ מַלְכֵּנוּ לַעֲבוֹדָתֶךָ, וְהַחֲזִירֵנוּ בִּתְשׁוּבָה שְׁלֵמָה לְפָנֶיךָ. בָּרוּךְ אַתָּה יְיָ, הָרוֹצֶה בִּתְשׁוּבָה:",
  "סְלַח־לָנוּ אָבִינוּ, כִּי חָטָאנוּ, מְחוֹל לָנוּ מַלְכֵּנוּ, כִּי פָשָׁעְנוּ, כִּי אֵל טוֹב וְסַלָּח אָֽתָּה. בָּרוּךְ אַתָּה יְיָ, חַנּוּן, הַמַּרְבֶּה לִסְלוֹחַ:",
  "רְאֵה נָא בְעָנְיֵנוּ וְרִיבָה רִיבֵנוּ, וּגְאָלֵנוּ מְהֵרָה לְמַעַן שְׁמֶךָ, כִּי אֵל גּוֹאֵל חָזָק אָֽתָּה. בָּרוּךְ אַתָּה יְיָ, גּוֹאֵל יִשְׂרָאֵל:",
  "רְפָאֵנוּ יְיָ וְנֵרָפֵא, הוֹשִׁיעֵנוּ וְנִוָּשֵׁעָה, כִּי תְהִלָּתֵנוּ אָֽתָּה, וְהַעֲלֵה אֲרוּכָה וּרְפוּאָה שְׁלֵמָה לְכָל־מַכּוֹתֵינוּ. כִּי אֵל מֶלֶךְ רוֹפֵא נֶאֱמָן וְרַחֲמָן אָֽתָּה. בָּרוּךְ אַתָּה יְיָ, רוֹפֵא חוֹלֵי עַמוֹ יִשְׂרָאֵל:",
  "בָּרֵךְ עָלֵינוּ יְיָ אֱלֹהֵינוּ אֶת־הַשָּׁנָה הַזֹּאת וְאֵת כָּל־מִינֵי תְבוּאָתָהּ לְטוֹבָה וְתֵן בְּרָכָה ( טַל וּמָטָר לִבְרָכָה) עַל פְּנֵי הָאֲדָמָה, וְשַׂבְּעֵנוּ מִטוּבֶךָ, וּבָרֵךְ שְׁנָתֵנוּ כַּשָּׁנִים הַטּוֹבוֹת לִבְרָכָה, כִּי אֵל טוֹב וּמֵטִיב אַתָּה וּמְבָרֵךְ הַשָּׁנִים. בָּרוּךְ אַתָּה יְיָ, מְבָרֵךְ הַשָּׁנִים:",
  "תְּקַע בְּשׁוֹפָר גָּדוֹל לְחֵרוּתֵנוּ, וְשָׂא נֵס לְקַבֵּץ גָּלֻיּוֹתֵינוּ, וְקַבְּצֵנוּ יַחַד מֵאַרְבַּע כַּנְפוֹת הָאָרֶץ לְאַרְצֵנוּ. בָּרוּךְ אַתָּה יְיָ, מְקַבֵּץ נִדְחֵי עַמוֹ יִשְׂרָאֵל:",
  "הָשִׁיבָה שׁוֹפְטֵינוּ כְּבָרִאשֹׁנָה וְיוֹעֲצֵינוּ כְּבַתְּחִלָּה, וְהָסֵר מִמֶּנוּ יָגוֹן וַאֲנָחָה, וּמְלוֹךְ עָלֵינוּ אַתָּה יְיָ לְבַדְּךָ בְּחֶסֶד וּבְרַחֲמִים, בְּצֶדֶק וּבְמִּשְׁפָּט. בָּרוּךְ אַתָּה יְיָ, מֶלֶךְ אוֹהֵב צְדָקָה וּמִשְׁפָּט: ( הַמֶּלֶךְ הַמִשְׁפָּט:)",
  "וְלַמַּלְשִׁינִים אַל תְּהִי תִקְוָה, וְכָל־הַמִּינִים וְכָל־הַזֵּדִים כְּרֶגַע יֹאבֵדוּ, וְכָל אֹיְבֵי עַמְּךָ מְהֵרָה יִכָּרֵתוּ, וּמַּלְכוּת הָרִשְׁעָה מְהֵרָה תְעַקֵּר וּתְשַׁבֵּר וּתְמַגֵּר, וְתַכְנִיעַ בִּמְהֵרָה בְיָמֵינוּ. בָּרוּךְ אַתָּה יְיָ, שֹׁבֵר אֹיְבִים וּמַכְנִיעַ זֵדִים:",
  "עַל־הַצַּדִּיקִים וְעַל־הַחֲסִידִים, וְעַל־זִקְנֵי עַמְּךָ בֵּית יִשְׂרָאֵל, וְעַל פְּלֵיטַת בֵּית סוֹפְרֵיהֶם, וְעַל־גֵּרֵי הַצֶּדֶק וְעָלֵינוּ, יֶהֱמוּ נָא רַחֲמֶיךָ יְיָ אֱלֹהֵינוּ, וְתֵן שָׂכָר טוֹב לְכָל־הַבּוֹטְחִים בְּשִׁמְךָ בֶּאֱמֶת, וְשִׂים חֶלְקֵנוּ עִמָּהֶם, וּלְעוֹלָם לֹא נֵבוֹשׁ כִּי בְךָ בָּטָחְנוּ. בָּרוּךְ אַתָּה יְיָ, מִשְׁעָן וּמִבְטָח לַצַּדִּיקִים:",
  "וְלִירוּשָׁלַ͏ִם עִירְךָֽ בְּרַחֲמִֽים תָּשֽׁוּב, וְתִשְׁכּֽוֹן בְּתוֹכָֽהּ כַּאֲשֶֽׁר דִּבַּֽרְתָּ, וְכִסֵּֽא דָוִֽד עַבְדְּךָֽ מְהֵרָֽה בְּתוֹכָֽהּ תָּכִֽין, וּבְנֵֽה אוֹתָֽהּ בְּקָרֽוֹב בְּיָמֵֽינוּ בִּנְיַֽן עוֹלָֽם. בָּרוּךְ אַתָּה יְיָ, בּוֹנֵֽה יְרוּשָׁלָ͏ִם:",
  "אֶת־צֶֽמַח דָּוִֽד עַבְדְּךָֽ מְהֵרָֽה תַצְמִֽיחַ, וְקַרְנֽוֹ תָּרֽוּם בִּישׁוּעָתֶֽךָ, כִּי לִישׁוּעָתְךָֽ קִּוִּֽינוּ כָּל־הַיּוֹֽם. בָּרוּךְ אַתָּה יְיָ, מַצְמִֽיחַ קֶֽרֶן יְשׁוּעָֽה:",
  "שְׁמַע קוֹלֵֽנוּ יְיָ אֱלֹהֵינוּ, אָב הָרַחֲמָֽן רַחֵֽם עָלֵינוּ, וְקַבֵּֽל בְּרַחֲמִֽים וּבְרָצֽוֹן אֶת־תְּפִלָּתֵֽנוּ, כִּי אֵל שׁוֹמֵֽע תְּפִלּֽוֹת וְתַחֲנוּנִֽים אָֽתָּה, וּמִלְּפָנֶֽיךָ מַלְכֵּנוּ רֵיקָֽם אַל־תְּשִׁיבֵֽנוּ. כִּי אַתָּֽה שׁוֹמֵֽעַ תְּפִלַּֽת כָּל־פֶּֽה. בָּרוּךְ אַתָּֽה יְיָ, שׁוֹמֵֽעַ תְּפִלָּֽה:",
  "רְצֵה יְיָ אֱלֹהֵינוּ בְּעַמְּךָֽ יִשְׂרָאֵל וְלִתְפִלָּתָֽם שְׁעֵה, וְהָשֵֽׁב הָעֲבוֹדָֽה לִדְבִֽיר בֵּיתֶךָ, וְאִשֵּֽׁי יִשְׂרָאֵל וּתְפִלָּתָֽם בְּאַהֲבָֽה תְקַבֵּֽל בְּרָצֽוֹן, וּתְהִֽי לְרָצֽוֹן תָּמִֽיד עֲבוֹדַֽת יִשְׂרָאֵל עַמֶּֽךָ:",
  "וְתֶחֱזֶינָה עֵינֵינוּ בְּשׁוּבְךָ לְצִיּוֹן בְּרַחֲמִים. בָּרוּךְ אַתָּה יְיָ, הַמַּחֲזִיר שְׁכִינָתוֹ לְצִיּוֹן:",
  "§ מודים דרבנן",
  "מוֹדִים אֲנַֽחְנוּ לָךְ, שָׁאַתָּה הוּא יְיָ אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ, אֱלֹהֵי כָּל־בָּשָׂר, יוֹצְרֵֽנוּ, יוֹצֵר בְּרֵאשִׁית, בְּרָכוֹת וְהוֹדָאוֹת לְשִׁמְךָ הַגָּדוֹל וְהַקָּדוֹשׁ, עַל שֶׁהֶחֱיִיתָֽנוּ וְקִיַּמְתָּֽנוּ, כֵּן תְּחַיֵּֽינוּ וּתְקַיְּמֵֽנוּ, וְתֶאֱסוֹף גָּלֻיּוֹתֵֽינוּ לְחַצְרוֹת קָדְשֶֽׁךָ, וְנָשׁוּב אֵלֶיךָ לִשְׁמוֹר חֻקֶּֽיךָ, וְלַעֲשׂוֹת רְצוֹנֶֽךָ, וּלְעָבְדְּךָ בְּלֵבָב שָׁלֵם, עַל שֶׁאָֽנוּ מוֹדִים לָךְ, בָּרוּךְ אֵל הַהוֹדָאוֹת:מוֹדִים",
  "וְעַל־כֻּלָּם יִתְבָּרֵךְ וְיִתְרוֹמָם וְיִתְנַשֵּׂא שִׁמְךָ מַלְכֵּנוּ תָּמִיד לְעוֹלָם וָעֶד:",
  "וְכָל־הַחַיִּים יוֹדוּךָ סֶּלָה, וִיהַלְלוּ שִׁמְךָ הַגָּדוֹל לְעוֹלָם כִּי טוֹב, הָאֵל יְשׁוּעָתֵנוּ וְעֶזְרָתֵנוּ סֶלָה, הָאֵל הַטּוֹב. בָּרוּךְ אַתָּה יְיָ, הַטּוֹב שִׁמְךָ וּלְךָ נָאֶה לְהוֹדוֹת:",
  "אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ, בָּרְכֵֽנוּ בַבְּרָכָה הַמְּשֻׁלֶּֽשֶׁת בַּתּוֹרָה, הַכְּתוּבָה עַל־יְדֵי משֶׁה עַבְדֶּֽךָ, הָאֲמוּרָה מִפִּי אַהֲרֹן וּבָנָיו, כֹּהֲנִים עַם קְדוֹשֶֽׁךָ, כָּאָמוּר: יְבָרֶכְךָ יְיָ וְיִשְׁמְרֶֽךָ: יָאֵר יְיָ פָּנָיו אֵלֶֽיךָ, וִיחֻנֶּֽךָּ: יִשָּׂא יְיָ פָּנָיו אֵלֶֽיךָ, וְיָשֵׂם לְךָ שָׁלוֹם:",
  "שִׂים שָׁלוֹם, טוֹבָה וּבְרָכָה, חַיִּים חֵן וָחֶסֶד וְרַחֲמִים, עָלֵינוּ וְעַל כָּל־יִשְׂרָאֵל עַמֶּךָ. בָּרְכֵנוּ אָבִינוּ כֻּלָּנוּ כְּאֶחָד בְּאוֹר פָּנֶיךָ, כִּי בְאוֹר פָּנֶיךָ נָתַתָּ לָּנוּ יְיָ אֱלֹהֵינוּ תּוֹרַת חַיִּים וְאַהֲבַת חֶסֶד, וּצְדָקָה וּבְרָכָה וְרַחֲמִים וְחַיִּים וְשָׁלוֹם, וְטוֹב בְּעֵינֶיךָ לְבָרֵךְ אֶת־עַמְּךָ יִשְׂרָאֵל בְּכָל־עֵת וּבְכָל־שָׁעָה בִּשְׁלוֹמֶךָ:",
  "בָּרוּךְ אַתָּה יְיָ, הַמְבָרֵךְ אֶת־עַמּוֹ יִשְׂרָאֵל בַּשָּׁלוֹם:"
