<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1321">
<title>מניין של אחד — עוזר תפילה ליחיד</title>

<!-- התקנה כאפליקציה -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מניין של אחד">
<meta name="description" content="עוזר תפילה למתפלל ביחיד: קצב אישי, לוח עברי ותזכורות הזכרות. נוסח חב״ד.">
<style>
  :root{
    --bg:#0d1321; --card:#1a2236; --card2:#232e4a; --line:#2e3b5e;
    --gold:#d9b45b; --gold-soft:#b89a52; --text:#e8e6df; --dim:#8d94a8;
    --green:#6fbf8f; --blue:#7aa2d6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI","Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;}
  #app{max-width:520px; margin:0 auto; min-height:100vh;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));}
  /* פס התקנה */
  .installBar{display:none; align-items:center; gap:10px; background:var(--card2);
    border:1px solid var(--gold-soft); border-radius:14px; padding:12px 14px; margin-top:14px;}
  .installBar.show{display:flex;}
  .installBar .t{flex:1; font-size:.88rem;}
  .installBar .x{background:none;border:none;color:var(--dim);font-size:1.1rem;cursor:pointer;padding:0 4px;}
  h1{font-size:1.35rem; margin:0; letter-spacing:.5px;}
  .sub{color:var(--dim); font-size:.85rem; margin-top:2px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-top:14px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .chip{background:var(--card2); border:1px solid var(--line); color:var(--text);
    border-radius:999px; padding:4px 12px; font-size:.8rem;}
  .chip.imp{border-color:var(--gold-soft); color:var(--gold);}
  .tefBtn{display:flex; align-items:center; justify-content:space-between; width:100%;
    background:linear-gradient(135deg,var(--card2),var(--card)); border:1px solid var(--line);
    color:var(--text); border-radius:16px; padding:16px; margin-top:12px; font-size:1.1rem; cursor:pointer;}
  .tefBtn .n{font-weight:700;}
  .tefBtn .m{color:var(--dim); font-size:.85rem;}
  .minIn{width:56px; background:var(--bg); color:var(--gold); border:1px solid var(--line);
    border-radius:10px; padding:6px 4px; text-align:center; font-size:1rem;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .startBtn{background:var(--gold); color:#1a1a10; border:none; border-radius:12px;
    padding:10px 22px; font-size:1rem; font-weight:700; cursor:pointer;}
  label.sw{display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--dim); cursor:pointer;}
  /* prayer screen */
  .topbar{display:flex; justify-content:space-between; align-items:center;}
  .exit{background:none; border:1px solid var(--line); color:var(--dim); border-radius:10px; padding:6px 12px; cursor:pointer;}
  .ctrls{display:flex; gap:8px;}
  .ico{background:var(--card2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; width:40px; height:34px; font-size:1rem; cursor:pointer; line-height:1;}
  .ico:active{transform:scale(.94);}
  .pauseOv{position:fixed; inset:0; background:rgba(13,19,33,.94); z-index:50;
    display:flex; align-items:center; justify-content:center; text-align:center;}
  .pauseBox{padding:24px;}
  .startFrom{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-top:8px;}
  .startFrom .m{color:var(--dim); font-size:.82rem;}
  .chip.pick{cursor:pointer; white-space:nowrap;}
  .chip.pick.on{background:var(--gold); color:#1a1a10; border-color:var(--gold); font-weight:700;}
  .rangeRow{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .rLbl{color:var(--dim); font-size:.82rem; flex:none; width:26px;}
  .chips.scrollX{flex-wrap:nowrap; overflow-x:auto; margin-top:0; padding-bottom:2px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .chips.scrollX::-webkit-scrollbar{display:none;}
  .clockWrap{text-align:center; margin-top:8px;}
  .clock{font-size:2.7rem; font-variant-numeric:tabular-nums; font-weight:300; letter-spacing:2px;}
  .clock.over{color:#e0a06a;}
  .remain{color:var(--dim); font-size:.85rem; margin-top:-2px;}
  .barWrap{background:var(--card2); border-radius:999px; height:10px; margin:12px 0 4px; overflow:hidden;}
  .bar{height:100%; background:linear-gradient(90deg,var(--gold-soft),var(--gold)); width:0%; border-radius:999px; transition:width .5s linear;}
  .quote{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px;
    margin-top:12px; min-height:78px; display:flex; flex-direction:column; justify-content:center;
    transition:opacity .6s;}
  .quote .q{font-size:.98rem; line-height:1.5;}
  .quote .s{color:var(--gold); font-size:.78rem; margin-top:6px;}
  /* groups */
  .grp{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-top:10px; overflow:hidden;}
  .grp.cur{border-color:var(--gold-soft);}
  .grpHdr{display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; position:relative;}
  .grpHdr .gdot{width:12px; height:12px; border-radius:50%; background:var(--line); flex:none;}
  .grp.done .gdot{background:var(--green);}
  .grp.cur .gdot{background:var(--gold);}
  .grpHdr .gnm{flex:1; font-weight:700; font-size:1rem;}
  .grp.done .gnm{color:var(--dim);}
  .grpHdr .gtm{color:var(--dim); font-size:.78rem; font-variant-numeric:tabular-nums;}
  .grpHdr .arr{color:var(--dim); font-size:.75rem; transition:transform .2s;}
  .grp.open .arr{transform:rotate(90deg);}
  .grpBar{height:3px; background:var(--card2);}
  .grpBar>div{height:100%; background:var(--gold); width:0%;}
  .grpBody{display:none; border-top:1px solid var(--line);}
  .grp.open .grpBody{display:block;}
  .sec{display:flex; align-items:center; gap:10px; padding:9px 14px 9px 12px; cursor:pointer; position:relative;
    padding-inline-start:26px;}
  .sec .dot{width:8px; height:8px; border-radius:50%; background:var(--line); flex:none;}
  .sec.done .dot{background:var(--green);}
  .sec.cur{background:var(--card2);}
  .sec.cur .dot{background:var(--gold);}
  .sec .nm{flex:1; font-size:.92rem;}
  .sec.done .nm{color:var(--dim);}
  .sec .tm{color:var(--dim); font-size:.74rem; font-variant-numeric:tabular-nums;}
  .sec .badge{display:inline-block; background:#3a2f14; color:var(--gold); border:1px solid var(--gold-soft);
    border-radius:8px; font-size:.68rem; padding:1px 6px; margin-inline-start:6px; vertical-align:1px;}
  .secbar{position:absolute; bottom:0; right:26px; left:14px; height:2px; background:var(--line); border-radius:2px; overflow:hidden; opacity:0;}
  .sec.cur .secbar{opacity:1;}
  .secbar>div{height:100%; background:var(--gold); width:0%;}
  /* ----- חלון "בוצע" ----- */
  .drawer{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-top:14px; overflow:hidden;}
  .drawerHdr{display:flex; align-items:center; gap:10px; padding:11px 14px; cursor:pointer;}
  .drawerHdr .dv{color:var(--green); font-size:.95rem;}
  .drawerHdr .dnm{flex:1; color:var(--dim); font-size:.9rem;}
  .drawerHdr .dtm{color:var(--dim); font-size:.8rem; font-variant-numeric:tabular-nums;}
  .drawerHdr .arr{color:var(--dim); font-size:.7rem; transition:transform .2s;}
  .drawer.open .arr{transform:rotate(-90deg);}
  .drawerBody{display:none; border-top:1px solid var(--line); padding:4px 0;}
  .drawer.open .drawerBody{display:block;}
  .dRow{display:flex; align-items:center; gap:10px; padding:7px 14px; cursor:pointer; font-size:.88rem;}
  .dRow:active{background:var(--card2);}
  .dRow .dv{color:var(--green); font-size:.8rem;}
  .dRow .dnm{flex:1; color:var(--dim); text-decoration:line-through; text-decoration-color:#4a5570;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dRow .dtm{color:var(--dim); font-size:.76rem; font-variant-numeric:tabular-nums;}
  /* ----- הקטע הנוכחי ----- */
  .curCard{background:linear-gradient(135deg,var(--card2),var(--card));
    border:1px solid var(--gold-soft); border-radius:16px; padding:14px 16px; margin-top:14px;
    box-shadow:0 0 0 3px rgba(217,180,91,.07);}
  .curTop{display:flex; justify-content:space-between; align-items:center;}
  .curGrp{color:var(--gold); font-size:.78rem; letter-spacing:.4px;}
  .curPlan{color:var(--dim); font-size:.76rem;}
  .curNm{font-size:1.25rem; font-weight:700; line-height:1.35; margin:6px 0 12px;}
  .curBar{background:rgba(0,0,0,.28); border-radius:999px; height:6px; overflow:hidden;}
  .curBar>div{height:100%; width:0%; background:var(--gold); border-radius:999px; transition:width .5s linear;}
  .curBot{display:flex; justify-content:space-between; align-items:center; margin-top:12px;}
  .curElapsed{color:var(--dim); font-size:.9rem; font-variant-numeric:tabular-nums;}
  .doneBtn{background:var(--gold); color:#1a1a10; border:none; border-radius:10px;
    padding:9px 20px; font-size:.95rem; font-weight:700; cursor:pointer;}
  .doneBtn:active{transform:scale(.96);}
  .curBtns{display:flex; gap:8px; align-items:center;}
  .holdBtn{background:var(--card); border:1px solid var(--line); color:var(--text);
    border-radius:10px; width:42px; height:38px; font-size:1.05rem; cursor:pointer; line-height:1;}
  .holdBtn.on{background:#3a2f14; border-color:var(--gold); color:var(--gold);}
  .holdBtn:active{transform:scale(.95);}
  .curNote{font-size:.76rem; margin-top:8px; min-height:0; line-height:1.4;}
  .curNote.warn{color:#e0a06a;}
  .curNote.hold{color:var(--gold);}
  .curElapsed.over{color:#e0a06a;}
  .studyBtn{background:var(--card); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:9px 14px; font-size:.88rem; cursor:pointer;}
  .studyBtn:active{background:var(--bg);}
  /* ----- מסך לימוד ----- */
  .sheetOv{position:fixed; inset:0; z-index:60; background:rgba(5,8,16,.72);
    display:flex; align-items:flex-end; justify-content:center;}
  .sheet{background:var(--card); border:1px solid var(--line); border-bottom:none;
    border-radius:20px 20px 0 0; width:100%; max-width:520px; max-height:88vh;
    display:flex; flex-direction:column; animation:up .22s ease-out;}
  @keyframes up{from{transform:translateY(30px); opacity:.4;} to{transform:none; opacity:1;}}
  .sheetGrab{width:40px; height:4px; background:var(--line); border-radius:2px; margin:9px auto 4px;}
  .sheetHdr{display:flex; align-items:flex-start; justify-content:space-between; padding:6px 16px 10px;}
  .sheetGrp{color:var(--gold); font-size:.75rem;}
  .sheetNm{font-size:1.12rem; font-weight:700; line-height:1.35; margin-top:2px;}
  .sheetX{background:none; border:none; color:var(--dim); font-size:1.2rem; cursor:pointer; padding:0 4px;}
  .tabs{display:flex; gap:6px; padding:0 16px 10px; border-bottom:1px solid var(--line);}
  .tab{flex:1; background:var(--bg); border:1px solid var(--line); color:var(--dim);
    border-radius:10px; padding:8px 4px; font-size:.85rem; cursor:pointer;}
  .tab.on{background:var(--card2); border-color:var(--gold-soft); color:var(--gold); font-weight:700;}
  .sheetBody{overflow-y:auto; padding:14px 16px calc(20px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;}
  .pane{display:none;}
  .pane.on{display:block;}
  .pane p{margin:0; line-height:1.75; font-size:.97rem;}
  .srcLine{color:var(--dim); font-size:.78rem; margin-top:10px; padding-top:8px; border-top:1px dashed var(--line);}
  .wRow{display:flex; gap:12px; padding:9px 0; border-bottom:1px solid rgba(46,59,94,.45);}
  .wRow:last-child{border-bottom:none;}
  .wW{min-width:36%; color:var(--gold); font-size:.95rem; line-height:1.5;}
  .wM{flex:1; font-size:.92rem; line-height:1.55; color:var(--text);}
  .ladderNote{margin-top:18px; background:var(--bg); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; font-size:.85rem; line-height:1.65; color:var(--dim);}
  .ladderNote b{color:var(--gold);}
  .disclaim{color:var(--dim); font-size:.75rem; text-align:center; margin-top:14px; line-height:1.5;}
  .curCard.rt{border-color:var(--blue); box-shadow:0 0 0 3px rgba(122,162,214,.09);}
  .curCard.rt .curGrp{color:var(--blue);}
  .curCard.rt .curBar>div{background:var(--blue);}
  .rtBtn{width:100%; margin-top:10px; background:var(--card); border:1px dashed var(--line);
    color:var(--dim); border-radius:12px; padding:11px; font-size:.9rem; cursor:pointer;}
  .rtBtn:active{background:var(--card2);}
  .rtBtn.back{border-style:solid; border-color:var(--blue); color:var(--blue);}
  /* ----- הבא בתור ----- */
  .upList{margin-top:6px;}
  .upGrp{color:var(--dim); font-size:.76rem; letter-spacing:.5px; padding:14px 4px 5px;}
  .upRow{position:relative; overflow:hidden; border-radius:12px; margin-bottom:2px;}
  .upRow .swipeBg{position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-start;
    padding-inline-start:18px; background:#20402f; color:var(--green); font-size:.85rem; border-radius:12px;}
  .upRow .upIn{position:relative; display:flex; align-items:center; gap:10px; padding:11px 12px;
    background:var(--card); border:1px solid var(--line); border-radius:12px; cursor:pointer;}
  .upRow:active .upIn{background:var(--card2);}
  .upRow.swiping .upIn{background:#243a2e;}
  .upDot{width:7px; height:7px; border-radius:50%; background:var(--line); flex:none;}
  .upNm{flex:1; font-size:.94rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .upTm{color:var(--dim); font-size:.76rem; font-variant-numeric:tabular-nums;}
  .hint{color:var(--dim); font-size:.78rem; text-align:center; margin-top:10px;}
  .finishBtn{width:100%; margin-top:16px; background:var(--card2); border:1px solid var(--gold-soft);
    color:var(--gold); border-radius:14px; padding:14px; font-size:1.05rem; cursor:pointer;}
  .awayLine{font-size:.76rem; margin-top:4px; color:#e0a06a; display:none;}
  .awayLine.on{display:block;}
  .pace{font-size:.82rem; margin-top:6px;}
  .pace.ok{color:var(--green);}
  .pace.fast{color:var(--blue);}
  .pace.slow{color:#e0a06a;}
  .big{font-size:2.4rem; margin:10px 0 4px; color:var(--gold); font-variant-numeric:tabular-nums;}
  .logHead{display:flex; gap:8px; color:var(--dim); font-size:.75rem; padding:6px 8px; border-bottom:1px solid var(--line);}
  .logHead>div:first-child{flex:1;}
  .logHead>div:not(:first-child){width:62px; text-align:center;}
  .logRow{display:flex; gap:8px; align-items:center; padding:7px 8px; border-bottom:1px solid rgba(46,59,94,.4); font-size:.86rem;}
  .logRow:last-child{border-bottom:none;}
  .logRow .ln{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .logRow .lt{width:62px; text-align:center; color:var(--dim); font-variant-numeric:tabular-nums;}
  .logRow .ld{width:62px; text-align:center; font-variant-numeric:tabular-nums; font-size:.8rem;}
  .logRow .ld.ok{color:var(--green);}
  .logRow .ld.fast{color:var(--blue);}
  .logRow .ld.slow{color:#e0a06a;}
  .logRow.skip{opacity:.45;}
  .logRow.skip .ld{color:var(--dim); font-size:.72rem;}
  /* ----- מסך חזרה לתפילה ----- */
  .backOv{position:fixed; inset:0; z-index:70; background:rgba(13,19,33,.96);
    display:flex; align-items:center; justify-content:center; text-align:center;}
  .backBox{padding:26px;}
  .backT{font-size:1.15rem; margin-top:10px;}
  .backBig{font-size:2.6rem; color:#e0a06a; font-variant-numeric:tabular-nums; margin:6px 0 2px;}
  .backNm{color:var(--gold); font-size:.95rem; margin-top:14px;}
  /* ----- ריכוז בסיכום ----- */
  .focus{border-width:1px;}
  .focus.good{border-color:var(--green);}
  .focus.mid{border-color:#c9a24a;}
  .focus.low{border-color:#e0a06a;}
  .focusTop{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .focusBig{font-size:1.7rem; font-weight:700;}
  .focus.good .focusBig{color:var(--green);}
  .focus.mid .focusBig{color:#d9b45b;}
  .focus.low .focusBig{color:#e0a06a;}
  .focusRow{display:flex; justify-content:space-between; font-size:.88rem; padding:4px 0; color:var(--dim);}
  .focusRow b{color:var(--text); font-variant-numeric:tabular-nums;}
  /* ----- היסטוריה ----- */
  .hStats{display:flex; gap:8px; margin:12px 0 10px;}
  .hStats>div{flex:1; background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:8px 4px; text-align:center;}
  .hStats b{display:block; font-size:1.05rem; color:var(--gold); font-variant-numeric:tabular-nums;}
  .hStats span{color:var(--dim); font-size:.7rem;}
  .hRow{display:flex; align-items:center; gap:8px; padding:6px 2px; font-size:.85rem;
    border-bottom:1px solid rgba(46,59,94,.4);}
  .hRow:last-child{border-bottom:none;}
  .hD{width:78px; color:var(--dim); font-size:.78rem;}
  .hT{flex:1;}
  .hM{color:var(--dim); font-variant-numeric:tabular-nums; font-size:.8rem;}
  .hP{width:44px; text-align:left; font-variant-numeric:tabular-nums; font-size:.8rem;}
  .hP.good{color:var(--green);} .hP.mid{color:#d9b45b;} .hP.low{color:#e0a06a;}
  .openCard{border-color:var(--gold-soft); background:linear-gradient(135deg,var(--card2),var(--card));}
  /* ===== פאנל מוטמע ===== */
  .panel{background:var(--card); border:1px solid var(--line); border-radius:16px;
    margin-top:10px; overflow:hidden;}
  .panTop{display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 12px; border-bottom:1px solid var(--line); background:var(--card2);}
  .panLbl{color:var(--gold); font-size:.8rem;}
  .panBody{padding:16px 16px 6px; max-height:52vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .panBody .tP{margin:0 0 16px; line-height:2.05; text-align:justify;}
  .panBody .tHint{margin:0 0 12px;}
  .panSec{color:var(--gold); font-size:.82rem; margin:16px 0 6px; padding-top:10px;
    border-top:1px solid var(--line);}
  .panEmpty{color:var(--dim); text-align:center; padding:22px 10px; line-height:1.7; font-size:.9rem;}
  .panNav{display:flex; align-items:center; gap:8px; padding:10px 12px;
    border-top:1px solid var(--line); background:var(--card2);}
  .panBtn{flex:1; background:var(--card); border:1px solid var(--line); color:var(--text);
    border-radius:11px; padding:11px 0; font-size:.92rem; cursor:pointer;}
  .panBtn.go{background:var(--gold); color:#1a1a10; border-color:var(--gold); font-weight:700;}
  .panBtn:disabled{opacity:.35;}
  .panPos{color:var(--dim); font-size:.78rem; font-variant-numeric:tabular-nums; flex:none; min-width:56px; text-align:center;}
  /* ===== מסך קריאת הטקסט ===== */
  .textOv{position:fixed; inset:0; z-index:65; background:var(--bg);
    display:flex; flex-direction:column;}
  .tTop{display:flex; align-items:center; gap:8px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
    border-bottom:1px solid var(--line); background:var(--card);}
  .tTitle{flex:1; font-size:.95rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tClock{color:var(--dim); font-size:.8rem; font-variant-numeric:tabular-nums; flex:none;}
  .tClock.over{color:#e0a06a;}
  .tFs{background:var(--card2); border:1px solid var(--line); color:var(--text);
    border-radius:9px; width:38px; height:32px; font-size:.85rem; cursor:pointer; flex:none;}
  .tBody{flex:1; overflow-y:auto; padding:18px 18px 30px; -webkit-overflow-scrolling:touch;}
  .tP{margin:0 0 18px; line-height:2.05; text-align:justify; color:var(--text);}
  .tHint{color:var(--gold); font-size:.78em; margin:0 0 10px; padding-inline-start:10px;
    border-inline-start:2px solid var(--gold-soft); line-height:1.5;}

<body>
<div id="app"></div>
<script src="content.js"></script>
<script src="texts.js"></script>
<script>
"use strict";
/* ================= הגדרות ושמירה ================= */
const DEF = {shacharit:40, mincha:15, maariv:12, kriatShma:6, israel:true, minyan:false, autoAdv:true, view:"progress", ttPlace:"start", from:"", to:"", rt:true};
let settings = loadSettings();
function loadSettings(){
  try{ const s = JSON.parse(localStorage.getItem("mse-settings")); return Object.assign({},DEF,s||{}); }
  catch(e){ return Object.assign({},DEF); }
}
function saveSettings(){ try{ localStorage.setItem("mse-settings", JSON.stringify(settings)); }catch(e){} }

/* ================= לוח עברי (Intl) ================= */
const MONTH_MAP = {
  "Tishri":"TISHREI","Tishrei":"TISHREI","Heshvan":"CHESHVAN","Cheshvan":"CHESHVAN","Marheshvan":"CHESHVAN",
  "Kislev":"KISLEV","Tevet":"TEVET","Shevat":"SHVAT","Shvat":"SHVAT",
  "Adar":"ADAR","Adar I":"ADAR1","Adar II":"ADAR2","AdarI":"ADAR1","AdarII":"ADAR2",
  "Nisan":"NISAN","Iyar":"IYAR","Sivan":"SIVAN","Tamuz":"TAMUZ","Tammuz":"TAMUZ","Av":"AV","Elul":"ELUL"
};
const MONTH_HE = {TISHREI:"תשרי",CHESHVAN:"חשוון",KISLEV:"כסלו",TEVET:"טבת",SHVAT:"שבט",
  ADAR:"אדר",ADAR1:"אדר א׳",ADAR2:"אדר ב׳",NISAN:"ניסן",IYAR:"אייר",SIVAN:"סיוון",TAMUZ:"תמוז",AV:"אב",ELUL:"אלול"};
function hebDate(d){
  const parts = new Intl.DateTimeFormat("en-u-ca-hebrew",{year:"numeric",month:"long",day:"numeric"}).formatToParts(d);
  let day=0, month="", year=0;
  for(const p of parts){
    if(p.type==="day") day = parseInt(p.value,10);
    if(p.type==="month") month = p.value;
    if(p.type==="year") year = parseInt(p.value,10);
  }
  return {day, month: MONTH_MAP[month] || month, year};
}
function hebDateHe(d){
  try{
    return new Intl.DateTimeFormat("he-u-ca-hebrew",{year:"numeric",month:"long",day:"numeric"}).format(d);
  }catch(e){ const h=hebDate(d); return h.day+" "+(MONTH_HE[h.month]||h.month)+" "+h.year; }
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }

/* אורך כסלו (לחישוב סוף חנוכה) */
function kislevLength(refDate){
  let d = new Date(refDate);
  for(let i=0;i<60;i++){
    const h = hebDate(d);
    if(h.month==="TEVET" && h.day===1){
      const prev = hebDate(addDays(d,-1));
      return prev.day;
    }
    d = addDays(d,-1);
  }
  return 30;
}

/* ================= דגלי היום ================= */
function dayFlags(civil, isMaariv){
  const eff = isMaariv ? addDays(civil,1) : civil;
  const h = hebDate(eff);
  const dow = civil.getDay();
  const f = {heb:h, effCivil:eff, dow,
    roshChodesh:false, cholHamoed:null, chanukah:0, purim:false, purimKatan:false,
    tachanun:true, hallel:null, yaaleVeyavo:false, geshem:false, matar:false,
    aseretYemeiTeshuva:false, omer:0, fast:null, yomtov:null, motzaeiShabbat:false};

  const M=h.month, D=h.day, IL=settings.israel;

  // ראש חודש (א' תשרי הוא ראש השנה ואינו נוהג כר"ח)
  if(D===30 || (D===1 && M!=="TISHREI")) f.roshChodesh = true;

  // חול המועד
  if(M==="NISAN"){ const from = IL?16:17; if(D>=from && D<=20) f.cholHamoed="פסח"; }
  if(M==="TISHREI"){ const from = IL?16:17; if(D>=from && D<=21) f.cholHamoed="סוכות"; }

  // חנוכה
  if(M==="KISLEV" && D>=25) f.chanukah = D-24;
  if(M==="TEVET" && D<=3){
    const kl = kislevLength(eff);
    const n = (kl-24)+D;
    if(n<=8) f.chanukah = n;
  }

  // פורים
  const adarP = (M==="ADAR"||M==="ADAR2");
  if(adarP && D===14) f.purim = true;
  if(M==="ADAR1" && (D===14||D===15)) f.purimKatan = true;

  // עשרת ימי תשובה
  if(M==="TISHREI" && D>=3 && D<=9) f.aseretYemeiTeshuva = true;

  // "לדוד ה' אורי" — מראש חודש אלול עד הושענא רבא
  f.ledavidOri = (M==="ELUL") || (M==="TISHREI" && D<=21);

  // ימים טובים
  const yt = [];
  if(M==="NISAN" && (D===15||D===21)) yt.push("פסח");
  if(!IL && M==="NISAN" && (D===16||D===22)) yt.push("פסח");
  if(M==="SIVAN" && D===6) yt.push("שבועות");
  if(!IL && M==="SIVAN" && D===7) yt.push("שבועות");
  if(M==="TISHREI" && (D===1||D===2)) yt.push("ראש השנה");
  if(M==="TISHREI" && D===10) yt.push("יום הכיפורים");
  if(M==="TISHREI" && D===15) yt.push("סוכות");
  if(!IL && M==="TISHREI" && D===16) yt.push("סוכות");
  if(M==="TISHREI" && D===22) yt.push(IL?"שמיני עצרת ושמחת תורה":"שמיני עצרת");
  if(!IL && M==="TISHREI" && D===23) yt.push("שמחת תורה");
  if(yt.length) f.yomtov = yt[0];

  // תעניות ציבור
  if(M==="TAMUZ" && D===17) f.fast="שבעה עשר בתמוז";
  if(M==="AV" && D===9) f.fast="תשעה באב";
  if(M==="TISHREI" && D===3) f.fast="צום גדליה";
  if(M==="TEVET" && D===10) f.fast="עשרה בטבת";
  if(adarP && D===13) f.fast="תענית אסתר";

  // תחנון — על פי המנהג בסידור תהלת ה'
  let noTach = false;
  if(f.roshChodesh) noTach=true;
  if(M==="NISAN") noTach=true;
  if(M==="IYAR" && (D===14||D===18)) noTach=true;
  if(M==="SIVAN" && D<=12) noTach=true;
  if(M==="AV" && (D===9||D===15)) noTach=true;
  if(M==="ELUL" && D===29) noTach=true;
  if(M==="TISHREI" && (D<=2 || D>=9)) noTach=true;
  if(f.chanukah) noTach=true;
  if(M==="SHVAT" && D===15) noTach=true;
  if(adarP && (D===14||D===15)) noTach=true;
  if(f.purimKatan) noTach=true;
  f.tachanun = !noTach;

  // הלל
  if(f.chanukah) f.hallel="שלם";
  else if(f.cholHamoed==="סוכות") f.hallel="שלם";
  else if(f.cholHamoed==="פסח") f.hallel="חצי";
  else if(f.roshChodesh) f.hallel="חצי";

  // יעלה ויבוא
  f.yaaleVeyavo = f.roshChodesh || !!f.cholHamoed;

  // ביום טוב נוסח התפילה שונה — אין להציג דגלי חול
  if(f.yomtov){ f.hallel=null; f.yaaleVeyavo=false; }

  // משיב הרוח / מוריד הטל
  const summerMonths = {IYAR:1,SIVAN:1,TAMUZ:1,AV:1,ELUL:1};
  let tal;
  if(M==="NISAN") tal = D>=15;
  else if(summerMonths[M]) tal = true;
  else if(M==="TISHREI") tal = D<=22;
  else tal = false;
  f.geshem = !tal;

  // ותן טל ומטר
  const winterMid = {KISLEV:1,TEVET:1,SHVAT:1,ADAR:1,ADAR1:1,ADAR2:1};
  if(IL){
    if(M==="CHESHVAN" && D>=7) f.matar=true;
    else if(winterMid[M]) f.matar=true;
    else if(M==="NISAN" && D<=14) f.matar=true;
    else f.matar=false;
  } else {
    const mm = eff.getMonth()+1, dd = eff.getDate();
    const afterDec4 = (mm===12 && dd>=5) || (mm>=1 && mm<=6);
    const beforePesach = winterMid[M] || M==="CHESHVAN" || (M==="NISAN" && D<=14);
    f.matar = afterDec4 && beforePesach;
  }

  // ספירת העומר
  if(M==="NISAN" && D>=16) f.omer = D-15;
  else if(M==="IYAR") f.omer = D+15;
  else if(M==="SIVAN" && D<=5) f.omer = D+44;

  f.motzaeiShabbat = isMaariv && dow===6;

  // קריאת התורה — מספר העולים והסיבה
  if(f.roshChodesh)        f.torah = {n:4, why:"ראש חודש"};
  else if(f.cholHamoed)    f.torah = {n:4, why:"חול המועד "+f.cholHamoed};
  else if(f.chanukah)      f.torah = {n:3, why:"חנוכה"};
  else if(f.purim)         f.torah = {n:3, why:"פורים"};
  else if(f.fast)          f.torah = {n:3, why:f.fast};
  else if(dow===1||dow===4) f.torah = {n:3, why:"שני וחמישי"};
  else f.torah = null;
  if(f.yomtov) f.torah = null;

  // מוסף
  f.musaf = (f.roshChodesh ? "ראש חודש" : (f.cholHamoed ? "חול המועד "+f.cholHamoed : null));
  if(f.yomtov) f.musaf = null;

  return f;
}

/* תזכורות לעמידה */
function amidahNotes(f, tefillah){
  const n=[];
  n.push(f.geshem ? "מַשִּׁיב הָרוּחַ וּמוֹרִיד הַגֶּשֶׁם" : "מוֹרִיד הַטָּל");
  n.push(f.matar ? "וְתֵן טַל וּמָטָר לִבְרָכָה" : "וְתֵן בְּרָכָה");
  if(f.yaaleVeyavo) n.push("יַעֲלֶה וְיָבֹא — "+(f.roshChodesh?"ראש חודש":"חול המועד "+f.cholHamoed));
  if(f.aseretYemeiTeshuva) n.push("הַמֶּלֶךְ הַקָּדוֹשׁ · זָכְרֵנוּ לְחַיִּים");
  if(f.chanukah) n.push("וְעַל הַנִּסִּים — חנוכה");
  if(f.purim) n.push("וְעַל הַנִּסִּים — פורים");
  if(f.fast && tefillah==="mincha") n.push("עֲנֵנוּ בשומע תפילה — "+f.fast);
  if(f.motzaeiShabbat) n.push("אַתָּה חוֹנַנְתָּנוּ");
  return n;
}

/* =================================================================
   מבנה התפילה — קטע כללי ובתוכו קטעים פרטיים.
   w = משקל יחסי לפי אורך הטקסט בסידור תהלת ה'.
   הזמן של כל קטע = (משקל הקטע / סך המשקלות) × הזמן שהוגדר לתפילה.
   ================================================================= */
/* שיר של יום — המזמור משתנה בכל יום, וכך גם אורכו.
   המשקל נגזר ממספר הפסוקים במזמור + הפסוקים הקבועים שאחריו. */
const SHIR_YOM = [
  {n:"יוֹם רִאשׁוֹן",  p:"לַה׳ הָאָרֶץ וּמְלוֹאָהּ", w:2.3},   // תהלים כד — י׳ פסוקים
  {n:"יוֹם שֵׁנִי",    p:"גָּדוֹל ה׳ וּמְהֻלָּל מְאֹד", w:3.2}, // תהלים מח — ט״ו
  {n:"יוֹם שְׁלִישִׁי", p:"אֱלֹהִים נִצָּב בַּעֲדַת אֵל", w:2.0},// תהלים פב — ח׳
  {n:"יוֹם רְבִיעִי",  p:"אֵל נְקָמוֹת ה׳", w:5.0},             // תהלים צד — כ״ג + ג׳
  {n:"יוֹם חֲמִישִׁי", p:"הַרְנִינוּ לֵאלֹהִים עוּזֵּנוּ", w:3.5},// תהלים פא — י״ז
  {n:"יוֹם שִׁשִּׁי",  p:"ה׳ מָלָךְ גֵּאוּת לָבֵשׁ", w:1.5},     // תהלים צג — ה׳
];

function buildStructure(tef, f){
  const G=[];
  const grp=(name)=>{ const g={name, subs:[]}; G.push(g); return g; };
  const add=(g,id,name,w,badge)=>g.subs.push({id,name,w,badge:badge||null});
  const isMonThu = f.dow===1 || f.dow===4;
  const sy = SHIR_YOM[f.dow] || SHIR_YOM[0];
  const M = !!settings.minyan;

  if(tef==="shacharit"){
    let g;
    g=grp("ברכות השחר");
    add(g,"modeh","מוֹדֶה אֲנִי",1);
    add(g,"netilat","עַל נְטִילַת יָדָיִם · אֲשֶׁר יָצַר",2.5);
    add(g,"neshama","אֱלֹהַי נְשָׁמָה",2);
    add(g,"birchot","בִּרְכוֹת הַשַּׁחַר",4);
    add(g,"yehiratzon","וִיהִי רָצוֹן · יְהִי רָצוֹן",3);
    add(g,"birkatTorah","בִּרְכוֹת הַתּוֹרָה",2.5);
    add(g,"kohanim","בִּרְכַּת כֹּהֲנִים · אֵלּוּ דְבָרִים",2.5);

    // מקום הנחת טלית ותפילין — לפי בחירת המשתמש
    const ttGroups = ()=>{
      let gg=grp("ציצית וטלית גדול");
      add(gg,"talit","עֲטִיפַת טַלִּית",2);
      gg=grp("תפילין");
      add(gg,"tefillin","הֲנָחַת תְּפִלִּין",2);
    };
    const TT = settings.ttPlace || "start";
    if(TT==="start") ttGroups();

    g=grp("תפילת השחר");
    add(g,"mahtovu","הֲרֵינִי מְקַבֵּל · מַה טֹּבוּ · אֲדוֹן עוֹלָם",3);
    if(f.tachanun) add(g,"zochreinu","אֱלֹהֵינוּ וֵאלֹהֵי אֲבוֹתֵינוּ — זָכְרֵנוּ",1.6,"רק בימי תחנון");

    ["וּסְפַרְתֶּם לָכֶם — שכל יום יאיר בעבודת המידות.","ויקרא כג, טו; על פי החסידות"],
  ],
  shmira:[
    ["הִנֵּה לֹא יָנוּם וְלֹא יִישָׁן שׁוֹמֵר יִשְׂרָאֵל.","תהלים קכא, ד"],
    ["כִּי מַלְאָכָיו יְצַוֶּה לָּךְ לִשְׁמָרְךָ בְּכָל דְּרָכֶיךָ.","תהלים צא, יא"],
    ["עוּרָה כְבוֹדִי, אָעִירָה שָּׁחַר — אני מעורר את השחר, ולא הוא אותי.","ברכות ג ע״ב; תהלים נז, ט"],
  ],
};
function quoteKey(subId, grpName){
  if(!subId) return "general";
  if(subId.startsWith("amida")||subId==="netzor") return "amidah";
  if(subId.startsWith("shma")||subId==="ahavat"||subId==="ahavat2"||subId==="emetv"||subId==="emet2") return "shma";
  if(subId==="viduy"||subId==="yudGimel"||subId==="ledavid"||subId==="vhurachum"||subId==="shomer"||subId==="avinuChanenu"||subId==="vanachnu"||subId==="avinu") return "tachanun";
  if(subId==="omer") return "omer";
  if(["modeh","netilat","neshama","birchot","yehiratzon","birkatTorah","kohanim","mahtovu"].includes(subId)) return "hachana";
  if(["deshen","tamid","ketoret","abaye","eizehu","ryishmael"].includes(subId)) return "korbanot";
  if(subId.indexOf("kd")===0 || subId.indexOf("msKd")===0) return "kaddish";
  if(subId.indexOf("tr")===0) return "torah";
  if(subId==="hallel") return "hallel";
  if(["kmYaalzu","kmYoshev","kmShirLam","kmGad","kmRibon","kmHamapil","hashkivenu"].includes(subId)) return "shmira";
  if(["kmViduy","kmRazei","kmOtiot","kmMizmor","kmAna","kmMechila"].includes(subId)) return "tachanun";
  if(["kmShma1","kmShma2","kmShma3","rtShma","rtVehaya","rtVayomer"].includes(subId)) return "shma";
  if(["chazara","chazaraMin","msChazara","musaf","kohanimSz","kohanimSzMin","msKohanim"].includes(subId)) return "amidah";
  if(["altira","maAltira","mnAltira"].includes(subId)) return "aleinu";
  if(["maAleinu"].includes(subId)) return "aleinu";
  if(subId.indexOf("mn")===0) return {mnViduy:"tachanun",mnYudGimel:"tachanun",mnLedavid:"tachanun",mnAvinu:"tachanun",mnAvinuYomi:"tachanun",mnVanachnu:"tachanun",mnAleinu:"aleinu",mnAltira:"aleinu",mnAshrei:"ashrei"}[subId] || subId.charAt(2).toLowerCase()+subId.slice(3);
  if(grpName && grpName.includes("פסוקי דזמרה")) return "psukei";
  if(grpName && grpName.includes("קרבנות")) return "korbanot";
  return "general";
}
function quotePool(subId, grpName){
  const sec = QUOTES[quoteKey(subId,grpName)] || [];
  const tef = QUOTES["p_"+(state.tef||"shacharit")] || [];
  // קודם פתגמי הקטע, אחר כך פתגמי התפילה, ולבסוף הכלליים
  const seen=new Set(), out=[];
  [].concat(sec,tef,QUOTES.general).forEach(q=>{ if(!seen.has(q[0])){ seen.add(q[0]); out.push(q); } });
  return out;
}

   2. מיקום בתכנון (planPos) — איפה אנחנו "אמורים" להיות ברצף הקטעים.
   נגיעה על קטע מזיזה רק את מיקום התכנון. סיימת קטע מוקדם? הצפי לסיום מתקצר. */

function fmt(ms){
  const neg = ms<0; ms=Math.abs(ms);
  const s=Math.floor(ms/1000), m=Math.floor(s/60), r=s%60;
  return (neg?"+":"")+String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function fmtMin(ms){
  const m = ms/60000;
  if(m>=9.5) return Math.round(m)+" דק׳";
  if(m>=1) return (Math.round(m*2)/2).toLocaleString("he")+" דק׳";
  return Math.max(5,Math.round(ms/1000/5)*5)+" שנ׳";
}

/* ---------- האשף: יחיד/מניין → טווח → משך ---------- */
function openWizard(tef){
  state.wiz = {
    tef, step:1,
    minyan: !!settings.minyan,
    from: tef==="shacharit" ? (settings.from||"") : "",
    to:   tef==="shacharit" ? (settings.to||"")   : "",
    mins: settings[tef] || DEF[tef]
  };
  renderHome();
}
function closeWizard(){ state.wiz=null; renderHome(); }
function wizStep(n){ state.wiz.step=n; renderWizard(); }

function wizGroups(){
  const w=state.wiz;
  const f=dayFlags(new Date(), w.tef==="maariv"||w.tef==="kriatShma");
  const prevM = settings.minyan; settings.minyan = w.minyan;
  const gc = groupChoices(w.tef,f);
  settings.minyan = prevM;
  return gc;
}
function wizCount(){
  const w=state.wiz;
  const prevM=settings.minyan, prevF=settings.from, prevT=settings.to;
  settings.minyan=w.minyan;
  const f=dayFlags(new Date(), w.tef==="maariv"||w.tef==="kriatShma");
  let G=buildStructure(w.tef,f);
  if(w.from){ const gi=G.findIndex(g=>g.subs.some(s=>s.id===w.from));
    if(gi>=0){ const si=G[gi].subs.findIndex(s=>s.id===w.from);
      G=G.slice(gi); G[0]={name:G[0].name,subs:G[0].subs.slice(si)}; } }
  if(w.to){ const gj=G.findIndex(g=>g.subs.some(s=>s.id===w.to));
    if(gj>=0){ const sj=G[gj].subs.findIndex(s=>s.id===w.to);
      G=G.slice(0,gj+1); G[gj]={name:G[gj].name,subs:G[gj].subs.slice(0,sj+1)}; } }
  settings.minyan=prevM; settings.from=prevF; settings.to=prevT;
  return {secs:G.reduce((a,g)=>a+g.subs.length,0), groups:G.length};
}

function renderWizard(){
  const w=state.wiz, tl=TEF_LIST.find(t=>t.id===w.tef);

  let body="";

  if(w.step===1){
    body = `

      </button>`;
  }

  if(w.step===2){
    const gc=wizGroups();
    const iFrom = w.from ? gc.findIndex(g=>g.firstId===w.from) : -1;
    body = `
      <div class="wizQ">מהיכן עד היכן?</div>
      <div class="segLbl">מתחילים ב־</div>
      <div class="segList">
        <button class="seg ${!w.from?"sel":""}" data-from="">מתחילת ${TEF_HE[w.tef]}</button>
        ${gc.map(g=>`<button class="seg ${w.from===g.firstId?"sel":""}" data-from="${g.firstId}">${g.label}</button>`).join("")}
      </div>
      <div class="segLbl">מסיימים ב־</div>
      <div class="segList">
        <button class="seg ${!w.to?"sel":""}" data-to="">עד סוף התפילה</button>
        ${gc.map((g,i)=>`<button class="seg ${w.to===g.lastId?"sel":""} ${i<iFrom?"dim":""}" data-to="${g.lastId}">${g.label}</button>`).join("")}
      </div>`;
  }

  if(w.step===3){
    const c=wizCount(), per=(w.mins*60/Math.max(1,c.secs));
    body = `
      <div class="wizQ">כמה זמן להקדיש?</div>
      <div class="minBig"><span id="minVal">${w.mins}</span><small>דקות</small></div>
      <div class="minRow">
        <button class="minBtn" data-d="-5">−5</button>
        <button class="minBtn" data-d="-1">−1</button>
        <button class="minBtn" data-d="1">+1</button>
        <button class="minBtn" data-d="5">+5</button>
      </div>
      <div class="chips" style="justify-content:center">
        ${(MIN_PRESETS[w.tef]||[]).map(m=>`<span class="chip pick ${w.mins===m?"on":""}" data-m="${m}">${m} דק׳</span>`).join("")}
      </div>
      <div class="card" style="margin-top:18px">
        <div class="sumRow"><span>תפילה</span><b>${TEF_HE[w.tef]}</b></div>
        <div class="sumRow"><span>אופן</span><b>${w.minyan?"במניין":"ביחיד"}</b></div>
        <div class="sumRow"><span>טווח</span><b>${wizRangeLabel()}</b></div>
        <div class="sumRow"><span>קטעים</span><b>${c.secs} בתוך ${c.groups} חלקים</b></div>
        <div class="sumRow"><span>ממוצע לקטע</span><b>${per>=60?fmt(per*1000):Math.round(per)+" שנ׳"}</b></div>
      </div>`;
  }

  const foot = w.step<3
    ? `<button class="wizNext" id="wizNext">המשך ›</button>`
    : `<button class="wizGo" id="wizGo">התחל ${TEF_HE[w.tef]} ›</button>`;

  app.innerHTML = `<div class="wizWrap">${head}${body}${foot}</div>`;

  document.getElementById("wizBack").addEventListener("click",()=>{
    if(w.step===1) closeWizard(); else wizStep(w.step-1);
  });
  const nx=document.getElementById("wizNext");
  if(nx) nx.addEventListener("click",()=>wizStep(w.step+1));

  document.querySelectorAll("[data-mn]").forEach(b=>b.addEventListener("click",()=>{
    w.minyan = b.dataset.mn==="1"; w.from=""; w.to=""; wizStep(2);
  }));
  document.querySelectorAll("[data-from]").forEach(b=>b.addEventListener("click",()=>{
    w.from=b.dataset.from;
    const gc=wizGroups(), i=w.from?gc.findIndex(g=>g.firstId===w.from):-1;
    const j=w.to?gc.findIndex(g=>g.lastId===w.to):-1;
    if(j>=0 && j<i) w.to="";
    renderWizard();
  }));
  document.querySelectorAll("[data-to]").forEach(b=>b.addEventListener("click",()=>{
    w.to=b.dataset.to; renderWizard();
  }));
  document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{
    w.mins=Math.max(2,Math.min(180,w.mins+parseInt(b.dataset.d,10))); renderWizard();
  }));
  document.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{
    w.mins=parseInt(b.dataset.m,10); renderWizard();
  }));
  const go=document.getElementById("wizGo");
  if(go) go.addEventListener("click",()=>{
    settings.minyan=w.minyan; settings[w.tef]=w.mins;
    if(w.tef==="shacharit"){ settings.from=w.from; settings.to=w.to; }
    saveSettings();
    const tef=w.tef, from=w.from, to=w.to;
    state.wiz=null;
    startPrayer(tef, from, null, to);
  });
}
function wizRangeLabel(){
  const w=state.wiz;
  if(!w.from && !w.to) return "כל התפילה";
  const gc=wizGroups();
  const a=w.from?(gc.find(g=>g.firstId===w.from)||{}).label:"ההתחלה";
  const b=w.to?(gc.find(g=>g.lastId===w.to)||{}).label:"הסוף";
  return a+" → "+b;
}

/* ---------- לשונית היסטוריה ---------- */
function viewHistory(){
  const h=loadHistory();
  if(!h.length) return `<h1>📊 היסטוריה</h1>
    <div class="card note" style="text-align:center;padding:30px 16px">
      עדיין לא נרשמו תפילות.<br>אחרי התפילה הראשונה יופיעו כאן הזמנים ואחוזי הריכוז.</div>`;
  const week=h.filter(r=>Date.now()-new Date(r.d).getTime()<7*864e5);
  const wAway=week.reduce((a,r)=>a+(r.away||0),0), wMs=week.reduce((a,r)=>a+r.ms,0);
  const wPct=wMs?Math.max(0,Math.round((1-wAway/wMs)*100)):100;
  const st=streakDays();
  const byDay={};
  h.forEach(r=>{ (byDay[r.d]=byDay[r.d]||[]).push(r); });
  const days=Object.keys(byDay).sort().reverse().slice(0,14);
  return `
    <h1>📊 היסטוריה</h1>
    <div class="card">
      <div class="hStats">
        <div><b>${week.length}</b><span>תפילות השבוע</span></div>
        <div><b>${wPct}%</b><span>ריכוז</span></div>
        <div><b>${st||0}</b><span>ימים ברצף</span></div>
      </div>
      <div class="sub" style="text-align:center">סה״כ ${fmt(wAway)} מחוץ לאפליקציה השבוע</div>
    </div>
    ${days.map(d=>{
      const dd=new Date(d);
      return `<div class="card" style="padding:10px 14px">

/* ================= תפילה ================= */
/* נקודות התחלה אפשריות לשחרית */
const START_POINTS = [
  {id:"", label:"מההתחלה"},
  {id:"birchot", label:"מברכות השחר"},
  {id:"deshen", label:"מקרבנות"},
  {id:"hodu", label:"מהודו"},
  {id:"baruchsheamar", label:"מפסוקי דזמרה"},
];

function startPrayer(tef, fromId, _unused, toArg){
  const now = new Date();
  const f = dayFlags(now, tef==="maariv" || tef==="kriatShma");
  let groups = buildStructure(tef,f);

  // טווח: מקטע עד קטע. מה שמחוץ לטווח יורד מהתפילה, והזמן מתחלק בין הנותרים.
  if(fromId){
    const gi = groups.findIndex(g=>g.subs.some(s=>s.id===fromId));
    if(gi>=0){
      const si = groups[gi].subs.findIndex(s=>s.id===fromId);
      groups = groups.slice(gi);
      groups[0] = {name:groups[0].name, subs:groups[0].subs.slice(si)};
    }
  }
  const toId = (toArg!==undefined && toArg!==null) ? toArg : settings.to;
  if(toId){
    const gj = groups.findIndex(g=>g.subs.some(s=>s.id===toId));
    if(gj>=0){
      const sj = groups[gj].subs.findIndex(s=>s.id===toId);
      groups = groups.slice(0,gj+1);
      groups[gj] = {name:groups[gj].name, subs:groups[gj].subs.slice(0,sj+1)};
    }
  }
  if(!groups.length || !groups.some(g=>g.subs.length)) { alert("הטווח שנבחר ריק — בודקים את הבחירה."); return; }
  state.fromId = fromId||"";
  state.toId = toId||"";

  // שיטוח + חישוב זמנים לפי משקל
  const flat=[];
  groups.forEach((g,gi)=>g.subs.forEach(s=>{ s.gi=gi; s.grpName=g.name; flat.push(s); }));
  const totalW = flat.reduce((a,s)=>a+s.w,0);
  const totalMs = settings[tef]*60000;
  let acc=0;
  flat.forEach((s,i)=>{ s.i=i; s.start = acc/totalW*totalMs; acc+=s.w; });
  // גבולות עקביים: סוף כל קטע = תחילת הבא (מונע שגיאות עיגול)
  flat.forEach((s,i)=>{
    s.end = (i+1<flat.length) ? flat[i+1].start : totalMs;
    s.dur = s.end - s.start;
  });
  groups.forEach(g=>{
    g.start = g.subs[0].start;
    g.end = g.subs[g.subs.length-1].end;
    g.dur = g.end - g.start;
  });
  const now2 = Date.now();
  flat[0]._enteredTs = now2;
  state = Object.assign(state,{screen:"prayer", tef, groups, flat, flags:f, fromId:fromId||"",
    startTs:now2, planAnchor:0, anchorTs:now2, log:[], done:new Set(), doneOpen:false,
    paused:false, pauseStart:0, rtReturn:null, away:[], awayStart:0, hold:false,
    totalMs, curIdx:0, quoteIdx:0});

  requestWake();
  renderPrayer();
  state.tickTimer = setInterval(tick, 500);
  state.quoteTimer = setInterval(()=>rotateQuote(false), 25000);
}

/* ---------- השהיה ---------- */
function togglePause(){
  if(state.paused){
    // בחזרה מזיזים את כל נקודות הייחוס קדימה — כאילו הזמן לא עבר
    const d = Date.now()-state.pauseStart;
    state.startTs += d;
    state.anchorTs += d;
    state.flat.forEach(s=>{ if(s._enteredTs) s._enteredTs += d; });
    state.paused = false;
    requestWake();
  } else {
    state.pauseStart = Date.now();
    state.paused = true;
    releaseWake();
  }
  renderPause();
  tick();
}
function renderPause(){
  const ov=document.getElementById("pauseOv");
  if(ov) ov.style.display = state.paused ? "flex" : "none";
  const b=document.getElementById("pauseBtn");
  if(b) b.textContent = state.paused ? "▶" : "⏸";
}
function restartPrayer(){
  if(!confirm("להתחיל את התפילה מחדש?")) return;
  startPrayer(state.tef, state.fromId);
}

/* ---------- יציאה מהתפילה: תמיד אפשר לחזור ---------- */
function askExit(){

/* חזרה לתפילה שנשארה פתוחה */
function resumePrayer(){
  if(!state.flat || !state.flat.length) return;
  const ov=document.getElementById("exitOv"); if(ov) ov.remove();
  state.screen = "prayer";
  state.open = false;
  state.pendingRec = null;
  requestWake();
  renderPrayer();
  state.tickTimer = setInterval(tick, 500);
  state.quoteTimer = setInterval(()=>rotateQuote(false), 25000);
  if(state.paused) togglePause();          // ממשיכים מאותה נקודה בדיוק
  tick();
}
function hasOpenPrayer(){ return !!(state.open && state.flat && state.flat.length); }

/* השעון האמיתי — כמה זמן באמת עבר */
function elapsed(){
  return (state.paused ? state.pauseStart : Date.now()) - state.startTs;
}

/* מיקום בתכנון — איפה אנחנו ברצף הקטעים */
function planPos(){
  return state.planAnchor + ((state.paused ? state.pauseStart : Date.now())-state.anchorTs);
}

/* מה נותר לפי התכנון = סכום הקטעים שעוד לא בוצעו, פחות ההתקדמות בקטע הנוכחי.
   סיימת קטע של 1:30 בדקה? כל 1:30 יורדים מהמאזן והצפי מתקצר ב-30 שניות. */
function planRemaining(){
  let ms=0;
  state.flat.forEach(s=>{ if(!state.done.has(s.i)) ms+=s.dur; });
  const s=state.flat[state.curIdx];
  if(s && !state.done.has(state.curIdx)){
    ms -= Math.min(s.dur, nowRef()-(s._enteredTs||state.anchorTs));
  }
  return Math.max(0,ms);
}
/* השעון "הקפוא" בזמן השהיה */
function nowRef(){ return state.paused ? state.pauseStart : Date.now(); }

/* קפיצה לקטע: רושמים ביומן כמה זמן באמת בילינו במקטע הקודם */
function jumpTo(i, byUser){
  const now2 = Date.now();
  const from = state.curIdx;
  if(from>=0 && from!==i){
    const s = state.flat[from];
    const spent = now2 - (s._enteredTs || state.anchorTs);
    if(spent>0) state.log.push({i:from, id:s.id, name:s.name, planned:s.dur, actual:spent, byUser:!!byUser});
  }
  state.planAnchor = state.flat[i].start;
  state.anchorTs = now2;
  state.hold = false;
  state.flat[i]._enteredTs = now2;
  state.curIdx = i;
}

/* ---------- רשימת הקטעים: בוצע (מקופל) → הקטע הנוכחי → הבא בתור ---------- */
function actualOf(i){
  let ms=0;
  state.log.forEach(r=>{ if(r.i===i) ms+=r.actual; });
  if(i===state.curIdx) ms += nowRef()-(state.flat[i]._enteredTs||state.anchorTs);
  return ms;
}

function renderList(){

          ${(settings.view||"progress")==="progress" && hasStudy(s.id)?`<button class="studyBtn" id="studyBtn">ℹ️</button>`:""}
          <button class="doneBtn" id="doneBtn">סיימתי ✓</button>

  wrap.innerHTML = doneHtml + curHtml + panelHtml(s) + rtHtml + upBlock;

  if(dh) dh.addEventListener("click",()=>{ state.doneOpen=!state.doneOpen; renderList(); });
  wrap.querySelectorAll("[data-back]").forEach(el=>el.addEventListener("click",()=>{
    goBack(parseInt(el.dataset.back,10));
  }));
  document.getElementById("doneBtn").addEventListener("click",()=>completeCurrent());
  const sb=document.getElementById("studyBtn");
  if(sb) sb.addEventListener("click",()=>openStudy(state.flat[state.curIdx]));
  const tb=document.getElementById("textBtn");
  if(tb) tb.addEventListener("click",()=>openText(state.flat[state.curIdx]));
  const hb=document.getElementById("holdBtn");
  if(hb) hb.addEventListener("click",()=>{ state.hold=!state.hold; renderList(); tick(); });
  const rb=document.getElementById("rtBtn");
  if(rb) rb.addEventListener("click",toggleRT);
  const uh=document.getElementById("upHdr");
  if(uh) uh.addEventListener("click",()=>{ state.upOpen=!state.upOpen; renderList(); });
  wrap.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{
    const d=parseInt(b.dataset.nav,10);
    if(d>0) completeCurrent();
    else if(state.curIdx>0) goBack(state.curIdx-1);
  }));
  wrap.querySelectorAll("[data-fs]").forEach(b=>b.addEventListener("click",()=>{
    let z=Math.max(.8,Math.min(2.2, fsize()+parseInt(b.dataset.fs,10)*0.1));
    try{ localStorage.setItem("mse-fs",z); }catch(e){}
    const pb=document.getElementById("panBody"); if(pb) pb.style.fontSize=z+"rem";
  }));
  wrap.querySelectorAll(".upRow").forEach(el=>attachRow(el));
  updateCurCard();
}

/* נגיעה = "אני אוחז כאן" · החלקה = "בוצע" */
function attachRow(el){
  const i=parseInt(el.dataset.i,10);
  const inner=el.querySelector(".upIn");
  let x0=null,y0=null,dx=0,moved=false;
  el.addEventListener("touchstart",e=>{
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; moved=false;
    inner.style.transition="none";
  },{passive:true});
  el.addEventListener("touchmove",e=>{
    if(x0===null) return;
    const nx=e.touches[0].clientX-x0, ny=e.touches[0].clientY-y0;
    if(Math.abs(ny)>Math.abs(nx)) return;      // גלילה אנכית
    dx=nx; moved=true;
    inner.style.transform="translateX("+dx+"px)";
    el.classList.toggle("swiping", Math.abs(dx)>60);
  },{passive:true});
  el.addEventListener("touchend",()=>{
    inner.style.transition="transform .18s";
    if(Math.abs(dx)>60){ markDone(i); return; }
    inner.style.transform="";
    el.classList.remove("swiping");
    if(!moved) goTo(i);
    x0=null;
  });
  el.addEventListener("click",()=>{ if(!moved) goTo(i); });
}

/* "אני אוחז כאן" קדימה: מה שלפניו נחשב שעבר */
function goTo(i){
  const from = state.curIdx;
  if(i>from){ for(let j=0;j<i;j++) state.done.add(j); }
  state.done.delete(i);
  jumpTo(i,true);
  renderList(); tick(); rotateQuote(true);
}

/* חזרה לקטע מתוך חלון "בוצע": מבטל את הסימון שלו ושל כל הקטעים
   שאחריו — הם חוזרים לרשימה. מה שלפניו נשאר מסומן. */
function goBack(i){
  for(let j=i;j<state.flat.length;j++) state.done.delete(j);
  jumpTo(i,true);
  renderList(); tick(); rotateQuote(true);
}

/* ---------- פאנל מוטמע: טקסט או מידע, מתחלף עם הקטע ---------- */
function fsize(){ try{ return parseFloat(localStorage.getItem("mse-fs"))||1; }catch(e){ return 1; } }

/* תנאים לפסקאות שנאמרות רק בימים מסוימים.
   הוראה בצורה "§@tag ..." חלה על עצמה ועל הפסקה שאחריה. */
const COND = {
  ayt:      f => !!(f && f.aseretYemeiTeshuva),
  rc:       f => !!(f && (f.roshChodesh || f.cholHamoed)),
  nisim:    f => !!(f && (f.chanukah || f.purim)),
  chanukah: f => !!(f && f.chanukah),
  purim:    f => !!(f && f.purim),
  geshem:   f => !!(f && f.geshem),
  tal:      f => !(f && f.geshem),
  monthu:   f => !!(f && (f.dow===1 || f.dow===4)),
  minyan:   () => !!settings.minyan,
  tishabav: f => !!(f && f.fast && String(f.fast).indexOf("תשעה באב")>=0),
  motzash:  f => !!(f && f.motzaeiShabbat),
  fast:     f => !!(f && f.fast)
};

function applyCond(arr){
  const f = state.flags;
  const out = [];
  for(let i=0;i<arr.length;i++){
    const p = arr[i];
    const m = /^§@([a-z]+)\s*/.exec(p);
    if(!m){ out.push(p); continue; }
    const test = COND[m[1]];
    const show = test ? test(f) : true;
    if(show){
      out.push("§ " + p.slice(m[0].length));
      if(i+1<arr.length && arr[i+1].indexOf("§")!==0) out.push(arr[++i]);
    } else {
      if(i+1<arr.length && arr[i+1].indexOf("§")!==0) i++;
    }
  }
  return out;
}

/* מחזיר את נוסח הקטע. קטעים מסוימים משתנים לפי היום. */
function textFor(id){
  let t;
  if(id==="shirshelyom" && typeof SHIR_YOM_TEXTS!=="undefined"){
    const d = (state.flags && typeof state.flags.dow==="number") ? state.flags.dow : new Date().getDay();
    t = SHIR_YOM_TEXTS[d] || SHIR_YOM_TEXTS[0];
  } else if(id==="omer" && typeof OMER_DAYS!=="undefined"){
    /* מכניסים את ספירת הלילה עצמו במקום ההוראה הכללית */
    const n = state.flags && state.flags.omer;
    t = (TEXTS.omer||[]).slice();
    if(n>0 && OMER_DAYS[n-1]) t.splice(1, 0, "§ ספירת הלילה", OMER_DAYS[n-1]);
  } else {
    t = TEXTS[id];
  }
  return t ? applyCond(t) : t;
}

/* ---------- מסך קריאה: נוסח התפילה ---------- */
function hasText(id){ return typeof TEXTS!=="undefined" && !!TEXTS[id]; }

function updateTextClock(){

  c.className = "tClock"+(over>0?" over":"");

/* ---------- מעבר לתפילין דרבינו תם וחזרה ---------- */
function inRT(){ const s=state.flat[state.curIdx]; return !!(s && s.rt); }
function hasRT(){ return state.flat.some(s=>s.rt); }
function firstRT(){
  let i = state.flat.findIndex(s=>s.rt && !state.done.has(s.i));
  if(i<0) i = state.flat.findIndex(s=>s.rt);
  return i;
}
/* מעבר בלי לסמן כלום — התפילה ממתינה במקום שעזבנו */
function toggleRT(){
  if(inRT()){
    const back = (state.rtReturn!=null && state.flat[state.rtReturn]) ? state.rtReturn : 0;
    state.rtReturn = null;
    state.done.delete(back);
    jumpTo(back,true);
  } else {
    const j = firstRT();
    if(j<0) return;
    state.rtReturn = state.curIdx;
    state.done.delete(j);
    jumpTo(j,true);
  }
  renderList(); tick(); rotateQuote(true);
}

/* סימון קטע כבוצע */
function markDone(i){
  state.done.add(i);
  if(i===state.curIdx) advanceToNextOpen();
  else { renderList(); tick(); }
}

/* סיום הקטע הנוכחי — הזמן שנחסך יורד מהמאזן */
function completeCurrent(){
  state.done.add(state.curIdx);
  advanceToNextOpen();
}

function advanceToNextOpen(){
  const wasRT = inRT();
  let n=-1;
  // קודם ממשיכים קדימה מהמקום הנוכחי
  for(let j=state.curIdx+1;j<state.flat.length;j++){ if(!state.done.has(j)){ n=j; break; } }
  // בסיום תפילין דר"ת — חוזרים למקום שעזבנו בתפילה
  if(wasRT && (n<0 || !state.flat[n].rt) &&
     state.rtReturn!=null && state.flat[state.rtReturn] && !state.done.has(state.rtReturn)){
    n = state.rtReturn; state.rtReturn = null;
  }
  // ואם הכל מאחור בוצע — חוזרים לקטע הפתוח הראשון
  if(n<0) for(let j=0;j<state.curIdx;j++){ if(!state.done.has(j)){ n=j; break; } }
  if(n<0){ renderDone(false); return; }
  jumpTo(n,true);
  renderList(); tick(); rotateQuote(true);
}

function updateCurCard(){
  const s=state.flat[state.curIdx]; if(!s) return;
  const el=document.getElementById("curElapsed"), fill=document.getElementById("curBarFill");
  const spent = nowRef()-(s._enteredTs||state.anchorTs);
  const over = spent - s.dur;
  if(el) el.textContent = fmt(spent) + (over>0 ? "  (+"+fmt(over)+")" : "");
  if(el) el.className = "curElapsed" + (over>0 ? " over" : "");
  if(fill){
    const p=Math.min(100, spent/s.dur*100);
    fill.style.width=p+"%";
    fill.style.background = over>0 ? "#e0a06a" : "var(--gold)";
  }
  const n=document.getElementById("curNote");
  if(n){
    const manual = settings.autoAdv===false;
    if(state.hold)      { n.textContent="📌 נעול — לא יתקדם לבד"; n.className="curNote hold"; }
    else if(manual)     { n.textContent="מצב ידני — ההתקדמות רק בלחיצה"; n.className="curNote hold"; }
    else if(over>0)     { n.textContent="הזמן המתוכנן נגמר — יעבור בקרוב. לנעילה: 📍"; n.className="curNote warn"; }
    else                { n.textContent=""; n.className="curNote"; }
  }
}

function tick(){
  if(state.screen!=="prayer") return;
  const clock = document.getElementById("clock");
  if(!clock) return;
  if(state.paused){
    const pi=document.getElementById("pauseInfo");
    if(pi) pi.textContent = "עברו "+fmt(elapsed())+" · "+state.flat[state.curIdx].name;
    return;
  }

  const e = elapsed();          // השעון האמיתי
  const p = planPos();          // המיקום בתכנון

  // הזמן המתוכנן של הקטע הנוכחי נגמר? הוא נחשב שעבר, ועוברים לבא שלא בוצע
  const s0 = state.flat[state.curIdx];
  const autoOn = settings.autoAdv !== false && !state.hold;
  if(s0 && p >= s0.end && autoOn){
    state.done.add(state.curIdx);
    advanceToNextOpen();   // שומר על סדר קדימה ועל החזרה מר"ת
    return;                // advanceToNextOpen כבר מרענן ומחשב מחדש
  }

  // שעון: הזמן שבאמת עבר
  clock.textContent = fmt(e);

  // צפי לסיום = מה שעבר באמת + מה שנותר לפי התכנון
  const remPlan = planRemaining();
  const projected = e + remPlan;
  const remEl = document.getElementById("remain");
  remEl.textContent = remPlan>0
    ? "נותרו כ־"+fmt(remPlan)+" · צפי סיום: "+Math.round(projected/60000)+" דק׳"
    : "הגעת לסוף התכנון — קחו את הזמן, העיקר הכוונה";
  clock.classList.toggle("over", projected > state.totalMs*1.15);

  // מד קצב: הזמן שבאמת עבר מול הזמן המתוכנן של מה שכבר עברת
  const diff = e - (state.totalMs - remPlan);
  const paceEl = document.getElementById("pace");
  if(paceEl){
    if(Math.abs(diff) < 30000){
      paceEl.textContent = "בקצב המתוכנן ✓";
      paceEl.className = "pace ok";
    } else if(diff < 0){
      paceEl.textContent = "מקדים ב־"+fmt(-diff)+" — אפשר להאט ולכוון";
      paceEl.className = "pace fast";
    } else {
      paceEl.textContent = "מאחר ב־"+fmt(diff)+" מהתכנון";
      paceEl.className = "pace slow";
    }
  }

  // שורת יציאות מהאפליקציה
  const al=document.getElementById("awayLine");
  if(al){
    const aw=awayTotal();
    al.textContent = aw ? "מחוץ לאפליקציה: "+fmt(aw)+" ב־"+state.away.length+" יציאות" : "";
    al.className = "awayLine"+(aw?" on":"");
  }

  // התקדמות כללית = כמה קטעים כבר מאחורינו (לפי משקל הזמן)
  let doneMs=0;
  state.done.forEach(i=>{ doneMs += state.flat[i].dur; });
  document.getElementById("bar").style.width =
    Math.min(100, Math.max(0, doneMs/state.totalMs*100))+"%";

  updateCurCard();
  updateTextClock();
}

function rotateQuote(reset){
  const q=document.getElementById("quote");
  if(!q) return;
  const sub = state.curIdx>=0 ? state.flat[state.curIdx] : null;
  const pool = quotePool(sub?sub.id:null, sub?sub.grpName:null);
  if(reset) state.quoteIdx = 0; else state.quoteIdx=(state.quoteIdx+1)%pool.length;
  const [t,s]=pool[state.quoteIdx % pool.length];
  q.classList.add("fade");
  setTimeout(()=>{
    const qt=document.getElementById("qText"), qs=document.getElementById("qSrc");
    if(qt){ qt.textContent=t; qs.textContent="— "+s; }
    q.classList.remove("fade");
  },300);
}

/* ================= סיום ================= */
function renderDone(aborted){
  const totalReal = elapsed();
  // סוגרים את הקטע האחרון ביומן
  // בונים יומן סופי בלי לשנות את המצב — כדי שאפשר יהיה לחזור לתפילה
  const finalLog = state.log.slice();
  if(state.curIdx>=0 && state.flat[state.curIdx]){
    const s=state.flat[state.curIdx];
    const spent = nowRef()-(s._enteredTs||state.anchorTs);
    if(spent>0) finalLog.push({i:state.curIdx, id:s.id, name:s.name, planned:s.dur, actual:spent, byUser:false});
  }
  // סוגרים יציאה פתוחה (אם סיימו מיד עם החזרה)
  if(state.awayStart){
    const ms=Date.now()-state.awayStart; state.awayStart=0;
    if(ms>=AWAY_MIN) state.away.push({ms, at:Date.now(), sec:""});
  }
  clearTimers(); releaseWake();
  state.screen="done";

  // זמן בפועל לכל קטע (איחוד חזרות)
  const spentBy={};
  finalLog.forEach(r=>{ spentBy[r.i]=(spentBy[r.i]||0)+r.actual; });

  // כל הקטעים שבוצעו — כולל כאלה שסומנו בהחלקה בלי לשהות בהם
  const doneIdx = [...new Set([...state.done, state.curIdx])].sort((a,b)=>a-b)
    .filter(i=>state.flat[i]);
  const rows = doneIdx.map(i=>({
    name: state.flat[i].name,
    planned: state.flat[i].dur,
    actual: spentBy[i]||0,
    skipped: (spentBy[i]||0) < 2000
  }));
  const visited = rows.filter(r=>!r.skipped);

  const plannedTotal = state.totalMs;
  const dt = totalReal - plannedTotal;
  const dtTxt = Math.abs(dt)<45000 ? "בדיוק לפי התכנון"
    : (dt<0 ? "מהיר ב־"+fmt(-dt)+" מהמתוכנן" : "ארוך ב־"+fmt(dt)+" מהמתוכנן");

  // הקטע שהכי התעכבו בו, והכי מיהרו בו (רק מבין אלה ששהית בהם)
  let slowest=null, fastest=null;
  visited.forEach(r=>{
    const d = r.actual-r.planned;
    if(!slowest || d>slowest.d) slowest={r,d};
    if(!fastest || d<fastest.d) fastest={r,d};
  });

  const rowsHtml = rows.map(r=>{
    if(r.skipped) return `<div class="logRow skip">
      <div class="ln">${r.name}</div><div class="lt">—</div><div class="ld">סומן</div></div>`;
    const d = r.actual-r.planned;
    const cls = Math.abs(d)<15000 ? "ok" : (d<0 ? "fast" : "slow");
    const sign = d<0 ? "−" : "+";
    return `<div class="logRow">
      <div class="ln">${r.name}</div>
      <div class="lt">${fmt(r.actual)}</div>
      <div class="ld ${cls}">${Math.abs(d)<15000?"✓":sign+fmt(Math.abs(d))}</div>
    </div>`;
  }).join("");

  app.innerHTML = `<div style="padding-top:10px">
    <div style="text-align:center">
      <div style="font-size:2.3rem">🙏</div>
      <h1>${aborted?"התפילה הופסקה":"יישר כוח!"}</h1>
      <div class="big">${fmt(totalReal)}</div>
      <div class="sub">${TEF_HE[state.tef]} · ${hebDateHe(new Date())}</div>
      <div class="sub" style="margin-top:8px">מתוכנן: ${Math.round(plannedTotal/60000)} דק׳ · ${dtTxt}</div>
      <div class="sub">${rows.length} מתוך ${state.flat.length} קטעים${rows.length>visited.length?` · ${rows.length-visited.length} סומנו`:""}</div>
    </div>

    ${(()=>{
      const aw = awayTotal(), n = state.away.length;
      if(!n) return `<div class="card focus good">
        <div class="focusTop"><span>🎯 ריכוז</span><span class="focusBig">100%</span></div>
        <div class="sub">לא יצאת מהאפליקציה אפילו פעם אחת. יישר כוח.</div></div>`;
      const pct = Math.max(0, Math.round((1-aw/totalReal)*100));
      const cls = pct>=90?"good":(pct>=70?"mid":"low");
      const longest = state.away.reduce((a,x)=>x.ms>a.ms?x:a, state.away[0]);
      return `<div class="card focus ${cls}">
        <div class="focusTop"><span>🎯 ריכוז</span><span class="focusBig">${pct}%</span></div>
        <div class="focusRow"><span>זמן מחוץ לאפליקציה</span><b>${fmt(aw)}</b></div>
        <div class="focusRow"><span>מספר יציאות</span><b>${n}</b></div>
        <div class="focusRow"><span>היציאה הארוכה</span><b>${fmt(longest.ms)}</b></div>
        ${longest.sec?`<div class="sub" style="margin-top:8px">היציאה הארוכה היתה ב"${longest.sec}"</div>`:""}
      </div>`;
    })()}

    ${slowest&&slowest.d>20000?`<div class="card"><div class="sub">התארכת במיוחד ב־</div>
      <div style="font-size:1.05rem;margin-top:4px">${slowest.r.name}</div>
      <div class="sub">${fmt(slowest.r.actual)} במקום ${fmt(slowest.r.planned)}</div></div>`:""}

    ${fastest&&fastest.d<-20000?`<div class="card"><div class="sub">עברת הכי מהר ב־</div>
      <div style="font-size:1.05rem;margin-top:4px">${fastest.r.name}</div>
      <div class="sub">${fmt(fastest.r.actual)} במקום ${fmt(fastest.r.planned)} — אולי שווה לחזור לשם מחר בנחת</div></div>`:""}

    <div class="card" style="padding:8px 10px">
      <div class="logHead"><div>קטע</div><div>בפועל</div><div>מול התכנון</div></div>
      ${rowsHtml || `<div class="sub" style="padding:10px">אין נתונים</div>`}
    </div>

    <div class="pasuk" style="text-align:center">יִהְיוּ לְרָצוֹן אִמְרֵי פִי וְהֶגְיוֹן לִבִּי לְפָנֶיךָ,<br>ה׳ צוּרִי וְגוֹאֲלִי</div>
    <div style="text-align:center">
      ${aborted?`<button class="homeBtn" id="resBtn">↩ חזרה לתפילה</button><br>`:""}
      <button class="homeBtn" id="homeBtn" ${aborted?'style="background:var(--card2);color:var(--gold);border:1px solid var(--gold-soft);margin-top:10px"':""}>חזרה למסך הראשי</button>
    </div>
  </div>`;
  const rs=document.getElementById("resBtn");
  if(rs) rs.addEventListener("click",resumePrayer);
  document.getElementById("homeBtn").addEventListener("click",()=>{
    // יוצאים סופית — רק עכשיו נרשמת התפילה שהופסקה בהיסטוריה
    if(state.pendingRec && state.pendingRec.ms>60000){ saveHistory(state.pendingRec); }
    state.pendingRec=null; state.open=false; state.flat=[];
    state.screen="home"; renderHome();
  });

  // שמירה בהיסטוריה — בסיום אמיתי מיד, ובהפסקה רק אם באמת ויתרו על החזרה
  const rec = {
    d: new Date().toISOString().slice(0,10),
    t: state.tef, ms: totalReal, plan: plannedTotal,
    away: awayTotal(), awayN: state.away.length,
    secs: rows.length, total: state.flat.length, ab: !!aborted
  };
  if(!aborted){ state.open=false; saveHistory(rec); }
  else { state.open = true; state.pendingRec = rec; }
}

function clearTimers(){
  if(state.tickTimer){ clearInterval(state.tickTimer); state.tickTimer=null; }
  if(state.quoteTimer){ clearInterval(state.quoteTimer); state.quoteTimer=null; }
}

/* מסך דולק בזמן תפילה */
async function requestWake(){
  try{ if("wakeLock" in navigator) state.wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
function releaseWake(){ try{ if(state.wakeLock){ state.wakeLock.release(); state.wakeLock=null; } }catch(e){} }
/* ================= מעקב יציאות מהאפליקציה =================
   בזמן תפילה: כשעוזבים את האפליקציה נרשם הזמן, וכשחוזרים
   מחשבים כמה זמן מתוך התפילה עבר מחוץ לה. */
const AWAY_MIN = 4000;   // פחות מזה — כנראה לא יציאה אמיתית

document.addEventListener("visibilitychange",()=>{
  if(state.screen!=="prayer") return;
  if(document.visibilityState==="hidden"){
    if(!state.paused) state.awayStart = Date.now();
  } else {
    requestWake();
    if(state.awayStart){
      const ms = Date.now()-state.awayStart;
      state.awayStart = 0;
      if(ms>=AWAY_MIN){
        state.away.push({ms, at:Date.now(), sec:state.flat[state.curIdx]?state.flat[state.curIdx].name:""});
        showReturn(ms);
      }
    }
  }
});

function awayTotal(){ return state.away.reduce((a,x)=>a+x.ms,0); }

function showReturn(ms){
  if(document.getElementById("backOv")) return;
  const total = awayTotal(), n = state.away.length;
  const el=document.createElement("div");
  el.className="backOv"; el.id="backOv";
  el.innerHTML = `
    <div class="backBox">
      <div style="font-size:2.2rem">🕯</div>
      <div class="backT">חזרת לתפילה</div>
      <div class="backBig">${fmt(ms)}</div>
      <div class="sub">היית מחוץ לאפליקציה</div>
      ${n>1?`<div class="sub" style="margin-top:8px">סה״כ היום בתפילה זו: ${fmt(total)} ב־${n} יציאות</div>`:""}
      <div class="backNm">${state.flat[state.curIdx].name}</div>
      <button class="startBtn" id="backBtn" style="margin-top:16px">ממשיך להתפלל</button>
    </div>`;
  document.body.appendChild(el);
  document.getElementById("backBtn").addEventListener("click",()=>el.remove());
}

/* ================= היסטוריית תפילות ================= */
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem("mse-history")) || []; }catch(e){ return []; }
}
function saveHistory(rec){
  try{
    const h = loadHistory();
    h.unshift(rec);
    localStorage.setItem("mse-history", JSON.stringify(h.slice(0,60)));
  }catch(e){}
}
function streakDays(){
  const h = loadHistory();
  if(!h.length) return 0;
  const days = [...new Set(h.map(r=>r.d))].sort().reverse();
  const today = new Date().toISOString().slice(0,10);
  const yest = new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(days[0]!==today && days[0]!==yest) return 0;
  let n=1, prev=new Date(days[0]);
  for(let i=1;i<days.length;i++){
    const d=new Date(days[i]);
    if(Math.round((prev-d)/864e5)===1){ n++; prev=d; } else break;
  }
  return n;
}

/* ================= התקנה כאפליקציה ================= */
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  deferredInstall = e;
  wireInstall();
});
window.addEventListener("appinstalled", ()=>{
  deferredInstall = null;
  const b=document.getElementById("installBar"); if(b) b.classList.remove("show");
});
function wireInstall(){
  const bar=document.getElementById("installBar");
  if(!bar) return;
  let dismissed=false;
  try{ dismissed = localStorage.getItem("mse-install-x")==="1"; }catch(e){}
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if(deferredInstall && !dismissed && !standalone) bar.classList.add("show");
  const btn=document.getElementById("installBtn"), x=document.getElementById("installX");
  if(btn) btn.onclick = async ()=>{
    if(!deferredInstall) return;
    deferredInstall.prompt();
    await deferredInstall.userChoice;
    deferredInstall = null;
    bar.classList.remove("show");
  };
  if(x) x.onclick = ()=>{
    try{ localStorage.setItem("mse-install-x","1"); }catch(e){}
    bar.classList.remove("show");
  };
}
